# LumiLearn 框架配置文件
# 服务器、模型、安全等配置

version: "0.2.0-beta"
debug: false

# 轻量自学模式（lite）：仅保留核心学习服务，适合低资源/自学场景
lite_mode: false

server:
  terminal_port: 18080
  api_port: 18081
  host: "0.0.0.0"

# 端口服务选择性配置（Admin 面板「端口管理」可修改）
# enabled: 是否启用该端口服务；port: 自定义端口号
# 端口整合后仅保留 management 门户(terminal) + REST API(api) 两端口；
# 教师/学生/分析仪表盘已并入统一门户，models/teacher/student/analytics 均已停用。
port_settings:
  terminal:
    enabled: true
    port: 18080
  api:
    enabled: true
    port: 18081
  models:
    enabled: false
    port: 18082
  teacher_portal:
    enabled: false
    port: 5001
  student_portal:
    enabled: false
    port: 5010
  analytics_dashboard:
    enabled: false
    port: 18090

ollama:
  # 默认连接本地 Ollama；也可通过环境变量 OLLAMA_BASE_URL 覆盖远程地址
  base_url: "http://localhost:11434"
  default_model: "lumilearn-v2:latest"
  feynman_model: "qwen2.5:7b"   # 费曼引导默认模型（上下文利用更强）
  timeout: 300

models:
  providers: {}

security:
  api_key_required: false
  allowed_origins:
    - "*"

# 资料管线（framework/resources importer）
# web_import_enabled 默认关闭，需管理员显式开启以防滥用/注入；本地导入不受限。
resources:
  web_import_enabled: false
  max_web_bytes: 500000
  timeout: 15
  upload_exts:
    - md
    - txt
    - html
    - htm
    - ppt
    - pptx
