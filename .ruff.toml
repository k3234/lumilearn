# LumiLearn ruff 配置
# 宽松 CI 模式：仅检查真正可能导致程序错误的规则
#   E9  : 语法错误 / 无法运行的代码
#   F63 : 变量使用前未定义 / 条件判断恒真等逻辑错误
#   F7  : 循环内 return 等不可达代码
#   F82 : 引用未定义名称
# 这样既能捕获真实 bug，又不会因风格建议（typing.List、f-string 等）导致 CI 全红
select = ["E9", "F63", "F7", "F82"]
line-length = 120

# 排除非 Python 源码目录（Jupyter notebook 结构不完整，ruff 会误报语法错误）
exclude = [
    "notebooks",
    "docs",
    "skills",
    "tianhong",
    "animation",
]
