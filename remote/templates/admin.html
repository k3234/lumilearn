<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LumiLearn 管理面板</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Microsoft YaHei", sans-serif; background: #0d1117; color: #e6edf3; }
  .login-wrap { display: flex; justify-content: center; align-items: center; height: 100vh; }
  .login-card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 40px; width: 360px; }
  .login-card h1 { font-size: 22px; margin-bottom: 24px; color: #58a6ff; }
  .login-card input { width: 100%; padding: 12px; margin-bottom: 12px; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #e6edf3; font-size: 14px; }
  .login-card button { width: 100%; padding: 12px; background: #238636; border: none; border-radius: 6px; color: #fff; font-size: 15px; cursor: pointer; }
  .login-card button:hover { background: #2ea043; }
  .error { color: #f85149; font-size: 13px; margin-bottom: 10px; min-height: 18px; }
  .app { display: none; }
  .sidebar { position: fixed; left: 0; top: 0; width: 200px; height: 100vh; background: #161b22; border-right: 1px solid #30363d; padding-top: 20px; }
  .sidebar .brand { padding: 0 20px; font-size: 18px; font-weight: bold; color: #58a6ff; margin-bottom: 30px; }
  .sidebar .nav-item { display: block; width: 100%; padding: 12px 20px; color: #8b949e; background: none; border: none; text-align: left; font-size: 14px; cursor: pointer; }
  .sidebar .nav-item:hover, .sidebar .nav-item.active { color: #58a6ff; background: #0d1117; border-left: 3px solid #58a6ff; }
  .main { margin-left: 200px; padding: 24px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
  .topbar h2 { font-size: 20px; }
  .topbar .user { color: #8b949e; font-size: 13px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .card { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 20px; }
  .card .num { font-size: 28px; font-weight: bold; color: #58a6ff; }
  .card .label { font-size: 13px; color: #8b949e; margin-top: 6px; }
  .panel { display: none; background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 20px; }
  .panel.active { display: block; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #21262d; }
  th { color: #8b949e; font-weight: normal; }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 12px; }
  .badge.ok { background: #1f6feb33; color: #58a6ff; }
  .badge.on { background: #23863633; color: #3fb950; }
  .badge.off { background: #30363d; color: #8b949e; }
  .badge.err { background: #f8514933; color: #f85149; }
  button.act { padding: 6px 14px; margin-right: 6px; background: #21262d; border: 1px solid #30363d; border-radius: 6px; color: #e6edf3; cursor: pointer; font-size: 12px; }
  button.act:hover { border-color: #58a6ff; color: #58a6ff; }
  button.act.danger:hover { border-color: #f85149; color: #f85149; }
  .form-row { display: flex; gap: 10px; margin-bottom: 16px; }
  .form-row input { flex: 1; padding: 10px; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #e6edf3; }
  .form-row select { padding: 10px; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #e6edf3; }
  .toast { position: fixed; top: 20px; right: 20px; background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 12px 20px; z-index: 999; display: none; }
  .toast.show { display: block; }
  pre.log-box { background: #0d1117; border: 1px solid #30363d; border-radius: 6px; padding: 12px; max-height: 500px; overflow-y: auto; font-size: 12px; line-height: 1.6; }
  .sub-tabs { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 1px solid #30363d; padding-bottom: 0; }
  .sub-tab { padding: 8px 16px; background: none; border: none; color: #8b949e; cursor: pointer; font-size: 13px; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .sub-tab:hover { color: #58a6ff; }
  .sub-tab.active { color: #58a6ff; border-bottom-color: #58a6ff; }
  .sub-panel { display: none; }
  .sub-panel.active { display: block; }
  .provider-card { background: #0d1117; border: 1px solid #30363d; border-radius: 8px; padding: 16px; margin-bottom: 12px; }
  .provider-card h4 { margin: 0 0 8px 0; font-size: 14px; color: #e6edf3; }
  .provider-card .row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
  .provider-card .row input { flex: 1; padding: 8px; background: #161b22; border: 1px solid #30363d; border-radius: 6px; color: #e6edf3; font-size: 13px; }
  .provider-card .row input[type="password"] { font-family: monospace; letter-spacing: 2px; }
  .provider-card .row label { font-size: 12px; color: #8b949e; min-width: 60px; }
  .provider-card .models-list { font-size: 12px; color: #8b949e; margin-top: 4px; }
  .provider-card .models-list span { display: inline-block; background: #21262d; padding: 2px 8px; border-radius: 4px; margin: 2px; }
  .toggle { display: inline-block; width: 36px; height: 20px; background: #30363d; border-radius: 10px; cursor: pointer; position: relative; transition: 0.2s; }
  .toggle.on { background: #238636; }
  .toggle::after { content: ''; position: absolute; width: 16px; height: 16px; background: white; border-radius: 50%; top: 2px; left: 2px; transition: 0.2s; }
  .toggle.on::after { left: 18px; }
  .port-card { background: #0d1117; border: 1px solid #30363d; border-radius: 8px; padding: 16px; margin-bottom: 12px; display: flex; align-items: center; gap: 16px; }
  .port-card .port-name { font-size: 14px; font-weight: 500; min-width: 140px; color: #e6edf3; }
  .port-card .port-current { font-size: 12px; color: #8b949e; min-width: 180px; }
  .port-card select { padding: 6px 10px; background: #161b22; border: 1px solid #30363d; border-radius: 6px; color: #e6edf3; font-size: 12px; flex: 1; }
  .port-collapse { margin-top: 0; margin-bottom: 12px; display: none; }
  .port-collapse.open { display: block; }
  .port-collapse .model-item { display: flex; align-items: center; justify-content: space-between; padding: 6px 12px; border-bottom: 1px solid #21262d; font-size: 13px; }
  .port-collapse .model-item:last-child { border-bottom: none; }
  .port-collapse .model-item .tag { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 500; }
  .port-collapse .model-item .tag.local { background: #1f6feb33; color: #58a6ff; }
  .port-collapse .model-item .tag.cloud { background: #23863633; color: #3fb950; }
  .toggle-btn { background: none; border: 1px solid #30363d; border-radius: 6px; color: #8b949e; cursor: pointer; font-size: 12px; padding: 4px 10px; white-space: nowrap; }
  .toggle-btn:hover { color: #58a6ff; border-color: #58a6ff; }
  .toggle-btn .arrow { display: inline-block; transition: transform 0.2s; margin-right: 4px; }
  .toggle-btn .arrow.open { transform: rotate(90deg); }
</style>
</head>
<body>

<div class="login-wrap" id="loginWrap">
  <div class="login-card">
    <h1>🔐 LumiLearn 管理面板</h1>
    <div class="error" id="loginError"></div>
    <input type="text" id="username" placeholder="用户名" value="admin">
    <input type="password" id="password" placeholder="密码" autocomplete="current-password">
    <button onclick="doLogin()">登 录</button>
  </div>
</div>

<div class="app" id="app">
  <div class="sidebar">
    <div class="brand">LumiLearn Admin</div>
    <button class="nav-item active" data-panel="overview" onclick="switchPanel('overview')">📊 系统概览</button>
    <button class="nav-item" data-panel="users" onclick="switchPanel('users')">👥 用户管理</button>
    <button class="nav-item" data-panel="models" onclick="switchPanel('models')">🤖 模型管理</button>
    <button class="nav-item" data-panel="agents" onclick="switchPanel('agents')">🧠 Agent管理</button>
    <button class="nav-item" data-panel="logs" onclick="switchPanel('logs')">📜 系统日志</button>
    <button class="nav-item" data-panel="reports" onclick="switchPanel('reports')">📚 学习记录</button>
    <button class="nav-item" data-panel="memories" onclick="switchPanel('memories')">🧠 三层记忆</button>
    <button class="nav-item" data-panel="analytics" onclick="switchPanel('analytics')">📈 数据可视化</button>
    <button class="nav-item" data-panel="keys" onclick="switchPanel('keys')">🔑 API密钥</button>
    <button class="nav-item" data-panel="ports" onclick="switchPanel('ports')">🔌 端口管理</button>
    <button class="nav-item" data-panel="mcp" onclick="switchPanel('mcp')">🧩 MCP Server</button>
    <button class="nav-item" data-panel="tasks" onclick="switchPanel('tasks')">📋 任务队列</button>
    <button class="nav-item" data-panel="admins" onclick="switchPanel('admins')">👑 管理员管理</button>
    <button class="nav-item" data-panel="exports" onclick="switchPanel('exports')">📦 数据导出</button>
    <button class="nav-item" data-panel="settings" onclick="switchPanel('settings')">⚙️ 设置</button>
    <div style="position:absolute; bottom:20px; left:20px; right:20px;">
      <button class="act" onclick="logout()" style="width:100%;">退出登录</button>
    </div>
  </div>
  <div class="main">
    <div class="topbar">
      <h2 id="panelTitle">系统概览</h2>
      <div class="user" id="adminInfo"></div>
    </div>
    <div id="content"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = '/api/admin';
let TOKEN = localStorage.getItem('admin_token') || '';

async function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
  if (TOKEN) headers['X-Admin-Token'] = TOKEN;
  const resp = await fetch(API + path, { ...opts, headers });
  if (resp.status === 401) { location.reload(); throw new Error('未登录'); }
  const data = await resp.json().catch(() => ({}));
  if (!resp.ok && data.error) throw new Error(data.error);
  return data;
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

async function doLogin() {
  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;
  try {
    const data = await fetch(API + '/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    }).then(r => r.json());
    if (!data.success) throw new Error(data.error || '登录失败');
    TOKEN = data.token;
    localStorage.setItem('admin_token', TOKEN);
    document.getElementById('loginWrap').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    init();
  } catch (e) { document.getElementById('loginError').textContent = e.message; }
}

function logout() {
  api('/logout', { method: 'POST' }).catch(() => {});
  TOKEN = '';
  localStorage.removeItem('admin_token');
  location.reload();
}

function switchPanel(name) {
  document.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.panel === name));
  const titles = { overview: '系统概览', users: '用户管理', models: '模型管理', agents: 'Agent管理', logs: '系统日志', reports: '学习记录', memories: '三层记忆', reasoning: '推理记录', analytics: '数据可视化', keys: 'API密钥', ports: '端口管理', mcp: 'MCP Server', interrupts: '待审批队列', costs: '成本报告', weights: '权重配置', admins: '管理员管理', exports: '数据导出', settings: '设置' };
  document.getElementById('panelTitle').textContent = titles[name];
  loaders[name]();
}

const loaders = {
  overview: loadOverview,
  users: loadUsers,
  models: loadModels,
  agents: loadAgents,
  logs: loadLogs,
  keys: loadKeys,
  reports: loadReports,
  memories: loadMemories,
  reasoning: loadReasoning,
  analytics: loadAnalytics,
  ports: loadPorts,
  mcp: loadMcpServers,
  admins: loadAdmins,
  exports: loadExports,
  settings: loadSettings,
};

async function init() {
  const me = await api('/me');
  document.getElementById('adminInfo').textContent = `${me.admin.display_name || me.admin.username} (${me.admin.role})`;
  loadOverview();
}

// ---------- 概览 ----------
async function loadOverview() {
  const data = await api('/overview');
  const s = data.stats;
  const m = data.model_status;
  document.getElementById('content').innerHTML = `
    <div class="cards">
      <div class="card"><div class="num">${s.total_users}</div><div class="label">总用户</div></div>
      <div class="card"><div class="num">${s.total_students}</div><div class="label">学生</div></div>
      <div class="card"><div class="num">${s.total_teachers}</div><div class="label">教师</div></div>
      <div class="card"><div class="num">${s.total_workflows}</div><div class="label">学习工作流</div></div>
      <div class="card"><div class="num">${s.total_detections}</div><div class="label">输出检测</div></div>
      <div class="card"><div class="num">${s.running_agents}/${s.total_agents}</div><div class="label">运行中 Agent</div></div>
    </div>
    <h3 style="margin:16px 0 10px;color:#8b949e;">模型服务状态</h3>
    <div class="cards">
      <div class="card"><div class="num" style="font-size:18px;">${esc(m.status || 'unknown')}</div><div class="label">网关状态</div></div>
      <div class="card"><div class="num" style="font-size:18px;">${m.models ?? '-'}</div><div class="label">本地模型数</div></div>
      <div class="card"><div class="num" style="font-size:18px;">${m.latency_ms ?? '-'}ms</div><div class="label">响应延迟</div></div>
    </div>
    <h3 style="margin:16px 0 10px;color:#8b949e;">最近活动（系统 + 学生使用记录）</h3>
    <pre class="log-box">${(data.recent_logs || []).map(l => {
      const _tag = {system: '⚙️ 系统', reasoning: '🧠 推理', report: '📚 报告'}[l.source] || l.source;
      const _c = {system: '#58a6ff', reasoning: '#3fb950', report: '#d29922'}[l.source] || '#8b949e';
      return `[${esc(l.created_at)}] [<b style="color:${esc(_c)}">${esc(_tag)}</b>] [${esc(l.module)}] ${esc(l.message)}`;
    }).join('\n') || '（暂无活动，快去课堂/五步学习吧）'}</pre>`;
}

// ---------- 用户管理 ----------
async function loadUsers() {
  const data = await api('/users');
  let allClasses = [];
  try { allClasses = (await api('/classes')).classes || []; } catch (e) {}
  document.getElementById('content').innerHTML = `
    <div class="form-row">
      <input id="newUserName" placeholder="姓名">
      <input id="newUserUsername" placeholder="登录用户名(默认=姓名)" style="flex:0.8;">
      <input id="newUserPassword" type="password" placeholder="初始密码(≥4位)" style="flex:0.8;">
      <select id="newUserRole">
        <option value="student">学生</option>
        <option value="teacher">教师</option>
      </select>
      <button class="act" onclick="createUser()">添加用户</button>
    </div>
    <div style="font-size:12px;color:#8b949e;margin-bottom:12px;">提示: 学生/教师可用"登录用户名+密码"在学习平台(端口5000)、教师端(端口5001)、学生端(端口5010) 登录；管理员可在此为账号绑定班级、启停用账号、变更角色。</div>
    <table>
      <tr><th>ID</th><th>姓名</th><th>用户名</th><th>角色</th><th>状态</th><th>班级</th><th>密码</th><th>创建时间</th><th>操作</th></tr>
      ${data.users.map(u => `
        <tr>
          <td>${u.id}</td><td>${esc(u.name)}</td><td>${esc(u.username || u.name)}</td><td>${esc(u.role)}</td>
          <td>${u.is_active === 0 ? '<span class="badge err">已禁用</span>' : '<span class="badge ok">启用</span>'}</td>
          <td>${(u.classes || []).map(c => `<span class="badge">${esc(c.school_name)} / ${esc(c.grade_name)} / ${esc(c.class_name)}
                <a href="javascript:void(0)" data-act="unbind" data-id="${u.id}" data-class-id="${c.id}" data-name="${esc(u.name)}" style="color:#f85149;">✕</a></span>`).join(' ') || '-'}
              ${u.role === 'student' && allClasses.length ? `<select id="cls_${u.id}" style="width:auto;max-width:140px;font-size:12px;padding:2px 4px;">
                <option value="">+绑定班级</option>${allClasses.map(c => `<option value="${c.id}">${esc(c.school_name)} / ${esc(c.grade_name)} / ${esc(c.name)}</option>`).join('')}</select>
              <button class="act" style="padding:2px 8px;font-size:12px;" data-act="bind" data-id="${u.id}" data-name="${esc(u.name)}">绑定</button>` : ''}</td>
          <td>${u.has_password ? '<span class="badge ok">已设置</span>' : '<span class="badge off">未设置</span>'}</td>
          <td>${esc(u.created_at || '-')}</td>
          <td><button class="act" data-act="resetPwd" data-id="${u.id}" data-name="${esc(u.name)}">重置密码</button>
              <button class="act" data-act="toggleActive" data-id="${u.id}" data-target-active="${u.is_active === 0 ? 1 : 0}" data-name="${esc(u.name)}">${u.is_active === 0 ? '启用' : '禁用'}</button>
              <button class="act" data-act="changeRole" data-id="${u.id}" data-new-role="${u.role === 'teacher' ? 'student' : 'teacher'}" data-name="${esc(u.name)}">设为${u.role === 'teacher' ? '学生' : '教师'}</button>
              <button class="act danger" onclick="deleteUser(${u.id})">删除</button></td>
        </tr>`).join('')}
    </table>`;
  bindUserActions();
}

// 用户表格操作按钮：用户数据不拼入 onclick 属性，改为 data-* 属性 + 事件绑定，防止注入
function bindUserActions() {
  document.querySelectorAll('#content [data-act="unbind"], #content [data-act="bind"], #content [data-act="resetPwd"], #content [data-act="toggleActive"], #content [data-act="changeRole"]').forEach(btn => {
    btn.addEventListener('click', () => {
      const act = btn.dataset.act;
      const id = Number(btn.dataset.id);
      const name = btn.dataset.name || '';
      if (act === 'unbind') unbindClass(id, Number(btn.dataset.classId), name);
      else if (act === 'bind') bindClass(id, name);
      else if (act === 'resetPwd') resetUserPassword(id, name);
      else if (act === 'toggleActive') toggleUserActive(id, Number(btn.dataset.targetActive), name);
      else if (act === 'changeRole') changeUserRole(id, btn.dataset.newRole, name);
    });
  });
}

async function bindClass(userId, name) {
  const sel = document.getElementById('cls_' + userId);
  if (!sel || !sel.value) return toast('请先选择班级');
  await api(`/users/${userId}/classes`, { method: 'POST', body: JSON.stringify({ class_id: parseInt(sel.value, 10) }) });
  toast(`已将 ${name} 绑定到班级`);
  loadUsers();
}

async function unbindClass(userId, classId, name) {
  if (!confirm(`确认解除 ${name} 与班级 #${classId} 的绑定？`)) return;
  await api(`/users/${userId}/classes/${classId}`, { method: 'DELETE' });
  toast('已解除绑定');
  loadUsers();
}

async function createUser() {
  const name = document.getElementById('newUserName').value;
  const username = document.getElementById('newUserUsername').value;
  const password = document.getElementById('newUserPassword').value;
  const role = document.getElementById('newUserRole').value;
  if (!name) return toast('请输入姓名');
  if (!password || password.length < 4) return toast('请输入至少4位初始密码');
  await api('/users', { method: 'POST', body: JSON.stringify({ name, role, username, password }) });
  toast('用户已创建');
  loadUsers();
}

async function resetUserPassword(id, name) {
  const newPwd = prompt(`为用户 ${name} 设置新密码（至少4位）`);
  if (!newPwd) return;
  if (newPwd.length < 4) return toast('密码至少4位');
  await api(`/users/${id}/password`, { method: 'POST', body: JSON.stringify({ password: newPwd }) });
  toast('密码已重置');
  loadUsers();
}

async function toggleUserActive(id, isActive, name) {
  if (!confirm(`确认${isActive ? '启用' : '禁用'}账号 ${name}？禁用后该账号将无法登录。`)) return;
  try {
    const d = await api(`/users/${id}/active`, { method: 'POST', body: JSON.stringify({ is_active: isActive }) });
    toast(d.message || '✅ 已更新');
    loadUsers();
  } catch (e) { toast('❌ ' + e.message); }
}

async function changeUserRole(id, role, name) {
  if (!confirm(`确认将 ${name} 的角色变更为"${role === 'teacher' ? '教师' : '学生'}"？`)) return;
  try {
    const d = await api(`/users/${id}/role`, { method: 'POST', body: JSON.stringify({ role }) });
    toast(`✅ ${name} 角色已更新`);
    loadUsers();
  } catch (e) { toast('❌ ' + e.message); }
}

async function deleteUser(id) {
  if (!confirm(`确认删除用户 #${id}？此操作不可恢复。`)) return;
  await api(`/users/${id}`, { method: 'DELETE' });
  toast('用户已删除');
  loadUsers();
}

// ---------- 模型管理 ----------
let _currentModelSubTab = 'local';

async function loadModels() {
  document.getElementById('content').innerHTML = `
    <div class="sub-tabs">
      <button class="sub-tab active" data-sub="local" onclick="switchModelSubTab('local')">本地模型</button>
      <button class="sub-tab" data-sub="providers" onclick="switchModelSubTab('providers')">云端提供者</button>
      <button class="sub-tab" data-sub="ports" onclick="switchModelSubTab('ports')">端口模型配置</button>
    </div>
    <div id="modelSubContent"></div>`;
  _currentModelSubTab = 'local';
  renderLocalModels();
}

function switchModelSubTab(tab) {
  document.querySelectorAll('.sub-tab').forEach(b => b.classList.toggle('active', b.dataset.sub === tab));

}

async function pullModel() {

async function deleteModel(name) {

  const data = await api('/models/delete', { method: 'POST', body: JSON.stringify({ model: name }) });
  toast(data.message || data.error || '操作完成');
  renderLocalModels();
}

async function setDefault(name) {
  await api('/models/default', { method: 'POST', body: JSON.stringify({ model: name }) });
  toast(`默认模型已设为 ${name}`);
}

// ---- 子标签页2: 云端提供者管理 ----
async function renderProviders() {
  try {
    const data = await api('/providers');
    const providers = data.providers || [];
    const templates = data.templates || [];
    const el = document.getElementById('modelSubContent');

    // 构建提供者列表
    let listHtml = '<h3 style="color:#58a6ff;margin-bottom:12px;font-size:15px;">已配置的提供者</h3>';
    for (const p of providers) {
      const modelsHtml = (p.models || []).map(m => `<span>${esc(m.id || m.name || m)}</span>`).join(' ');
      listHtml += `
        <div class="provider-card">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <div>
              <h4>${esc(p.name)} <span style="color:#8b949e;font-size:12px;font-weight:normal;">(${esc(p.key)})</span></h4>
              <div style="font-size:12px;color:#8b949e;">${esc(p.base_url)}</div>
              <div class="models-list">${modelsHtml || '<span style="color:#8b949e;">无模型</span>'}</div>
            </div>
            <div style="display:flex;align-items:center;gap:12px;">
              <div style="display:flex;align-items:center;gap:6px;font-size:12px;color:#8b949e;">
                <span>API Key: ${p.has_api_key ? '✅ 已配置' : '❌ 未配置'}</span>
                <span>|</span>
                <span>启用: <span class="toggle ${p.enabled ? 'on' : ''}" data-act="toggleProviderEnabled" data-key="${esc(p.key)}" style="vertical-align:middle;"></span></span>
              </div>
              <button class="act" data-act="editProvider" data-key="${esc(p.key)}">编辑</button>
              <button class="act danger" data-act="deleteProvider" data-key="${esc(p.key)}">删除</button>
            </div>
          </div>
        </div>`;
    }
    if (!providers.length) listHtml += '<div style="color:#8b949e;font-size:13px;padding:12px 0;">暂无已配置的云端提供者</div>';

    // 构建模板选择 + 添加区域
    let templateOpts = templates.map(t => `<option value="${esc(t.key)}">${esc(t.name)}</option>`).join('');
    listHtml += `
      <h3 style="color:#58a6ff;margin:20px 0 12px;font-size:15px;">添加/编辑提供者</h3>
      <div style="background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:20px;">
        <div class="form-row">
          <select id="providerTemplate" onchange="onProviderTemplateChange()" style="padding:10px;background:#0d1117;border:1px solid #30363d;border-radius:6px;color:#e6edf3;flex:1;">
            <option value="">-- 选择模板或手动输入 --</option>
            ${templateOpts}
          </select>
        </div>
        <div class="form-row">
          <input id="providerKey" placeholder="提供者标识 (如 deepseek)" style="flex:1;">
          <input id="providerName" placeholder="名称 (如 DeepSeek)" style="flex:1;">
        </div>
        <div class="form-row">
          <input id="providerBaseUrl" placeholder="API 地址 (如 https://api.deepseek.com/v1)" style="flex:2;">
          <input id="providerApiKey" type="password" placeholder="API Key" style="flex:1;">
        </div>
        <div class="form-row">
          <input id="providerModels" placeholder="模型列表 (逗号分隔, 如 deepseek-chat,deepseek-reasoner)" style="flex:2;">
          <button class="act" onclick="saveProvider()" style="background:#238636;border-color:#238636;color:white;padding:10px 20px;font-weight:bold;">保存提供者</button>
        </div>
        <div style="font-size:12px;color:#8b949e;margin-top:4px;">提示: 选择模板自动填充标识/名称/地址/模型，API Key 需手动输入。编辑时不填 API Key 则保留原有值。</div>
      </div>`;

    el.innerHTML = listHtml;
    document.querySelectorAll('#modelSubContent [data-act="toggleProviderEnabled"], #modelSubContent [data-act="editProvider"], #modelSubContent [data-act="deleteProvider"]').forEach(btn => {
      btn.addEventListener('click', () => {
        const key = btn.dataset.key || '';
        const act = btn.dataset.act;
        if (act === 'toggleProviderEnabled') toggleProviderEnabled(key);
        else if (act === 'editProvider') editProvider(key);
        else if (act === 'deleteProvider') deleteProvider(key);
      });
    });
  } catch (e) {
    document.getElementById('modelSubContent').innerHTML = `<div style="color:#f85149;font-size:13px;">加载失败: ${esc(e.message)}</div>`;
  }
}

function onProviderTemplateChange() {
  const key = document.getElementById('providerTemplate').value;
  if (!key) return;
  // 从模板列表获取数据
  api('/providers').then(data => {
    const tmpl = (data.templates || []).find(t => t.key === key);
    if (!tmpl) return;
    document.getElementById('providerKey').value = tmpl.key;
    document.getElementById('providerName').value = tmpl.name;
    document.getElementById('providerBaseUrl').value = tmpl.base_url;
    document.getElementById('providerModels').value = (tmpl.models || []).map(m => m.id).join(', ');
  }).catch(() => {});
}

async function saveProvider() {
  const key = document.getElementById('providerKey').value.trim();
  const name = document.getElementById('providerName').value.trim();
  const base_url = document.getElementById('providerBaseUrl').value.trim();
  const api_key = document.getElementById('providerApiKey').value.trim();
  const modelsStr = document.getElementById('providerModels').value.trim();

  if (!key || !name) return toast('提供者标识和名称不能为空');

  let models = null;
  if (modelsStr) {
    models = modelsStr.split(',').map(s => ({ id: s.trim(), name: s.trim() })).filter(m => m.id);
  }

  await api('/providers', {
    method: 'POST',
    body: JSON.stringify({ key, name, base_url, api_key, enabled: true, models })
  });
  toast('提供者已保存');
  // 清空表单
  document.getElementById('providerKey').value = '';
  document.getElementById('providerName').value = '';
  document.getElementById('providerBaseUrl').value = '';
  document.getElementById('providerApiKey').value = '';
  document.getElementById('providerModels').value = '';
  document.getElementById('providerTemplate').value = '';
  renderProviders();
}

async function editProvider(key) {
  // 获取提供者详情并填充到表单
  try {
    const data = await api('/providers');
    const provider = (data.providers || []).find(p => p.key === key);
    if (!provider) return toast('提供者不存在');
    document.getElementById('providerKey').value = provider.key;
    document.getElementById('providerName').value = provider.name;
    document.getElementById('providerBaseUrl').value = provider.base_url;
    document.getElementById('providerApiKey').value = '';
    document.getElementById('providerModels').value = (provider.models || []).map(m => m.id || m.name || m).join(', ');
    document.getElementById('providerTemplate').value = '';
    toast('已加载提供者信息到表单，修改后点击保存');
  } catch (e) {
    toast('加载失败: ' + e.message);
  }
}

async function toggleProviderEnabled(key) {
  try {
    const data = await api('/providers');
    const provider = (data.providers || []).find(p => p.key === key);
    if (!provider) return;
    await api('/providers', {
      method: 'POST',
      body: JSON.stringify({ key: provider.key, name: provider.name, base_url: provider.base_url, api_key: '', enabled: !provider.enabled, models: provider.models })
    });
    renderProviders();
  } catch (e) {
    toast('操作失败: ' + e.message);
  }
}

async function deleteProvider(key) {
  if (!confirm(`确认删除提供者 ${key}？`)) return;
  await api(`/providers/${key}`, { method: 'DELETE' });
  toast('提供者已删除');
  renderProviders();
}

// ---- 子标签页3: 端口模型配置 ----
async function renderPortModels() {
  try {
    const data = await api('/port-models');
    const portMap = data.port_map || {};
    const allModels = data.all_models || [];
    const el = document.getElementById('modelSubContent');

    // 按提供者分组
    const grouped = {};
    for (const m of allModels) {
      const p = m.provider || 'ollama';
      if (!grouped[p]) grouped[p] = [];
      grouped[p].push(m);
    }

    // 显示说明
    let html = `<div style="color:#8b949e;font-size:13px;margin-bottom:16px;padding:12px;background:#0d1117;border:1px solid #30363d;border-radius:8px;">
      为每个服务端口指定使用的模型提供者和模型。所有端口默认使用 Ollama 本地模型。
    </div>`;

    const portKeys = Object.keys(portMap);
    // 全局折叠状态追踪
    if (typeof window._portCollapseStates === 'undefined') window._portCollapseStates = {};
    if (typeof window._portCollapseIcons === 'undefined') window._portCollapseIcons = {};

    for (const pk of portKeys) {
      const pm = portMap[pk];
      const displayName = pm.display_name || pk;
      const currentProvider = pm.provider || 'ollama';
      const currentModel = pm.model || '';

      // 构建提供者选择框
      let providerOpts = '<option value="ollama">Ollama (本地)</option>';
      for (const provKey of Object.keys(grouped)) {
        if (provKey === 'ollama') continue;
        const display = grouped[provKey][0]?.provider_display || provKey;
        providerOpts += `<option value="${esc(provKey)}" ${provKey === currentProvider ? 'selected' : ''}>${esc(display)}</option>`;
      }

      // 当前选择提供者的模型列表
      const currentModels = grouped[currentProvider] || grouped['ollama'] || [];
      let modelOpts = '';
      for (const m of currentModels) {
        const modelName = m.name || m;
        const selected = modelName === currentModel ? 'selected' : '';
        modelOpts += `<option value="${esc(modelName)}" ${selected}>${esc(modelName)}</option>`;
      }
      if (currentModel && !currentModels.find(m => (m.name || m) === currentModel)) {
        modelOpts = `<option value="${esc(currentModel)}" selected>${esc(currentModel)}</option>` + modelOpts;
      }

      // 构建所有可用模型列表（用于折叠菜单）
      let allModelsHtml = '';
      for (const m of allModels) {
        const modelName = m.name || m;
        const isLocal = (m.provider || 'ollama') === 'ollama';
        const tagClass = isLocal ? 'local' : 'cloud';
        const tagText = isLocal ? '本地模型' : '云端模型';
        const providerLabel = m.provider_display || (isLocal ? 'Ollama' : m.provider || '');
        allModelsHtml += `
          <div class="model-item">
            <span style="color:#e6edf3;">${esc(modelName)}</span>
            <span><span class="tag ${tagClass}">${tagText}</span>${!isLocal ? ` <span style="color:#8b949e;font-size:11px;">· ${esc(providerLabel)}</span>` : ''}</span>
          </div>`;
      }
      if (!allModelsHtml) allModelsHtml = '<div class="model-item" style="color:#8b949e;">暂无可用模型</div>';

      const collapseId = `collapse_${pk}`;
      const isOpen = window._portCollapseStates[pk] || false;

      html += `
        <div class="port-card" style="flex-wrap:wrap;">
          <div style="display:flex;align-items:center;gap:16px;flex:1;min-width:0;flex-wrap:wrap;">
            <div class="port-name">${esc(displayName)}</div>
            <div class="port-current">当前: ${esc(currentProvider)}/${esc(currentModel)}</div>
            <select id="portProvider_${esc(pk)}" onchange="onPortProviderChange('${esc(pk)}')" style="min-width:140px;">
              ${providerOpts}
            </select>
            <select id="portModel_${esc(pk)}" style="min-width:160px;">
              ${modelOpts}
            </select>
            <button class="act" onclick="savePortModel('${esc(pk)}')" style="background:#238636;border-color:#238636;color:white;font-weight:bold;">保存</button>
          </div>
          <button class="toggle-btn" onclick="togglePortCollapse('${esc(pk)}')" title="查看所有可用模型" style="margin-left:auto;">
            <span class="arrow ${isOpen ? 'open' : ''}" id="arrow_${esc(pk)}">▶</span>
            <span id="collapseLabel_${esc(pk)}">${isOpen ? '收起' : '展开'}可用模型</span>
            <span style="color:#8b949e;font-size:11px;">(${allModels.length}个)</span>
          </button>
        </div>
        <div class="port-collapse ${isOpen ? 'open' : ''}" id="${esc(collapseId)}">
          <div style="background:#0d1117;border:1px solid #30363d;border-top:none;border-radius:0 0 8px 8px;padding:4px 0;">
            ${allModelsHtml}
          </div>
        </div>`;
    }

    html += `<div style="font-size:12px;color:#8b949e;margin-top:8px;">提示: 修改后需重启对应服务端口才能生效。</div>`;
    el.innerHTML = html;
  } catch (e) {
    document.getElementById('modelSubContent').innerHTML = `<div style="color:#f85149;font-size:13px;">加载失败: ${esc(e.message)}</div>`;
  }
}

function togglePortCollapse(portKey) {
  const el = document.getElementById(`collapse_${portKey}`);
  const arrow = document.getElementById(`arrow_${portKey}`);
  const label = document.getElementById(`collapseLabel_${portKey}`);
  if (!el) return;
  const isOpen = el.classList.toggle('open');
  if (arrow) arrow.classList.toggle('open', isOpen);
  if (label) label.textContent = isOpen ? '收起' : '展开';
  // 保存状态
  if (!window._portCollapseStates) window._portCollapseStates = {};
  window._portCollapseStates[portKey] = isOpen;
}

async function onPortProviderChange(portKey) {
  const provider = document.getElementById(`portProvider_${portKey}`).value;
  // 重新获取模型列表并更新模型选择框
  try {
    const data = await api('/port-models');
    const allModels = data.all_models || [];
    const filtered = allModels.filter(m => (m.provider || 'ollama') === provider);
    const sel = document.getElementById(`portModel_${portKey}`);
    sel.innerHTML = filtered.map(m => `<option value="${esc(m.name)}">${esc(m.name)}</option>`).join('');
    if (!filtered.length) sel.innerHTML = '<option value="">-- 无可用模型 --</option>';
  } catch (e) {
    toast('加载模型列表失败: ' + e.message);
  }
}

async function savePortModel(portKey) {
  const provider = document.getElementById(`portProvider_${portKey}`).value;
  const model = document.getElementById(`portModel_${portKey}`).value;
  if (!model) return toast('请选择模型');
  await api('/port-models', {
    method: 'POST',
    body: JSON.stringify({ port_key: portKey, provider, model })
  });
  toast('端口模型配置已保存');
  renderPortModels();
}

      if (act === 'stopAgent') stopAgent(id);

async function registerAgent() {
  const agent_id = document.getElementById('newAgentId').value;
  const name = document.getElementById('newAgentName').value;
  const type = document.getElementById('newAgentType').value;
  if (!agent_id || !name) return toast('请填写 Agent ID 和名称');
  await api('/agents', { method: 'POST', body: JSON.stringify({ agent_id, name, type }) });
  toast('Agent 已注册');
  loadAgents();
}

async function startAgent(id) { await api(`/agents/${id}/start`, { method: 'POST' }); toast(`${id} 已启动`); loadAgents(); }
async function stopAgent(id) { await api(`/agents/${id}/stop`, { method: 'POST' }); toast(`${id} 已停止`); loadAgents(); }
async function deleteAgent(id) {
  if (!confirm(`确认删除 Agent ${id}？`)) return;
  await api(`/agents/${id}`, { method: 'DELETE' });
  toast('Agent 已删除');
  loadAgents();
}

async function testAgent(id) {
  const payload = prompt(`输入测试 payload（JSON）`, '{}');
  if (payload === null) return;
  let body = {};
  try { body = JSON.parse(payload || '{}'); } catch (e) { return toast('JSON 格式错误'); }
  try {
    const result = await api(`/agents/${id}/run`, { method: 'POST', body: JSON.stringify(body) });
    toast('执行完成，结果见控制台');
    console.log('Agent 结果:', result);
    alert(JSON.stringify(result, null, 2));
  } catch (e) { toast(e.message); }
}

          <td style="font-family:monospace;font-size:11px;">${esc(k.api_key)}</td>
          <td>${esc(k.scope)}</td><td>${esc(k.last_used_at || '从未')}</td>
          <td><button class="act danger" data-act="deleteKey" data-key="${esc(k.api_key)}">删除</button></td>
        </tr>`).join('') || '<tr><td colspan="6">暂无密钥</td></tr>'}
    </table>`;
  document.querySelectorAll('#content [data-act="deleteKey"]').forEach(btn => {
    btn.addEventListener('click', () => deleteKey(btn.dataset.key || ''));
  });
}

async function createKey() {
  const key_name = document.getElementById('newKeyName').value;
  const scope = document.getElementById('newKeyScope').value;
  if (!key_name) return toast('请输入密钥名称');
  const data = await api('/api-keys', { method: 'POST', body: JSON.stringify({ key_name, scope }) });
  toast(`密钥已生成：${data.api_key}`);
  loadKeys();
}

async function deleteKey(key) {
  if (!confirm('确认删除该密钥？')) return;
  await api(`/api-keys/${key}`, { method: 'DELETE' });
  toast('密钥已删除');
  loadKeys();
}

// ---------- 推理记录 ----------
const reasoningState = { page: 0, pageSize: 20, filters: {}, users: [] };

// HTML 转义，防止模型输出/用户数据中的特殊字符破坏页面结构
function esc(s) {
  return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

async function loadReasoning() {
  // 加载学生列表用于筛选下拉
  try {
    const ud = await api('/users?role=student');
    reasoningState.users = ud.users || [];
  } catch (e) { reasoningState.users = []; }
  await renderReasoning();
}

async function renderReasoning() {
  try {
    const f = reasoningState.filters;
    const params = new URLSearchParams();
    if (f.user_id) params.set('user_id', f.user_id);
    if (f.model) params.set('model', f.model);
    if (f.mode) params.set('mode', f.mode);
    if (f.start_date) params.set('start_date', f.start_date);
    if (f.end_date) params.set('end_date', f.end_date + ' 23:59:59');
    params.set('limit', reasoningState.pageSize);
    params.set('offset', reasoningState.page * reasoningState.pageSize);
    const qs = params.toString();
    const [data, stats] = await Promise.all([
      api('/reasoning-logs' + (qs ? '?' + qs : '')),
      api('/reasoning-logs/stats?days=0'),
    ]);
    const items = data.items || [];
    const total = data.total || 0;
    const s = stats || {};
    const modeNames = { feynman: '费曼', chat: '对话', five: '五步' };

    // 统计卡片：按模型 / 按步骤分布以标签形式展示
    const byModelChips = Object.entries(s.by_model || {})
      .map(([k, v]) => `<span style="display:inline-block;background:#21262d;border-radius:4px;padding:2px 8px;margin:2px;font-size:12px;">${esc(k)} ×${v}</span>`).join('')
      || '<span style="color:#8b949e;font-size:12px;">无</span>';
    const byStepChips = Object.entries(s.by_step || {})
      .map(([k, v]) => `<span style="display:inline-block;background:#21262d;border-radius:4px;padding:2px 8px;margin:2px;font-size:12px;">${esc(k)} ×${v}</span>`).join('')
      || '<span style="color:#8b949e;font-size:12px;">无</span>';

    // 筛选栏（回显当前已应用的筛选条件）
    const filterBar = `
      <div style="background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:14px;margin-bottom:16px;">
        <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
          <select id="rfUser" style="padding:10px;background:#0d1117;border:1px solid #30363d;border-radius:6px;color:#e6edf3;min-width:130px;">
            <option value="">全部学生</option>
            ${reasoningState.users.map(u => `<option value="${u.id}" ${String(u.id) === String(f.user_id || '') ? 'selected' : ''}>${esc(u.name)}</option>`).join('')}
          </select>
          <input id="rfModel" value="${esc(f.model || '')}" placeholder="模型（如 qwen2.5:7b）" style="flex:1;min-width:150px;padding:10px;background:#0d1117;border:1px solid #30363d;border-radius:6px;color:#e6edf3;">
          <select id="rfMode" style="padding:10px;background:#0d1117;border:1px solid #30363d;border-radius:6px;color:#e6edf3;">
            <option value="">全部模式</option>
            <option value="feynman" ${f.mode === 'feynman' ? 'selected' : ''}>费曼</option>
            <option value="chat" ${f.mode === 'chat' ? 'selected' : ''}>对话</option>
            <option value="five" ${f.mode === 'five' ? 'selected' : ''}>五步</option>
          </select>
          <input type="date" id="rfStart" value="${f.start_date || ''}" style="padding:10px;background:#0d1117;border:1px solid #30363d;border-radius:6px;color:#e6edf3;color-scheme:dark;">
          <input type="date" id="rfEnd" value="${f.end_date || ''}" style="padding:10px;background:#0d1117;border:1px solid #30363d;border-radius:6px;color:#e6edf3;color-scheme:dark;">
          <button class="act" onclick="queryReasoning()">查询</button>
          <button class="act" onclick="resetReasoning()">重置</button>
        </div>
      </div>`;

    // 记录表格：行点击展开详情（prompt 摘要 / input_context / output），可折叠
    const rows = items.map(it => {
      const stepTxt = it.step_name ? (it.step_order ? `${it.step_order}. ${it.step_name}` : it.step_name) : '-';
      const statusBadge = it.status === 'error'
        ? '<span class="badge err">失败</span>'
        : '<span class="badge ok">成功</span>';
      const promptFull = it.prompt || '';
      const promptSummary = esc(promptFull.slice(0, 300));
      return `
      <tr class="reasoning-row" onclick="toggleReasoningDetail(${it.id})" style="cursor:pointer;">
        <td>${it.id}</td>
        <td>${esc(it.student_name || ('#' + (it.user_id || 0)))}</td>
        <td>${esc(it.topic || '-')}</td>
        <td>${modeNames[it.mode] || esc(it.mode || '-')}</td>
        <td>${esc(it.model_used || '-')}</td>
        <td>${esc(stepTxt)}</td>
        <td>${statusBadge}</td>
        <td style="white-space:nowrap;">${esc(it.created_at || '-')}</td>
        <td>${it.latency_ms != null ? it.latency_ms + 'ms' : '-'}</td>
      </tr>
      <tr id="reasoning-detail-${it.id}" style="display:none;background:#0d1117;">
        <td colspan="9" style="padding:14px 16px;">
          <div style="font-size:13px;line-height:1.7;">
            <div style="color:#8b949e;font-size:12px;margin-bottom:4px;">📋 Prompt 摘要</div>
            <div style="margin-bottom:12px;white-space:pre-wrap;">${promptSummary}${promptFull.length > 300 ? '<span style="color:#8b949e;">…（已截断）</span>' : ''}</div>
            <div style="color:#8b949e;font-size:12px;margin-bottom:4px;">💬 输入上下文（input_context）</div>
            <div style="margin-bottom:12px;white-space:pre-wrap;">${esc(it.input_context) || '<span style="color:#8b949e;">（无）</span>'}</div>
            <div style="color:#8b949e;font-size:12px;margin-bottom:4px;">🧾 模型输出（output）</div>
            <div style="white-space:pre-wrap;">${esc(it.output) || '<span style="color:#8b949e;">（无）</span>'}</div>
          </div>
        </td>
      </tr>`;
    }).join('') || '<tr><td colspan="9" style="color:#8b949e;">暂无推理记录</td></tr>';

    // 分页
    const totalPages = Math.max(1, Math.ceil(total / reasoningState.pageSize));
    const pager = `
      <div style="display:flex;align-items:center;gap:12px;margin-top:14px;font-size:13px;color:#8b949e;">
        <button class="act" onclick="prevReasoningPage()" ${reasoningState.page === 0 ? 'disabled style="opacity:0.4;cursor:not-allowed;"' : ''}>← 上一页</button>
        <span>第 ${reasoningState.page + 1} / ${totalPages} 页（共 ${total} 条）</span>
        <button class="act" onclick="nextReasoningPage()" ${(reasoningState.page + 1) * reasoningState.pageSize >= total ? 'disabled style="opacity:0.4;cursor:not-allowed;"' : ''}>下一页 →</button>
      </div>`;

    document.getElementById('content').innerHTML = `
      <div style="font-size:12px;color:#8b949e;margin-bottom:12px;">模型推理过程日志：费曼引导每步、学习过程各步骤等。点击行可展开查看输入输出详情。</div>
      <div class="cards">
        <div class="card"><div class="num">${s.total ?? 0}</div><div class="label">总记录数</div></div>
        <div class="card"><div class="num">${s.avg_latency_ms ?? 0}ms</div><div class="label">平均耗时</div></div>
        <div class="card"><div class="num" style="color:${s.error_count ? '#f85149' : '#3fb950'};">${s.error_count ?? 0}</div><div class="label">失败数</div></div>
        <div class="card"><div class="label" style="margin-top:0;">按模型分布</div><div style="margin-top:8px;">${byModelChips}</div></div>
        <div class="card"><div class="label" style="margin-top:0;">按步骤分布</div><div style="margin-top:8px;">${byStepChips}</div></div>
      </div>
      ${filterBar}
      <div style="background:#161b22;border:1px solid #30363d;border-radius:10px;padding:20px;">
        <table>
          <tr><th>ID</th><th>学生</th><th>主题</th><th>模式</th><th>模型</th><th>步骤</th><th>状态</th><th>时间</th><th>耗时</th></tr>
          ${rows}
        </table>
        ${pager}
      </div>`;
  } catch (e) {
    document.getElementById('content').innerHTML = `<div style="color:#f85149;font-size:13px;">加载失败: ${esc(e.message)}</div>`;
  }
}

function toggleReasoningDetail(id) {
  const detailRow = document.getElementById('reasoning-detail-' + id);
  if (!detailRow) return;
  detailRow.style.display = detailRow.style.display === 'none' ? '' : 'none';
}

function queryReasoning() {
  reasoningState.filters = {
    user_id: document.getElementById('rfUser').value,
    model: document.getElementById('rfModel').value.trim(),
    mode: document.getElementById('rfMode').value,
    start_date: document.getElementById('rfStart').value,
    end_date: document.getElementById('rfEnd').value,
  };
  reasoningState.page = 0;
  renderReasoning();
}

function resetReasoning() {
  ['rfUser', 'rfModel', 'rfMode', 'rfStart', 'rfEnd'].forEach(id => document.getElementById(id).value = '');
  reasoningState.filters = {};
  reasoningState.page = 0;
  renderReasoning();
}

function prevReasoningPage() {
  if (reasoningState.page > 0) { reasoningState.page--; renderReasoning(); }
}

function nextReasoningPage() {
  reasoningState.page++;
  renderReasoning();
}

// ---------- 三层记忆可视化（短期/中期/长期 + 错题标记） ----------
const memoryState = { page: 0, pageSize: 20, filters: {}, users: [] };

const MEMORY_TYPE_NAMES = { short: '短期', mid: '中期', long: '长期' };
const MEMORY_TYPE_COLORS = { short: '#58a6ff', mid: '#d29922', long: '#3fb950' };

async function loadMemories() {
  // 加载有记忆的用户列表用于筛选下拉
  try {
    const ud = await api('/memories/users');
    memoryState.users = ud.users || [];
  } catch (e) { memoryState.users = []; }
  await renderMemories();
}

async function renderMemories() {
  try {
    const f = memoryState.filters;
    const params = new URLSearchParams();
    if (f.memory_type) params.set('memory_type', f.memory_type);
    if (f.user_id) params.set('user_id', f.user_id);

    params.set('limit', memoryState.pageSize);
    params.set('offset', memoryState.page * memoryState.pageSize);

    const data = await api('/memories' + (qs ? '?' + qs : ''));
    const items = data.items || [];
    const total = data.total || 0;
    const st = data.stats || {};

    // 顶部统计卡片
    const statCards = ['short', 'mid', 'long'].map(k => `
      <div class="card">
        <div class="num" style="color:${MEMORY_TYPE_COLORS[k]};">${st[k] ?? 0}</div>

      <div style="background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:14px;margin-bottom:16px;">
        <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
          <select id="mfType" style="padding:10px;background:#0d1117;border:1px solid #30363d;border-radius:6px;color:#e6edf3;">
            <option value="">全部类型</option>
            <option value="short" ${f.memory_type === 'short' ? 'selected' : ''}>短期记忆</option>
            <option value="mid" ${f.memory_type === 'mid' ? 'selected' : ''}>中期记忆</option>
            <option value="long" ${f.memory_type === 'long' ? 'selected' : ''}>长期记忆</option>
          </select>
          <select id="mfUser" style="padding:10px;background:#0d1117;border:1px solid #30363d;border-radius:6px;color:#e6edf3;min-width:130px;">
            <option value="">全部用户</option>
            ${memoryState.users.map(u => `<option value="${esc(u.user_id)}" ${String(u.user_id) === String(f.user_id || '') ? 'selected' : ''}>用户 #${esc(u.user_id)}（短${u.short}/中${u.mid}/长${u.long}）</option>`).join('')}

          </label>
          <button class="act" onclick="queryMemories()">查询</button>
          <button class="act" onclick="resetMemories()">重置</button>
        </div>
      </div>`;

      const typeColor = MEMORY_TYPE_COLORS[it.memory_type] || '#8b949e';

      const expiredTxt = it.expires_at ? `过期时间: ${esc(it.expires_at)}` : '长期有效';

      </tr>
      <tr id="memory-detail-${it.id}" style="display:none;background:#0d1117;">
        <td colspan="9" style="padding:14px 16px;">
          <div style="font-size:13px;line-height:1.7;white-space:pre-wrap;">${esc(contentFull) || '<span style="color:#8b949e;">（空）</span>'}</div>

      <div style="display:flex;align-items:center;gap:12px;margin-top:14px;font-size:13px;color:#8b949e;">

        <button class="act" onclick="nextMemoryPage()" ${(memoryState.page + 1) * memoryState.pageSize >= total ? 'disabled style="opacity:0.4;cursor:not-allowed;"' : ''}>下一页 →</button>

function toggleMemoryDetail(id) {
  const detailRow = document.getElementById('memory-detail-' + id);
  if (!detailRow) return;
  detailRow.style.display = detailRow.style.display === 'none' ? '' : 'none';
}

function queryMemories() {
  memoryState.filters = {
    memory_type: document.getElementById('mfType').value,
    user_id: document.getElementById('mfUser').value,
    wrong_only: document.getElementById('mfWrong').checked,
  };
  memoryState.page = 0;
  renderMemories();
}

function resetMemories() {
  ['mfType', 'mfUser'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('mfWrong').checked = false;
  memoryState.filters = {};
  memoryState.page = 0;
  renderMemories();
}

function prevMemoryPage() {
  if (memoryState.page > 0) { memoryState.page--; renderMemories(); }
}

function nextMemoryPage() {
  memoryState.page++;
  renderMemories();
}

                 style="width:80px;padding:8px;background:#161b22;border:1px solid #30363d;border-radius:6px;color:#e6edf3;font-size:14px;text-align:center;">

      </div>`;
  }).join('');
  document.getElementById('content').innerHTML = `
    <p style="color:#8b949e;font-size:13px;margin-bottom:16px;">选择启用哪些端口服务并自定义端口号，保存后重启对应服务生效。</p>
    ${rows}
    <div style="display:flex;align-items:center;gap:12px;margin-top:16px;">
      <button class="act" onclick="savePorts()" style="background:#238636;">💾 保存端口配置</button>
      <span id="portSaveMsg" style="color:#8b949e;font-size:13px;"></span>
    </div>
    <div style="margin-top:20px;background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:16px;">
      <div style="color:#8b949e;font-size:13px;margin-bottom:8px;">💡 生效方式：保存后在服务器执行重启</div>
      <code style="color:#a5b4fc;font-size:13px;">bash ~/lumilearn/remote_start_all.sh</code>
      <div style="color:#6e7681;font-size:12px;margin-top:6px;">该脚本会按当前端口配置选择性启动服务。</div>
    </div>`;
  portDirty = false;
}

function onPortChange() { portDirty = true; }

async function savePorts() {
  const settings = {};
  document.querySelectorAll('input[data-key]').forEach(inp => {
    const key = inp.dataset.key;
    if (!settings[key]) settings[key] = {};
    settings[key][inp.dataset.field] = inp.dataset.field === 'enabled' ? inp.checked : parseInt(inp.value || 0);
  });
  try {
    const data = await api('/port-settings', {
      method: 'POST',
      body: JSON.stringify({ port_settings: settings }),
    });
    document.getElementById('portSaveMsg').textContent = data.success ? '✅ ' + data.message : '❌ ' + (data.errors || []).join('；');
    if (data.success) { portDirty = false; setTimeout(() => loadPorts(), 800); }
  } catch (e) {
    document.getElementById('portSaveMsg').textContent = '❌ ' + e.message;
  }
}

        </div>
        <button class="act" onclick="changePassword()" style="background:#238636;border-color:#238636;color:white;font-weight:bold;padding:10px 24px;font-size:14px;">修改密码</button>
        <div id="passwordResult" style="margin-top:12px;font-size:13px;min-height:20px;"></div>
      </div>
    </div>`;

async function changePassword() {
  const old = document.getElementById('oldPassword').value;
  const newPwd = document.getElementById('newPassword').value;
  const confirm = document.getElementById('confirmPassword').value;
  const resultEl = document.getElementById('passwordResult');

  if (!old || !newPwd) { resultEl.style.color = '#f85149'; resultEl.textContent = '请填写完整'; return; }
  if (newPwd !== confirm) { resultEl.style.color = '#f85149'; resultEl.textContent = '两次新密码不一致'; return; }
  if (newPwd.length < 6) { resultEl.style.color = '#f85149'; resultEl.textContent = '新密码长度至少6位'; return; }

  try {
    const data = await api('/password', { method: 'POST', body: JSON.stringify({ old_password: old, new_password: newPwd }) });
    if (data.success) {
      resultEl.style.color = '#3fb950';
      resultEl.textContent = '✅ 密码修改成功！';
      document.getElementById('oldPassword').value = '';
      document.getElementById('newPassword').value = '';
      document.getElementById('confirmPassword').value = '';
    } else {
      resultEl.style.color = '#f85149';
      resultEl.textContent = '❌ ' + (data.error || '修改失败');
    }
  } catch (e) {
    resultEl.style.color = '#f85149';
    resultEl.textContent = '❌ 修改失败: ' + e.message;
  }
}

// ---------- 数据可视化（纯 SVG 图表） ----------
async function loadAnalytics() {
  document.getElementById('content').innerHTML = '<div style="color:#8b949e;">加载中…</div>';
  try {
    const [ov, trend, subjects, weak, concepts, reasoning, users] = await Promise.all([
      api('/analytics/overview'),
      api('/analytics/trend?limit=14'),
      api('/analytics/subjects'),
      api('/analytics/weakpoints?limit=8'),
      api('/analytics/concepts?limit=24'),
      api('/analytics/reasoning?days=7'),
      api('/analytics/users'),
    ]);
    const ovd = ov.data || {};
    const trendD = trend.data || [];
    const subjD = subjects.data || [];
    const weakD = weak.data || [];
    const concD = concepts.data || [];
    const reasD = reasoning.data || {};
    const userD = users.data || [];
    const acc = ovd.correct_rate;

    // ── 折线图：掌握度趋势 ──
    let trendSvg = '<div style="color:#8b949e;font-size:13px;">暂无报告数据</div>';
    if (trendD.length) {
      const W = 560, H = 190, pad = 32;
      const max = Math.max(...trendD.map(d => d.avg), 10);
      const min = Math.min(...trendD.map(d => d.avg), 0);
      const span = (max - min) || 1;
      const x = i => pad + (W - pad * 2) * i / (trendD.length - 1);
      const y = v => H - pad - ((v - min) / span) * (H - pad * 2);
      const pts = trendD.map((d, i) => x(i) + ',' + y(d.avg)).join(' ');
      let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:560px">`;
      svg += `<line x1="${pad}" y1="${H - pad}" x2="${W - pad}" y2="${H - pad}" stroke="#30363d" stroke-width="1"/>`;
      svg += `<polyline fill="none" stroke="#58a6ff" stroke-width="2.5" points="${pts}"/>`;
      trendD.forEach((d, i) => {
        if (i % Math.ceil(trendD.length / 7) === 0 || i === trendD.length - 1) {
          svg += `<circle cx="${x(i)}" cy="${y(d.avg)}" r="3.5" fill="#58a6ff"/>`;
          svg += `<text x="${x(i)}" y="${H - 12}" text-anchor="middle" fill="#8b949e" font-size="10">${esc(String(d.date).slice(5))}</text>`;
        }
      });
      svg += `<text x="6" y="${y(trendD[trendD.length - 1].avg) - 6}" fill="#3fb950" font-size="11">${trendD[trendD.length - 1].avg}%</text>`;
      svg += '</svg>';
      trendSvg = svg;
    }

    // ── 条形图：学科对比 ──
    let subjSvg = '<div style="color:#8b949e;font-size:13px;">暂无数据</div>';
    if (subjD.length) {
      const max = Math.max(...subjD.map(s => s.avg), 10);
      const bw = Math.min(60, (560 - 60) / subjD.length);
      let svg = '<svg viewBox="0 0 560 200" width="100%" style="max-width:560px">';
      subjD.forEach((s, i) => {
        const h = Math.max(4, (s.avg / max) * 120);
        const bx = 40 + i * (bw + 22), by = 170 - h;
        svg += `<rect x="${bx}" y="${by}" width="${bw}" height="${h}" rx="6" fill="#58a6ff" opacity="${0.5 + 0.5 * i / subjD.length}"/>`;
        svg += `<text x="${bx + bw / 2}" y="${by - 6}" text-anchor="middle" fill="#3fb950" font-size="11">${s.avg}%</text>`;
        svg += `<text x="${bx + bw / 2}" y="192" text-anchor="middle" fill="#8b949e" font-size="10">${esc(s.subject)}</text>`;
        svg += `<text x="${bx + bw / 2}" y="182" text-anchor="middle" fill="#66717f" font-size="9">${s.count}次</text>`;
      });
      svg += '</svg>';
      subjSvg = svg;
    }

    // ── 推理统计卡片 ──
    const modeChips = Object.entries(reasD.by_mode || {})
      .map(([k, v]) => `<span style="display:inline-block;background:#21262d;border-radius:4px;padding:2px 8px;margin:2px;font-size:12px;">${esc(k)} ×${v}</span>`).join('') || '<span style="color:#8b949e;font-size:12px;">无</span>';
    const modelChips = Object.entries(reasD.by_model || {})
      .map(([k, v]) => `<span style="display:inline-block;background:#21262d;border-radius:4px;padding:2px 8px;margin:2px;font-size:12px;">${esc(k)} ×${v}</span>`).join('') || '<span style="color:#8b949e;font-size:12px;">无</span>';

    // ── 知识点热力 ──
    const concCells = concD.length ? `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;">
      ${concD.map(c => {
        const col = c.value >= 70 ? 'rgba(63,185,80,.15)' : c.value >= 45 ? 'rgba(232,163,61,.14)' : 'rgba(248,81,73,.13)';
        const tx = c.value >= 70 ? '#3fb950' : c.value >= 45 ? '#e8a33d' : '#f85149';
        return `<div style="border-radius:10px;padding:12px 10px;text-align:center;border:1px solid #30363d;background:${col}">
          <div style="font-size:18px;font-family:monospace;color:${tx}">${c.value}%</div>
          <div style="font-size:11px;color:#8b949e;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(c.name)}</div>
        </div>`;
      }).join('')}</div>` : '<div style="color:#8b949e;font-size:13px;">暂无知识点数据（学习后生成）</div>';

    // ── 薄弱点排行 ──
    const weakRows = weakD.length ? weakD.map(w => `
      <div style="display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid #21262d;font-size:13px;color:#8b949e;">
        <span class="badge ${w.severity === '高' ? 'err' : w.severity === '中' ? 'warn' : 'ok'}" style="flex-shrink:0;">${esc(w.severity)}</span>
        <span style="flex:1;">${esc(w.text)}</span>
        <span style="font-family:monospace;color:#58a6ff;">×${w.count}</span>
      </div>`).join('') : '<div style="color:#8b949e;font-size:13px;">暂无薄弱点数据</div>';

    // ── 学生排行表 ──
    const userRows = userD.length ? userD.map((u, i) => `
      <tr>
        <td>${i + 1}</td>
        <td>${esc(u.name)}${i < 3 ? ' 🏆' : ''}</td>
        <td>${u.report_count}</td>
        <td><span class="badge ${u.avg_score >= 80 ? 'ok' : u.avg_score >= 60 ? 'warn' : 'err'}">${u.avg_score}%</span></td>
      </tr>`).join('') : '<tr><td colspan="4" style="color:#8b949e;">暂无学习记录</td></tr>';

    document.getElementById('content').innerHTML = `
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:18px;">
        <div class="card"><div class="num">${ovd.students}</div><div class="label">学生数</div></div>
        <div class="card"><div class="num">${ovd.reports}</div><div class="label">学习报告</div></div>
        <div class="card"><div class="num">${ovd.avg_mastery}%</div><div class="label">平均掌握度</div></div>
        <div class="card"><div class="num">${ovd.answers}</div><div class="label">答题总数</div></div>
        <div class="card"><div class="num">${acc}%</div><div class="label">答题正确率</div></div>
        <div class="card"><div class="num">${ovd.concepts}</div><div class="label">知识点掌握</div></div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
        <div style="background:#161b22;border:1px solid #30363d;border-radius:10px;padding:16px;">
          <h3 style="color:#e6edf3;font-size:15px;margin-bottom:10px;">📈 掌握度趋势（近14天）</h3>
          ${trendSvg}
        </div>
        <div style="background:#161b22;border:1px solid #30363d;border-radius:10px;padding:16px;">
          <h3 style="color:#e6edf3;font-size:15px;margin-bottom:10px;">📊 学科掌握度对比</h3>
          ${subjSvg}
        </div>
        <div style="background:#161b22;border:1px solid #30363d;border-radius:10px;padding:16px;">
          <h3 style="color:#e6edf3;font-size:15px;margin-bottom:10px;">🔴 薄弱点排行</h3>
          ${weakRows}
        </div>
        <div style="background:#161b22;border:1px solid #30363d;border-radius:10px;padding:16px;">
          <h3 style="color:#e6edf3;font-size:15px;margin-bottom:10px;">🧩 知识点掌握度</h3>
          ${concCells}
        </div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px;">
        <div style="background:#161b22;border:1px solid #30363d;border-radius:10px;padding:16px;">
          <h3 style="color:#e6edf3;font-size:15px;margin-bottom:10px;">🤖 模型推理统计（近7天）</h3>
          <div style="font-size:13px;color:#8b949e;margin-bottom:6px;">总数: <b style="color:#e6edf3;">${reasD.total}</b> · 失败: <b style="color:#f85149;">${reasD.error_count}</b> · 平均延迟: <b style="color:#e6edf3;">${reasD.avg_latency_ms}ms</b></div>
          <div style="margin-bottom:6px;"><span style="color:#8b949e;font-size:12px;">按模式:</span> ${modeChips}</div>
          <div><span style="color:#8b949e;font-size:12px;">按模型:</span> ${modelChips}</div>
        </div>
        <div style="background:#161b22;border:1px solid #30363d;border-radius:10px;padding:16px;">
          <h3 style="color:#e6edf3;font-size:15px;margin-bottom:10px;">🏆 学生掌握度排行</h3>

async function downloadExport(id) {
  try {
    const resp = await fetch(API + `/exports/${id}/download`, {
      headers: { 'X-Admin-Token': TOKEN },
    });
    if (!resp.ok) return toast('❌ 下载失败: ' + resp.status);
    const blob = await resp.blob();
    const cd = resp.headers.get('Content-Disposition') || '';
    const m = cd.match(/filename="?([^";]+)"?/);
    const fname = m ? m[1] : ('export_' + id + '.csv');
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = fname;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    setTimeout(() => toast('⬇ 下载已开始'), 300);
  } catch (e) { toast('❌ 下载失败: ' + e.message); }
}

  try {

    document.getElementById('content').innerHTML = `
      <div id="panel-mcp">
        <div style="background:#161b22;border:1px solid #30363d;border-radius:10px;padding:16px;margin-bottom:16px;">
          <h3 style="color:#e6edf3;font-size:15px;margin-bottom:12px;">➕ 注册 MCP Server</h3>
          <div class="form-row">
            <input id="mcpName" placeholder="名称 (如 my-tools)" style="flex:0.8;">
            <select id="mcpTransport" style="flex:0.4;">
              <option value="http">http</option>
              <option value="stdio">stdio</option>
            </select>
          </div>
          <div class="form-row">
            <input id="mcpUrl" placeholder="HTTP URL (transport=http 时填写，如 http://127.0.0.1:8000/mcp)">
            <input id="mcpCommand" placeholder="启动命令 (transport=stdio 时填写，如 npx)">
          </div>
          <div class="form-row">
            <input id="mcpArgs" placeholder="命令参数 (逗号或空格分隔，如 -y @modelcontextprotocol/server-everything)">
            <input id="mcpDesc" placeholder="描述 (可选)">
          </div>
          <button class="act" onclick="addMcpServer()" style="background:#238636;color:#fff;border-color:#238636;padding:10px 20px;font-weight:bold;">添加 Server</button>
          <div style="font-size:12px;color:#8b949e;margin-top:8px;">http 传输需填写 URL；stdio 传输需填写命令与参数（逗号或空格分隔）。</div>
        </div>
        <div style="background:#161b22;border:1px solid #30363d;border-radius:10px;padding:16px;">
          <h3 style="color:#e6edf3;font-size:15px;margin-bottom:10px;">🧩 MCP Server 列表（${servers.length}）</h3>
          <table style="width:100%;font-size:13px;">
            <tr style="color:#8b949e;"><th style="text-align:left;padding:6px;">名称</th><th>传输</th><th>地址/命令</th><th>状态</th><th>工具数</th><th>操作</th></tr>
            ${rows}
          </table>
        </div>
      </div>`;
  } catch (e) {
    document.getElementById('content').innerHTML = `<div style="color:#f85149;font-size:13px;">加载失败: ${esc(e.message)}</div>`;
  }
}

async function addMcpServer() {
  const server_name = document.getElementById('mcpName').value.trim();
  const transport = document.getElementById('mcpTransport').value;
  const url = document.getElementById('mcpUrl').value.trim();
  const command = document.getElementById('mcpCommand').value.trim();
  const argsStr = document.getElementById('mcpArgs').value.trim();
  const description = document.getElementById('mcpDesc').value.trim();
  if (!server_name) return toast('请输入 Server 名称');
  if (transport === 'http' && !url) return toast('http 传输需填写 URL');
  if (transport === 'stdio' && !command) return toast('stdio 传输需填写启动命令');
  const args = argsStr ? argsStr.split(/[,，\s]+/).map(s => s.trim()).filter(Boolean) : [];
  try {
    const d = await api('/mcp-servers', { method: 'POST', body: JSON.stringify({ server_name, transport, url, command, args, description, enabled: true }) });
    toast('✅ ' + (d.message || 'Server 已注册'));
    ['mcpName', 'mcpUrl', 'mcpCommand', 'mcpArgs', 'mcpDesc'].forEach(id => document.getElementById(id).value = '');
    loadMcpServers();
  } catch (e) { toast('❌ ' + e.message); }
}

async function toggleMcpServer(name) {
  try {
    const d = await api(`/mcp-servers/${encodeURIComponent(name)}/toggle`, { method: 'POST' });
    toast(d.enabled ? '✅ 已启用' : '⛔ 已停用');
    loadMcpServers();
  } catch (e) { toast('❌ ' + e.message); }
}

async function testMcpServer(name) {
  try {
    const d = await api(`/mcp-servers/${encodeURIComponent(name)}/test`, { method: 'POST' });
    if (d.success) {
      const tools = d.tools || [];
      alert(`✅ Server ${name} 连接成功，共 ${tools.length} 个工具：\n` + tools.map(t => '- ' + (t.name || JSON.stringify(t))).join('\n'));
    } else {
      alert(`❌ Server ${name} 连接失败：` + (d.error || '未知错误'));
    }
  } catch (e) { toast('❌ ' + e.message); }
}

async function deleteMcpServer(name) {
  if (!confirm(`确认删除 MCP Server ${name}？此操作不可恢复。`)) return;
  try {
    const d = await api(`/mcp-servers/${encodeURIComponent(name)}`, { method: 'DELETE' });
    toast('✅ ' + (d.message || '已删除'));
    loadMcpServers();
  } catch (e) { toast('❌ ' + e.message); }
}

// ---------- P2-12 分布式任务队列 ----------
async function loadTasks() {
  document.getElementById('content').innerHTML = '<div style="color:#8b949e;">加载中…</div>';
  try {
    const d = await api('/tasks');
    const tasks = d.tasks || [];
    const s = d.stats || {};
    const counts = s.counts || {};
    const badge = (st) => st === 'completed' ? '<span class="badge ok">completed</span>'
      : st === 'failed' ? '<span class="badge err">failed</span>'
      : st === 'running' ? '<span class="badge warn">running</span>'
      : st === 'canceled' ? '<span class="badge off">canceled</span>'
      : '<span class="badge">pending</span>';
    const rows = tasks.map(t => `
      <tr>
        <td><b>${esc(t.task_id)}</b></td>
        <td><span class="badge">${esc(t.task_type)}</span></td>
        <td>${badge(t.status)}</td>
        <td>${t.priority}</td>
        <td>${t.retries}/${t.max_retries}</td>
        <td style="max-width:220px;word-break:break-all;font-size:12px;color:#8b949e;">${esc(t.topic || '')}</td>
        <td>${esc(t.created_at)}</td>
        <td style="white-space:nowrap;">
          <button class="act" onclick="getTask('${esc(t.task_id)}')">详情</button>
          ${t.status === 'pending' ? `<button class="act danger" onclick="cancelTask('${esc(t.task_id)}')">取消</button>` : ''}
        </td>
      </tr>`).join('') || '<tr><td colspan="8" style="color:#8b949e;">暂无任务</td></tr>';
    const total = s.total || 0;
    document.getElementById('content').innerHTML = `
      <div id="panel-tasks">
        <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px;">
          <div class="card"><div class="num">${total}</div><div class="label">总任务</div></div>
          <div class="card"><div class="num">${counts.pending || 0}</div><div class="label">待执行</div></div>
          <div class="card"><div class="num">${counts.running || 0}</div><div class="label">运行中</div></div>
          <div class="card"><div class="num">${counts.completed || 0}</div><div class="label">已完成</div></div>
          <div class="card"><div class="num">${counts.failed || 0}</div><div class="label">失败</div></div>
        </div>
        <div style="background:#161b22;border:1px solid #30363d;border-radius:10px;padding:16px;margin-bottom:16px;">
          <h3 style="color:#e6edf3;font-size:15px;margin-bottom:12px;">➕ 提交任务</h3>
          <div class="form-row">
            <select id="taskType" style="flex:0.6;">
              <option value="unified_orchestrator">unified_orchestrator（统一编排器）</option>
            </select>
            <input id="taskPriority" placeholder="优先级 1-10（越小越优先）" value="5" style="flex:0.5;">
            <input id="taskTimeout" placeholder="超时秒" value="300" style="flex:0.5;">
          </div>
          <div class="form-row">
            <input id="taskTopic" placeholder="学习主题（如 牛顿第二定律）">
            <input id="taskMaxRetries" placeholder="重试次数" value="1" style="flex:0.5;">
            <input id="taskDelay" placeholder="延迟秒" value="0" style="flex:0.5;">
          </div>
          <button class="act" onclick="submitTask()" style="background:#238636;color:#fff;border-color:#238636;padding:10px 20px;font-weight:bold;">提交任务</button>
          <button class="act" onclick="processTasks()">手动消费队列</button>
          <button class="act" onclick="loadTasks()">刷新</button>
          <div style="font-size:12px;color:#8b949e;margin-top:8px;">任务在后台异步执行；未启动 worker 时点击「手动消费队列」立即执行到期任务。</div>
        </div>
        <div style="background:#161b22;border:1px solid #30363d;border-radius:10px;padding:16px;">
          <h3 style="color:#e6edf3;font-size:15px;margin-bottom:10px;">📋 任务列表（${tasks.length}）</h3>
          <table style="width:100%;font-size:13px;">
            <tr style="color:#8b949e;"><th style="text-align:left;padding:6px;">任务ID</th><th>类型</th><th>状态</th><th>优先级</th><th>重试</th><th>主题</th><th>创建时间</th><th>操作</th></tr>
            ${rows}
          </table>
        </div>
      </div>`;
  } catch (e) {
    document.getElementById('content').innerHTML = `<div style="color:#f85149;font-size:13px;">加载失败: ${esc(e.message)}</div>`;
  }
}

async function submitTask() {
  const task_type = document.getElementById('taskType').value;
  const topic = document.getElementById('taskTopic').value.trim();
  if (!topic) return toast('请输入学习主题');
  const payload = { topic, subject: '', difficulty: '高中', user_id: 1 };
  try {
    const d = await api('/tasks', { method: 'POST', body: JSON.stringify({
      task_type, payload,
      priority: parseInt(document.getElementById('taskPriority').value) || 5,
      max_retries: parseInt(document.getElementById('taskMaxRetries').value) || 1,
      delay: parseFloat(document.getElementById('taskDelay').value) || 0,
      timeout: parseInt(document.getElementById('taskTimeout').value) || 300,
    }) });
    toast('✅ 已提交任务 ' + (d.task ? d.task.task_id : ''));
    document.getElementById('taskTopic').value = '';
    loadTasks();
  } catch (e) { toast('❌ ' + e.message); }
}

async function cancelTask(id) {
  if (!confirm(`确认取消任务 ${id}？`)) return;
  try {
    const d = await api(`/tasks/${encodeURIComponent(id)}/cancel`, { method: 'POST' });
    toast('✅ ' + (d.status || '已取消'));
    loadTasks();
  } catch (e) { toast('❌ ' + e.message); }
}

async function getTask(id) {
  try {
    const d = await api(`/tasks/${encodeURIComponent(id)}`);
    const t = d.task || {};
    alert(`任务 ${t.task_id}\n类型: ${t.task_type}\n状态: ${t.status}\n重试: ${t.retries}/${t.max_retries}\n创建: ${t.created_at}\n错误: ${t.error || '无'}\n结果: ${JSON.stringify(t.result || {}).slice(0, 2000)}`);
  } catch (e) { toast('❌ ' + e.message); }
}

async function processTasks() {
  try {
    const d = await api('/tasks/process', { method: 'POST' });
    toast(`✅ 已执行 ${d.processed} 个任务`);
    loadTasks();
  } catch (e) { toast('❌ ' + e.message); }
}

// ---------- 初始化 ----------
if (TOKEN) {
  fetch(API + '/me', { headers: { 'X-Admin-Token': TOKEN } })
    .then(r => r.ok ? r.json() : Promise.reject())
    .then(() => {
      document.getElementById('loginWrap').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      init();
    })
    .catch(() => localStorage.removeItem('admin_token'));
}
</script>
