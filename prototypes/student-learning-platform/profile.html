<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LumiLearn · 我的档案</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="pages.css">
</head>
<body data-page="profile">
<div class="shell">
  <aside class="app-nav">
    <a class="brand" href="index.html">
      <span class="brand-mark" aria-hidden="true">L</span>
      <span class="brand-text"><b>LumiLearn</b><em>学生端 · AI 教官</em></span>
    </a>
    <nav class="nav-list" aria-label="主导航">
      <a class="nav-item" data-nav="index" href="index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>发起学习</span>
      </a>
      <a class="nav-item" data-nav="learn" href="learn.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><polygon points="6 3 20 12 6 21 6 3"/></svg>
        <span>学习过程</span>
      </a>
      <a class="nav-item" data-nav="report" href="report.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>
        <span>学习报告</span>
      </a>
      <a class="nav-item" data-nav="history" href="history.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>
        <span>学习历史</span>
      </a>
      <a class="nav-item" data-nav="profile" href="profile.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>我的档案</span>
      </a>
    </nav>
    <div class="nav-foot">
      <div class="user-box" id="userBox" style="display:none">
        <span class="dot"></span>
        <span class="uname" id="userName">—</span>
        <button class="btn btn-ghost btn-sm" id="logoutBtn" type="button">退出</button>
      </div>
      <span class="dev-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M15 2v2"/><path d="M15 20v2"/><path d="M2 15h2"/><path d="M2 9h2"/><path d="M20 15h2"/><path d="M20 9h2"/><path d="M9 2v2"/><path d="M9 20v2"/></svg>
        CPU 本地推理 · 无云依赖
      </span>
      <span class="model-status"><span class="dot"></span><code>lumilearn-v2</code> 在线</span>
    </div>
  </aside>
  <main class="app-content" id="app">

    <section class="page-head reveal r1">
      <div>
        <p class="page-kicker">MY PROFILE</p>
        <h1>我的档案</h1>
      </div>
      <div class="meta">
        <span class="tag tag-sky" id="pfUser">—</span>
        <span class="tag tag-faint">学习档案 · 全部本地存储</span>
      </div>
    </section>

    <div class="profile-stats reveal r2">
      <div class="card stat" style="padding:18px"><b style="display:block;font-size:26px;color:var(--accent);font-family:var(--font-mono)" id="pfReports">—</b><span class="faint">学习报告</span></div>
      <div class="card stat" style="padding:18px"><b style="display:block;font-size:26px;color:var(--accent);font-family:var(--font-mono)" id="pfAvg">—</b><span class="faint">平均掌握度</span></div>
      <div class="card stat" style="padding:18px"><b style="display:block;font-size:26px;color:var(--accent);font-family:var(--font-mono)" id="pfWeak">—</b><span class="faint">薄弱点</span></div>
    </div>

    <div class="report-grid">
      <section class="card pf-card pf-trend reveal r3">
        <div class="card-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
          掌握度趋势
        </div>
        <div id="pfTrend"></div>
      </section>

      <section class="card pf-card reveal r4">
        <div class="card-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
          薄弱点排行
        </div>
        <div id="pfWeakList"></div>
      </section>

      <section class="card pf-card reveal r5">
        <div class="card-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>
          最近学习
        </div>
        <div id="pfRecent"></div>
      </section>

      <section class="card pf-card reveal r6">
        <div class="card-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
          最近对话
        </div>
        <div id="pfConversations"></div>
      </section>
    </div>

  </main>
</div>
<div class="toast" id="toast"></div>
<script src="nav.js"></script>
<script src="mock.js"></script>
<script src="api.js"></script>
<script src="auth.js"></script>
<script>
(function () {
  var toastEl = document.getElementById("toast");
  function toast(msg) { toastEl.textContent = msg; toastEl.classList.add("show"); setTimeout(function () { toastEl.classList.remove("show"); }, 2200); }

  function trendSvg(points) {
    if (!points.length) return '<div class="empty">暂无学习记录</div>';
    var W = 520, H = 170, pad = 30;
    var max = Math.max.apply(null, points.map(function (p) { return p.score; })) || 100;
    var min = Math.min.apply(null, points.map(function (p) { return p.score; })) || 0;
    var span = (max - min) || 1;
    function x(i) { return pad + (W - pad * 2) * i / (points.length - 1); }
    function y(v) { return H - pad - ((v - min) / span) * (H - pad * 2); }
    var pts = points.map(function (p, i) { return x(i) + "," + y(p.score); }).join(" ");
    var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" style="max-width:520px">';
    s += '<polyline fill="none" stroke="#E8A33D" stroke-width="2.5" points="' + pts + '"/>';
    points.forEach(function (p, i) {
      if (i % Math.ceil(points.length / 6) === 0 || i === points.length - 1) {
        s += '<circle cx="' + x(i) + '" cy="' + y(p.score) + '" r="3.5" fill="#E8A33D"/>';
        s += '<text x="' + x(i) + '" y="' + (H - 6) + '" text-anchor="middle">' + esc(p.date) + '</text>';
      }
    });
    s += '</svg>';
    return s;
  }

  function render(data) {
    document.getElementById("pfUser").textContent = data.user.name + " · " + (data.user.role === "teacher" ? "教师" : "学生");
    document.getElementById("pfReports").textContent = data.total_reports;
    document.getElementById("pfAvg").textContent = data.avg_mastery + "%";
    document.getElementById("pfWeak").textContent = data.weak_points.length;
    document.getElementById("pfTrend").innerHTML = trendSvg(data.trend);

    var weakEl = document.getElementById("pfWeakList");
    weakEl.innerHTML = "";
    if (!data.weak_points.length) {
      weakEl.innerHTML = '<div class="empty">暂无薄弱点，继续保持</div>';
    } else {
      data.weak_points.forEach(function (w) {
        var sev = w.severity === "高" ? "tag-danger" : w.severity === "中" ? "tag-amber" : "tag-faint";
        var div = document.createElement("div");
        div.className = "pf-weak";
        div.innerHTML = '<span class="tag ' + sev + '">' + esc(w.severity) + '</span><span>' + esc(w.text) + '</span><span class="cnt">×' + w.count + '</span>';
        weakEl.appendChild(div);
      });
    }

    var recentEl = document.getElementById("pfRecent");
    recentEl.innerHTML = "";
    if (!data.recent_reports.length) {
      recentEl.innerHTML = '<div class="empty">还没有学习记录，去发起第一次学习吧</div>';
    } else {
      data.recent_reports.forEach(function (r) {
        var div = document.createElement("div");
        div.className = "pf-row";
        div.innerHTML = '<span class="tag tag-mint">' + r.score + '%</span><span class="t">' + esc(r.topic) + '</span><span class="meta">' + esc(r.date) + '</span>';
        div.addEventListener("click", function () {
          SessionStore.save({ mode: "report", reportId: r.id });
          location.href = "report.html";
        });
        recentEl.appendChild(div);
      });
    }

    var convEl = document.getElementById("pfConversations");
    convEl.innerHTML = "";
    if (!data.conversations.length) {
      convEl.innerHTML = '<div class="empty">暂无对话记录</div>';
    } else {
      data.conversations.slice(0, 6).forEach(function (c) {
        var div = document.createElement("div");
        div.className = "pf-row";
        div.innerHTML = '<span class="tag tag-sky">' + c.msg_count + ' 条</span><span class="t">' + esc(c.title) + '</span><span class="meta">' + esc(c.date) + '</span>';
        convEl.appendChild(div);
      });
    }
  }

  api.profile().then(function (j) {
    if (j.code === 0) render(j.data);
    else if (j.code === 404) toast("暂无档案");
  }).catch(function () { toast("加载失败"); });
})();
</script>
</body>
</html>
