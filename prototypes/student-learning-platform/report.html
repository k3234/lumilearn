<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LumiLearn · 学习报告</title>
<link rel="stylesheet" href="/static/ui/lumi.css">
<link rel="stylesheet" href="/static/ui/icons.css">
<style>
  .report-hero{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
  .gauge{position:relative;width:148px;height:148px;flex:none}
  .gauge svg{transform:rotate(-90deg)}
  .gauge .num{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
  .gauge .num b{font-size:30px;font-weight:700;display:block}
  .gauge .num span{font-size:12px;color:var(--color-text-muted)}
  .report-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:16px}
  .weak-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--color-border);font-size:13px}
  .weak-item:last-child{border-bottom:none}
  .next-item{display:flex;gap:10px;padding:9px 0;font-size:13px}
  .next-item .no{width:20px;height:20px;border-radius:50%;background:var(--muted);display:grid;place-items:center;font-size:11px;flex:none}
  .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .stat-cell{border:1px solid var(--color-border);border-radius:10px;padding:12px;text-align:center}
  .stat-cell b{font-size:16px;display:block}
  .stat-cell span{font-size:11px;color:var(--color-text-muted)}
  .agent-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--color-border);font-size:12px}
  .agent-row:last-child{border-bottom:none}
  .agent-row code{font-family:var(--font-mono);color:var(--color-text-muted)}
  .agent-row .calls{margin-left:auto;color:var(--color-text-muted)}
  @media (max-width:900px){.report-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="shell">
  <aside class="app-sidebar" id="appSidebar"></aside>
  <main class="app-main">
    <div class="topbar">
      <div>
        <div class="eyebrow">LEARNING REPORT</div>
        <h1 id="rTopic">学习报告</h1>
      </div>
      <div class="tools">
        <span class="pill" id="rSubject">—</span>
        <span class="pill" id="rLevel">—</span>
        <span class="pill" id="rDate">—</span>
      </div>
    </div>

    <section class="card report-hero">
      <div class="gauge">
        <svg width="148" height="148" viewBox="0 0 148 148">
          <circle cx="74" cy="74" r="64" fill="none" stroke="var(--muted)" stroke-width="12"></circle>
          <circle id="gaugeFill" cx="74" cy="74" r="64" fill="none" stroke="var(--primary)" stroke-width="12"
            stroke-linecap="round" stroke-dasharray="402.1" stroke-dashoffset="402.1"></circle>
        </svg>
        <div class="num"><div><b id="gaugeScore">—</b><span>掌握度</span></div></div>
      </div>
      <div style="flex:1;min-width:220px">
        <div class="flex" style="gap:8px;margin-bottom:8px"><span class="pill green" id="rLevelTag">已完成</span><span class="pill">费曼五步</span></div>
        <p class="muted" id="rSummary" style="font-size:13px;max-width:70ch">—</p>
        <div class="flex" style="gap:10px;margin-top:14px">
          <a class="btn primary" href="start.html"><i class="icon icon-16 icon-chevron-left"></i> 再学一次</a>
          <a class="btn" href="profile.html"><i class="icon icon-16 icon-file"></i> 查看历史</a>
        </div>
      </div>
    </section>

    <div class="report-grid">
      <section class="card">
        <h3 style="font-size:15px;font-weight:600;margin-bottom:10px">掌握度评估</h3>
        <p class="muted small" id="masterySummary">—</p>
        <div class="card mt-1" style="padding:12px;background:var(--muted);border:none" id="feynmanNote">—</div>
      </section>

      <section class="card">
        <h3 style="font-size:15px;font-weight:600;margin-bottom:10px">薄弱点分析</h3>
        <div id="weakList"><div class="empty muted small">暂无薄弱点</div></div>
      </section>

      <section class="card">
        <h3 style="font-size:15px;font-weight:600;margin-bottom:10px">下一步建议</h3>
        <div id="nextList"></div>
      </section>

      <section class="card">
        <h3 style="font-size:15px;font-weight:600;margin-bottom:10px">工具调用与 Agent 摘要</h3>
        <div class="stat-grid" id="statGrid"></div>
        <div class="mt-2" id="agentSum"></div>
      </section>
    </div>
  </main>
</div>

<script src="mock.js"></script>
<script src="api.js"></script>
<script src="app.js"></script>
<script>
(function () {
  var esc = LL.esc;

  function render(r) {
    if (!r) { LL.toast("暂无报告"); return; }
    document.getElementById("rSubject").textContent = r.subject || "综合";
    document.getElementById("rLevel").textContent = r.difficulty || "高中";
    document.getElementById("rDate").textContent = r.generatedAt || r.date || "";
    document.getElementById("rTopic").textContent = r.topic || "学习报告";
    var mastery = Number(r.mastery || 0);
    document.getElementById("gaugeScore").textContent = mastery + "%";
    setTimeout(function () {
      document.getElementById("gaugeFill").style.strokeDashoffset = 402.1 * (1 - mastery / 100);
    }, 60);
    var level = mastery >= 85 ? "优秀" : mastery >= 70 ? "良好" : "需加强";
    document.getElementById("rLevelTag").textContent = level + " · 已完成";
    document.getElementById("rSummary").textContent =
      "「" + (r.topic || "") + "」" + level + "，掌握度 " + mastery + "%。由评测与路径 Agent 综合五步完成度与费曼测试给出。";

    document.getElementById("masterySummary").textContent =
      "费曼五步全部完成，自主推导与费曼测试表现" + (mastery >= 80 ? "稳定" : "仍有提升空间") + "。建议按下方复习周期巩固。";
    var fs = r.feynmanScore != null ? r.feynmanScore : 80;
    document.getElementById("feynmanNote").innerHTML =
      "费曼测试得分 <b>" + fs + "</b> · " + (fs >= 80 ? "你能用自己的话讲清核心概念，理解已进入长期记忆区。" : "讲解还需更具体，建议补一个生活例子再讲一遍。");

    var weak = r.weakPoints || [];
    document.getElementById("weakList").innerHTML = weak.length ? weak.map(function (w) {
      var cls = w.severity === "高" ? "red" : w.severity === "中" ? "amber" : "";
      return '<div class="weak-item"><span class="pill ' + cls + '">' + esc(w.severity || "低") + '</span><span>' + esc(w.text) + '</span></div>';
    }).join("") : '<div class="muted small">暂无薄弱点</div>';

    var next = r.nextSteps || [];
    document.getElementById("nextList").innerHTML = next.length ? next.map(function (s, i) {
      return '<div class="next-item"><span class="no">' + (i + 1) + '</span><span>' + esc(s) + '</span></div>';
    }).join("") : '<div class="muted small">暂无建议</div>';

    var stats = [["toolCalls", r.toolCalls || "—", "工具调用"], ["duration", r.duration || "—", "学习时长"], ["model", r.model || "—", "教学模型"]];
    document.getElementById("statGrid").innerHTML = stats.map(function (s) {
      return '<div class="stat-cell"><b style="font-size:' + (s[0] === "model" ? "12px" : "16px") + '">' + esc(s[1]) + '</b><span>' + esc(s[2]) + '</span></div>';
    }).join("");

    var agents = r.agents || (window.DB && DB.agentDefs) || [];
    document.getElementById("agentSum").innerHTML = agents.map(function (a) {
      return '<div class="agent-row"><span class="pill">' + esc(a.name || a.id) + '</span><code>' + esc(a.model || "") + '</code>' +
        '<span class="calls">' + (a.calls || 1) + ' 次调用</span></div>';
    }).join("");
  }

  LL.boot({ nav: "report" }).then(function () {
    var qs = new URLSearchParams(location.search);
    var id = qs.get("id");
    var draft = SessionStore.draft;
    if (id) {
      api.getReport({ id: id }).then(function (res) {
        if (res && res.code === 0) render(res.data);
        else { LL.toast("报告不存在"); setTimeout(function () { location.href = "profile.html"; }, 800); }
      }).catch(function () { location.href = "profile.html"; });
    } else if (draft && draft.mode === "report" && draft.report) {
      render(draft.report);
    } else {
      LL.toast("请选择一份学习报告");
      setTimeout(function () { location.href = "profile.html"; }, 900);
    }
  });
})();
</script>
</body>
</html>
