<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LumiLearn · 学习报告</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="pages.css">
</head>
<body data-page="report">
<div class="shell">
  <aside class="app-nav">
    <a class="brand" href="index.html">
      <span class="brand-mark" aria-hidden="true">L</span>
      <span class="brand-text"><b>LumiLearn</b><em>学生端 · AI 教官</em></span>
    </a>
    <nav class="nav-list" aria-label="主导航">
      <a class="nav-item" data-nav="index" href="index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>发起学习</span>
      </a>
      <a class="nav-item" data-nav="learn" href="learn.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><polygon points="6 3 20 12 6 21 6 3"/></svg>
        <span>学习过程</span>
      </a>
      <a class="nav-item" data-nav="report" href="report.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>
        <span>学习报告</span>
      </a>
      <a class="nav-item" data-nav="history" href="history.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>
        <span>学习历史</span>
      </a>
      <a class="nav-item" data-nav="profile" href="profile.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>我的档案</span>
      </a>
    </nav>
    <div class="nav-foot">
      <div class="user-box" id="userBox" style="display:none">
        <span class="dot"></span>
        <span class="uname" id="userName">—</span>
        <button class="btn btn-ghost btn-sm" id="logoutBtn" type="button">退出</button>
      </div>
      <span class="dev-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M15 2v2"/><path d="M15 20v2"/><path d="M2 15h2"/><path d="M2 9h2"/><path d="M20 15h2"/><path d="M20 9h2"/><path d="M9 2v2"/><path d="M9 20v2"/></svg>
        CPU 本地推理 · 无云依赖
      </span>
      <span class="model-status"><span class="dot"></span><code>lumilearn-v2</code> 在线</span>
    </div>
  </aside>
  <main class="app-content" id="app">

    <section class="page-head reveal r1">
      <div>
        <p class="page-kicker">LEARNING REPORT</p>
        <h1>学习报告</h1>
      </div>
      <div class="meta">
        <span class="tag tag-sky" id="rSubject">—</span>
        <span class="tag tag-amber" id="rLevel">—</span>
        <span class="tag tag-faint" id="rDate">—</span>
      </div>
    </section>

    <section class="card report-hero reveal r2">
      <div class="gauge-wrap" id="gaugeWrap">
        <svg width="148" height="148" viewBox="0 0 148 148">
          <circle class="gauge-track" cx="74" cy="74" r="64"></circle>
          <circle class="gauge-fill" id="gaugeFill" cx="74" cy="74" r="64"
            stroke-dasharray="402.1" stroke-dashoffset="402.1"></circle>
        </svg>
        <div class="gauge-num"><div><b id="gaugeScore">—</b><span>掌握度</span></div></div>
      </div>
      <div class="report-hero-info">
        <h1 id="rTopic">—</h1>
        <div class="meta" id="rVerdict">
          <span class="tag tag-mint" id="rLevelTag">已完成</span>
          <span class="tag tag-faint">费曼五步全部完成</span>
        </div>
        <p class="verdict" id="rSummary">—</p>
        <div class="report-actions">
          <a class="btn btn-primary" href="index.html" id="retryBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>
            再学一次
          </a>
          <a class="btn btn-ghost" href="history.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>
            查看历史
          </a>
        </div>
      </div>
    </section>

    <div class="report-grid">
      <section class="card reveal r3">
        <div class="card-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/></svg>
          掌握度评估
        </div>
        <p class="sub" id="masterySummary" style="margin-bottom:14px">—</p>
        <div class="feynman-score-note" id="feynmanNote">—</div>
      </section>

      <section class="card reveal r4">
        <div class="card-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
          薄弱点分析
        </div>
        <div id="weakList"></div>
      </section>

      <section class="card reveal r5">
        <div class="card-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 22h4"/><path d="m15.09 14 4.1-4.1a1.4 1.4 0 0 0-2-2L13.1 12"/><path d="M3 20h4L19.9 7.1a1.4 1.4 0 0 0-2-2L5 18"/></svg>
          下一步建议
        </div>
        <div id="nextList"></div>
      </section>

      <section class="card reveal r6">
        <div class="card-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/></svg>
          工具调用与 Agent 摘要
        </div>
        <div class="stat-grid" id="statGrid"></div>
        <div class="agent-sum" id="agentSum" style="margin-top:16px"></div>
      </section>
    </div>

  </main>
</div>
<div class="toast" id="toast"></div>
<script src="nav.js"></script>
<script src="mock.js"></script>
<script src="api.js"></script>
<script src="auth.js"></script>
<script>
(function () {
  var toastEl = document.getElementById("toast");
  function toast(msg) { toastEl.textContent = msg; toastEl.classList.add("show"); setTimeout(function () { toastEl.classList.remove("show"); }, 2200); }

  function render(report) {
    if (!report) { toast("暂无报告"); return; }

    document.getElementById("rSubject").textContent = report.subject;
    document.getElementById("rLevel").textContent = report.difficulty;
    document.getElementById("rDate").textContent = report.date || report.generatedAt || "";
    document.getElementById("rTopic").textContent = report.topic;
    document.getElementById("gaugeScore").textContent = report.mastery + "%";

    /* 环形图动画 */
    var C = 402.1;
    var fill = document.getElementById("gaugeFill");
    setTimeout(function () { fill.style.strokeDashoffset = C * (1 - report.mastery / 100); }, 60);

    var level = report.mastery >= 85 ? "优秀" : report.mastery >= 70 ? "良好" : "需加强";
    var emojiFree = level === "优秀" ? "讲解通透" : level === "良好" ? "稳步提升" : "再接再厉";
    document.getElementById("rLevelTag").textContent = level + " · " + emojiFree;
    document.getElementById("rSummary").textContent =
      "「" + report.topic + "」" + level + "，掌握度 " + report.mastery + "%。由评测与路径 Agent 综合五步完成度与费曼测试给出。";

    document.getElementById("masterySummary").textContent =
      "费曼五步全部完成，自主推导与费曼测试表现" + (report.mastery >= 80 ? "稳定" : "仍有提升空间") +
      "。当前掌握度 " + report.mastery + "%，建议按下方复习周期巩固。";
    document.getElementById("feynmanNote").innerHTML =
      "费曼测试得分 <b>" + (report.feynmanScore || 80) + "</b> · 评测 Agent 认为" +
      ((report.feynmanScore || 80) >= 80 ? "你能用自己的话讲清核心概念，理解已进入长期记忆区。" : "讲解还需更具体，建议补一个生活例子再讲一遍。");

    /* 薄弱点 */
    var weak = document.getElementById("weakList");
    weak.innerHTML = "";
    (report.weakPoints || []).forEach(function (w) {
      var sev = w.severity === "高" ? "tag-danger" : w.severity === "中" ? "tag-amber" : "tag-faint";
      var div = document.createElement("div");
      div.className = "weak-item";
      div.innerHTML = '<span class="tag ' + sev + '">' + esc(w.severity) + '</span><span>' + esc(w.text) + '</span>';
      weak.appendChild(div);
    });

    /* 下一步 */
    var next = document.getElementById("nextList");
    next.innerHTML = "";
    (report.nextSteps || []).forEach(function (s, i) {
      var div = document.createElement("div");
      div.className = "next-item";
      div.innerHTML = '<span class="no">' + (i + 1) + '</span><span>' + s + '</span>';
      next.appendChild(div);
    });

    /* 统计 */
    var stats = document.getElementById("statGrid");
    stats.innerHTML = "";
    [["toolCalls", report.toolCalls || "—", "工具调用"], ["duration", report.duration || "—", "学习时长"], ["model", report.model || "—", "教学模型"]]
      .forEach(function (s) {
        var cell = document.createElement("div");
        cell.className = "stat-cell";
        var val = s[0] === "model"
          ? '<b style="font-size:12px;line-height:1.5">' + esc(s[1]) + '</b>'
          : '<b>' + esc(s[1]) + '</b>';
        cell.innerHTML = val + '<span>' + esc(s[2]) + '</span>';
        stats.appendChild(cell);
      });

    /* Agent 摘要 */
    var agents = document.getElementById("agentSum");
    agents.innerHTML = "";
    (report.agents || DB.agentDefs).forEach(function (a) {
      var row = document.createElement("div");
      row.className = "agent-sum-row";
      row.innerHTML =
        '<span class="tag tag-amber">' + esc(a.name) + '</span>' +
        '<code>' + esc(a.model || "") + '</code>' +
        '<span class="calls">' + (a.calls || 1) + ' 次调用</span>';
      agents.appendChild(row);
    });
  }

  /* 数据来源：新报告草稿 > 历史报告 id > 最近一条历史 */
  var draft = SessionStore.draft;
  if (draft && draft.mode === "report" && draft.report) {
    render(draft.report);
  } else if (draft && draft.mode === "report" && draft.reportId) {
    api.getReport({ id: draft.reportId }).then(function (res) { render(res.data); });
  } else {
    render(DB.sessions[0]);
  }
})();
</script>
</body>
</html>
