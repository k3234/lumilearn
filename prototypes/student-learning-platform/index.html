<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LumiLearn · 学生学习仪表盘</title>
<link rel="stylesheet" href="/static/ui/lumi.css">
<link rel="stylesheet" href="/static/ui/icons.css">
<style>
  .welcome{display:flex;justify-content:space-between;gap:20px;align-items:center;flex-wrap:wrap}
  .welcome .hi{font-size:13px;color:var(--color-text-muted);margin-bottom:4px}
  .welcome h2{font-size:20px;font-weight:700}
  .welcome p{font-size:13px;color:var(--color-text-muted);margin-top:6px;max-width:60ch}
  .cta-row{display:flex;gap:10px;flex-wrap:wrap}
  .metrics-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:18px}
  .content-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:16px;margin-top:16px}
  .content-grid.equal{grid-template-columns:1fr 1fr}
  .panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .panel-head h3{font-size:15px;font-weight:600}
  .list{display:flex;flex-direction:column}
  .list-item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--color-border)}
  .list-item:last-child{border-bottom:none}
  .list-item .idx{width:22px;height:22px;border-radius:6px;background:var(--muted);display:grid;place-items:center;font-size:11px;font-weight:600;flex:none}
  .list-item .grow{flex:1;min-width:0}
  .list-item .grow b{font-size:13px;font-weight:600;display:block}
  .list-item .grow span{font-size:12px;color:var(--color-text-muted)}
  .path-step{display:flex;align-items:center;gap:12px;padding:10px 0}
  .path-step .snum{width:24px;height:24px;border-radius:50%;border:1px solid var(--color-border);display:grid;place-items:center;font-size:11px;flex:none}
  .path-step.weak .snum{border-color:var(--destructive-border);color:var(--destructive-text)}
  .chart-wrap{margin-top:6px}
  .chart-legend{display:flex;gap:14px;font-size:12px;color:var(--color-text-muted);margin-bottom:6px}
  .empty{text-align:center;color:var(--color-text-muted);font-size:13px;padding:26px 0}
  .material{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--color-border)}
  .material:last-child{border-bottom:none}
  .topbar .tools{display:flex;align-items:center;gap:10px}
  .topbar .tools .iconbtn{width:34px;height:34px;border-radius:9px;border:1px solid var(--color-border);background:var(--card);display:grid;place-items:center}
</style>
</head>
<body>
<div class="shell">
  <aside class="app-sidebar" id="appSidebar"></aside>
  <main class="app-main">
    <div class="topbar">
      <div>
        <div class="eyebrow" id="todayLine">—</div>
        <h1 id="greeting">你好</h1>
      </div>
      <div class="tools">
        <span class="pill" id="cognitivePill">学习状态：—</span>
        <button class="iconbtn" title="通知"><i class="icon icon-16 icon-bell"></i></button>
      </div>
    </div>

    <section class="card welcome">
      <div>
        <div class="hi">今日学习建议</div>
        <h2 id="adviceTitle">继续你的个性化学习路径</h2>
        <p id="adviceText">系统将根据你的掌握度与薄弱知识点，推荐下一步学习内容。</p>
      </div>
      <div class="cta-row">
        <a class="btn primary lg" href="start.html"><i class="icon icon-16 icon-circle-play"></i> 开始今日学习</a>
        <a class="btn lg" href="checkpoint.html"><i class="icon icon-16 icon-target"></i> 去闯关检测</a>
      </div>
    </section>

    <section class="metrics-grid">
      <div class="metric-card"><div class="eyebrow">已掌握知识点</div><div class="metric-value" id="mMastered">—</div><div class="delta muted small" id="mMasteredSub">共 — 个知识点</div></div>
      <div class="metric-card"><div class="eyebrow">平均掌握度</div><div class="metric-value" id="mAvg">—</div><div class="delta muted small">来自历史学习报告</div></div>
      <div class="metric-card"><div class="eyebrow">学习报告</div><div class="metric-value" id="mReports">—</div><div class="delta muted small">累计完成</div></div>
      <div class="metric-card"><div class="eyebrow">整体学习进度</div><div class="metric-value" id="mProgress">—</div><div class="delta muted small" id="mProgressSub">已启动 — 个</div></div>
    </section>

    <section class="content-grid">
      <div class="card">
        <div class="panel-head"><h3>薄弱知识点 TOP3</h3><a class="btn ghost sm" href="profile.html">全部</a></div>
        <div class="list" id="weakList"><div class="empty">加载中…</div></div>
      </div>
      <div class="card">
        <div class="panel-head"><h3>推荐学习路径</h3><span class="muted small">按掌握度排序</span></div>
        <div class="list" id="pathList"><div class="empty">加载中…</div></div>
      </div>
    </section>

    <section class="content-grid equal">
      <div class="card">
        <div class="panel-head"><h3>最近学习记录</h3><a class="btn ghost sm" href="profile.html">查看全部</a></div>
        <div class="table-wrap">
          <table class="data-table">
            <thead><tr><th>主题</th><th>日期</th><th>掌握度</th></tr></thead>
            <tbody id="recentBody"><tr><td colspan="3" class="muted">加载中…</td></tr></tbody>
          </table>
        </div>
      </div>
      <div class="card">
        <div class="panel-head"><h3>学习趋势</h3><span class="muted small" id="trendHint">—</span></div>
        <div class="chart-wrap" id="trendChart"></div>
      </div>
    </section>

    <section class="card mt-2">
      <div class="panel-head"><h3>课后复习素材</h3><span class="muted small">来自教师已发布资料</span></div>
      <div id="materials"><div class="empty">加载中…</div></div>
    </section>
  </main>
</div>

<script src="mock.js"></script>
<script src="api.js"></script>
<script src="app.js"></script>
<script>
(function () {
  var esc = LL.esc, pct = LL.pct;

  function lineChart(points) {
    if (!points || points.length < 2) return '<div class="empty">暂无趋势数据（完成学习后生成）</div>';
    var w = 520, h = 170, pad = 26;
    var xs = points.map(function (_, i) { return i; });
    var max = Math.max.apply(null, points.map(function (p) { return p.score; }).concat([100]));
    var min = Math.min.apply(null, points.map(function (p) { return p.score; }).concat([0]));
    var span = Math.max(1, max - min);
    function X(i) { return pad + i * (w - pad * 2) / Math.max(1, points.length - 1); }
    function Y(v) { return h - pad - (v - min) / span * (h - pad * 2); }
    var d = points.map(function (p, i) { return (i ? "L" : "M") + X(i).toFixed(1) + " " + Y(p.score).toFixed(1); }).join(" ");
    var area = d + " L" + X(points.length - 1).toFixed(1) + " " + (h - pad) + " L" + X(0).toFixed(1) + " " + (h - pad) + " Z";
    var dots = points.map(function (p, i) { return '<circle cx="' + X(i).toFixed(1) + '" cy="' + Y(p.score).toFixed(1) + '" r="3" fill="var(--primary)"/>'; }).join("");
    return '<svg viewBox="0 0 ' + w + ' ' + h + '" width="100%" height="170" role="img" aria-label="学习趋势折线图">' +
      '<line x1="' + pad + '" y1="' + (h - pad) + '" x2="' + (w - pad) + '" y2="' + (h - pad) + '" stroke="var(--color-border)"/>' +
      '<path d="' + area + '" fill="var(--muted)" opacity=".7"/>' +
      '<path d="' + d + '" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>' + dots +
      '<text x="' + pad + '" y="' + (h - 6) + '" font-size="10" fill="var(--color-text-muted)">' + esc(points[0].date) + '</text>' +
      '<text x="' + (w - pad) + '" y="' + (h - 6) + '" font-size="10" text-anchor="end" fill="var(--color-text-muted)">' + esc(points[points.length - 1].date) + '</text>' +
    '</svg>';
  }

  function render(profile, status, resources) {
    var u = profile.user || {};
    var ov = (status && status.overview) || {};
    document.getElementById("greeting").textContent = "你好，" + (u.name || "同学");
    document.getElementById("adviceTitle").textContent =
      (status && status.weak_points && status.weak_points.length)
        ? "优先巩固 " + (status.weak_points[0].name || status.weak_points[0].node_id)
        : "继续你的个性化学习路径";

    document.getElementById("mMastered").textContent = (ov.mastered != null ? ov.mastered : "—");
    document.getElementById("mMasteredSub").textContent = "共 " + (ov.studied != null ? ov.studied : "—") + " 个已学知识点";
    document.getElementById("mAvg").textContent = pct(profile.avg_mastery);
    document.getElementById("mReports").textContent = (profile.total_reports != null ? profile.total_reports : "—");
    document.getElementById("mProgress").textContent = pct(ov.overall_progress);

    var weak = (profile.weak_points || []).slice(0, 3);
    document.getElementById("weakList").innerHTML = weak.length ? weak.map(function (w, i) {
      return '<div class="list-item"><span class="idx">' + (i + 1) + '</span>' +
        '<span class="grow"><b>' + esc(w.text) + '</b><span>出现 ' + (w.count || 1) + ' 次 · 严重度 ' + esc(w.severity || "低") + '</span></span>' +
        '<a class="btn sm" href="start.html?topic=' + encodeURIComponent(w.text) + '">立即复习</a></div>';
    }).join("") : '<div class="empty">暂无薄弱点（完成学习后生成）</div>';

    var path = (status && status.path) || profile.learning_path || [];
    var weakIds = (status && status.weak_points || []).map(function (x) { return x.node_id || x.name; });
    document.getElementById("pathList").innerHTML = path.length ? path.slice(0, 5).map(function (n, i) {
      var isWeak = weakIds.indexOf(n.node_id || n.name) !== -1;
      return '<div class="path-step' + (isWeak ? " weak" : "") + '"><span class="snum">' + (i + 1) + '</span>' +
        '<span class="grow"><b>' + esc(n.name || n.node_id) + '</b></span>' +
        (isWeak ? '<span class="pill red">待巩固</span>' : '<span class="pill">难度 ' + (n.difficulty || 1) + '</span>') + '</div>';
    }).join("") : '<div class="empty">暂无个性化路径（先开始一次学习）</div>';

    var recent = profile.recent_reports || [];
    document.getElementById("recentBody").innerHTML = recent.length ? recent.map(function (r) {
      return '<tr><td><a href="report.html?id=' + encodeURIComponent(r.id) + '">' + esc(r.topic) + '</a></td>' +
        '<td class="muted">' + esc(LL.fmtDate(r.date)) + '</td>' +
        '<td><span class="pill green">' + pct(r.score) + '</span></td></tr>';
    }).join("") : '<tr><td colspan="3" class="muted">暂无学习记录</td></tr>';

    var trend = profile.trend || [];
    document.getElementById("trendChart").innerHTML = lineChart(trend);
    document.getElementById("trendHint").textContent = trend.length ? (trend.length + " 次记录") : "—";

    var mats = (resources && (resources.resources || resources.data)) || [];
    document.getElementById("materials").innerHTML = mats.length ? mats.slice(0, 5).map(function (m) {
      return '<div class="material"><i class="icon icon-16 icon-file"></i>' +
        '<span class="grow"><b style="font-size:13px">' + esc(m.title) + '</b> ' +
        '<span class="muted small">' + esc(m.subject || "综合") + ' · ' + esc(m.content_type || "资料") + '</span></span>' +
        '<span class="pill">' + esc(m.difficulty || "中等") + '</span></div>';
    }).join("") : '<div class="empty">暂无教师发布的复习素材</div>';

    var cs = (status && status.cognitive_state) || profile.cognitive_state || "engaged";
    var map = { engaged: "投入", confused: "困惑", frustrated: "受挫", distracted: "分心", fluent: "流畅", unknown: "—" };
    document.getElementById("cognitivePill").textContent = "学习状态：" + (map[cs] || cs);
  }

  LL.boot({ nav: "index" }).then(function (user) {
    var now = new Date();
    var wd = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"][now.getDay()];
    if (user) document.getElementById("todayLine").textContent = wd + " · " + (now.getMonth() + 1) + "月" + now.getDate() + "日";
    else document.getElementById("todayLine").textContent = wd;
    if (!user) { render({ user: {}, total_reports: 0, avg_mastery: 0, trend: [], weak_points: [], recent_reports: [] }, { overview: {}, path: [], weak_points: [] }, {}); return; }

    Promise.all([
      api.profile().catch(function () { return { code: 1, data: {} }; }),
      api.getLearnStatus().catch(function () { return { code: 1, data: {} }; }),
      api.getResources().catch(function () { return { resources: [] }; })
    ]).then(function (r) {
      render((r[0] && r[0].data) || {}, (r[1] && r[1].data) || {}, r[2] || {});
    });
  });
})();
</script>
</body>
</html>
