<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LumiLearn · 学习过程</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="pages.css">
</head>
<body data-page="learn">
<div class="shell">
  <aside class="app-nav">
    <a class="brand" href="index.html">
      <span class="brand-mark" aria-hidden="true">L</span>
      <span class="brand-text"><b>LumiLearn</b><em>学生端 · AI 教官</em></span>
    </a>
    <nav class="nav-list" aria-label="主导航">
      <a class="nav-item" data-nav="index" href="index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>发起学习</span>
      </a>
      <a class="nav-item" data-nav="learn" href="learn.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><polygon points="6 3 20 12 6 21 6 3"/></svg>
        <span>学习过程</span>
      </a>
      <a class="nav-item" data-nav="report" href="report.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>
        <span>学习报告</span>
      </a>
      <a class="nav-item" data-nav="history" href="history.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>
        <span>学习历史</span>
      </a>
      <a class="nav-item" data-nav="profile" href="profile.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>我的档案</span>
      </a>
    </nav>
    <div class="nav-foot">
      <div class="user-box" id="userBox" style="display:none">
        <span class="dot"></span>
        <span class="uname" id="userName">—</span>
        <button class="btn btn-ghost btn-sm" id="logoutBtn" type="button">退出</button>
      </div>
      <span class="dev-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M15 2v2"/><path d="M15 20v2"/><path d="M2 15h2"/><path d="M2 9h2"/><path d="M20 15h2"/><path d="M20 9h2"/><path d="M9 2v2"/><path d="M9 20v2"/></svg>
        CPU 本地推理 · 无云依赖
      </span>
      <span class="model-status"><span class="dot"></span><code>lumilearn-v2</code> 在线</span>
    </div>
  </aside>
  <main class="app-content" id="app">

    <section class="learn-head reveal r1">
      <p class="page-kicker">MULTI-AGENT ORCHESTRATION · FEYNMAN 5-STEP</p>
      <div class="topic-row">
        <h1 id="headTopic">—</h1>
        <span class="tag tag-sky" id="headSubject">数学</span>
        <span class="tag tag-amber" id="headLevel">高中</span>
        <span class="tag tag-faint" id="headElapsed">00:00</span>
      </div>
      <p class="hint">编排调度 Agent 正在把学习目标拆解为费曼五步，各位 AI 教官接力推进。右侧可实时观察每个 Agent 的工作。</p>
    </section>

    <div class="progress-strip reveal r2" id="progressStrip"></div>

    <div class="learn-grid">
      <div class="steps-col">
        <div id="stepList"></div>
        <div class="learn-actions" id="learnActions" style="display:none">
          <button class="btn btn-primary btn-lg" id="reportBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>
            生成学习报告
          </button>
          <button class="btn btn-ghost btn-lg" id="restartBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>
            再学一遍
          </button>
        </div>
      </div>

      <aside class="agent-panel reveal r3">
        <div class="card">
          <div class="agent-title">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/></svg>
            Agent 协作面板
          </div>
          <div id="agentList"></div>
        </div>
        <div class="card">
          <div class="agent-title">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
            调用日志
          </div>
          <div class="log-box" id="logBox">
            <div class="log-line"><span class="lt">[system]</span> 等待编排调度…</div>
          </div>
        </div>
      </aside>
    </div>

  </main>
</div>
<div class="toast" id="toast"></div>
<script src="nav.js"></script>
<script src="mock.js"></script>
<script src="api.js"></script>
<script src="auth.js"></script>
<script>
(function () {
  var toastEl = document.getElementById("toast");
  var toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, 2200);
  }

  /* 读取会话草稿；非学习态则回首页 */
  var draft = SessionStore.draft;
  if (!draft || draft.mode !== "learning" || !draft.session) {
    toast("请先发起一次学习");
    setTimeout(function () { location.href = "index.html"; }, 900);
    return;
  }
  var session = draft.session;

  /* 头部信息 */
  document.getElementById("headTopic").textContent = session.topic;
  document.getElementById("headSubject").textContent = session.subject;
  document.getElementById("headLevel").textContent = session.difficulty;

  /* 计时器 */
  var t0 = Date.now();
  setInterval(function () {
    var s = Math.floor((Date.now() - t0) / 1000);
    var mm = String(Math.floor(s / 60)).padStart(2, "0");
    var ss = String(s % 60).padStart(2, "0");
    document.getElementById("headElapsed").textContent = mm + ":" + ss;
  }, 1000);

  /* 进度条 + 步骤卡片骨架 */
  var strip = document.getElementById("progressStrip");
  session.flow.forEach(function (st, i) {
    var p = document.createElement("div");
    p.className = "progress-step";
    p.dataset.pstep = i + 1;
    p.innerHTML =
      '<span class="pdot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>' +
      '<span>' + st.name + '</span>';
    if (i < session.flow.length - 1) p.insertAdjacentHTML("beforeend", '<span class="psep"></span>');
    strip.appendChild(p);
  });

  var stepList = document.getElementById("stepList");
  session.flow.forEach(function (st, i) {
    var card = document.createElement("div");
    card.className = "step-card";
    card.dataset.step = i + 1;
    card.innerHTML =
      '<div class="step-card-head">' +
        '<span class="snum">' + (i + 1) + '</span>' +
        '<b>' + st.name + '</b>' +
        '<span class="purpose">' + st.purpose + '</span>' +
        '<span class="state" data-state></span>' +
      '</div>' +
      '<div class="s-content" data-content></div>' +
      '<div class="knowledge-row" data-knowledge style="display:none"></div>' +
      '<div class="feynman-input" data-test style="display:none"></div>' +
      '<div class="feynman-result" data-result style="display:none"></div>';
    stepList.appendChild(card);
  });

  /* Agent 面板 */
  var agentList = document.getElementById("agentList");
  var agentEls = {};
  DB.agentDefs.forEach(function (a) {
    var el = document.createElement("div");
    el.className = "agent-card";
    el.innerHTML =
      '<span class="agent-ico c-' + a.color + '"></span>' +
      '<div class="ag-body"><b>' + a.name + '</b><span class="ag-role">' + a.role + '</span></div>' +
      '<span class="ag-status idle" data-ag="' + a.id + '"><span class="sdot"></span>idle</span>';
    agentList.appendChild(el);
    agentEls[a.id] = el;
  });
  function setAgent(id, status, calls) {
    var span = agentList.querySelector('[data-ag="' + id + '"]');
    span.className = "ag-status " + status;
    span.lastChild.textContent = " " + (status === "running" ? "运行中" : status === "done" ? "完成 · " + (calls || 1) + " 次" : "空闲");
  }
  /* Agent 图标（Lucide 内联，按契约配色） */
  var agentIcons = {
    orchestrator: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>',
    feynman: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg>',
    knowledge: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>',
    coach: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a10 10 0 1 0 10 10"/><path d="M22 2 12 12"/><path d="M22 2v6"/><path d="M22 8h-6"/></svg>',
  };
  Object.keys(agentEls).forEach(function (id) {
    agentEls[id].querySelector(".agent-ico").innerHTML = agentIcons[id] || "";
  });

  /* 调用日志 */
  var logBox = document.getElementById("logBox");
  var logCount = 0;
  function log(text, cls) {
    var line = document.createElement("div");
    line.className = "log-line" + (cls ? " " + cls : "");
    var t = new Date();
    var mm = String(t.getMinutes()).padStart(2, "0");
    var ss = String(t.getSeconds()).padStart(2, "0");
    line.innerHTML = '<span class="lt">[' + mm + ":" + ss + ']</span> ' + text;
    logBox.appendChild(line);
    logBox.scrollTop = logBox.scrollHeight;
    logCount++;
  }

  /* 打字机展示 */
  function typewrite(el, text) {
    return new Promise(function (resolve) {
      el.classList.add("typing");
      var i = 0;
      (function tick() {
        i = Math.min(i + 3, text.length);
        el.textContent = text.slice(0, i);
        if (i < text.length) setTimeout(tick, 8);
        else { el.classList.remove("typing"); resolve(); }
      })();
    });
  }

  /* ---------- 主流程：逐步执行 ---------- */
  var feynmanScore = 80;
  var currentStep = 0;
  var running = false;

  function setStepState(n, state) {
    var card = stepList.querySelector('[data-step="' + n + '"]');
    card.classList.remove("current", "done");
    if (state === "current") card.classList.add("current");
    if (state === "done") card.classList.add("done");
    var tag = card.querySelector("[data-state]");
    if (state === "current") tag.innerHTML = '<span class="tag tag-amber">进行中</span>';
    else if (state === "done") tag.innerHTML = '<span class="tag tag-mint">已完成</span>';
    else tag.innerHTML = '<span class="tag tag-faint">待开始</span>';
    var p = document.querySelector('[data-pstep="' + n + '"]');
    if (p) {
      p.classList.remove("current", "done");
      if (state === "current") p.classList.add("current");
      if (state === "done") p.classList.add("done");
    }
  }

  async function runStep(n) {
    if (running) return;
    running = true;
    currentStep = n;
    setStepState(n, "current");
    var card = stepList.querySelector('[data-step="' + n + '"]');

    /* 编排调度分发 */
    setAgent("orchestrator", "running");
    log('<span class="la">编排调度</span> → 分发步骤 ' + n + '「' + session.flow[n - 1].name + '」');
    await new Promise(function (r) { setTimeout(r, 500); });

    /* 知识检索 */
    setAgent("knowledge", "running");
    log('<span class="la">知识检索</span> → 检索「' + session.topic + '」相关知识点');
    var res = await api.runStep({ sessionId: session.id, step: n });
    setAgent("knowledge", "done");
    setAgent("orchestrator", "done");

    /* 防挂护栏：后端不可用/出错时不阻塞流程 */
    if (!res || !res.data) {
      log('步骤 ' + n + ' 执行失败（模型暂不可用），已跳过', "ll-done");
      setAgent("feynman", "done", n);
      setStepState(n, "done");
      if (n === 5) {
        document.getElementById("learnActions").style.display = "flex";
      } else {
        await new Promise(function (r) { setTimeout(r, 420); });
      }
      running = false;
      return;
    }

    /* 费曼教学生成 */
    setAgent("feynman", "running");
    log('<span class="la">费曼教学</span> → 生成「' + session.flow[n - 1].name + '」教学内容');

    var data = res.data;
    var contentEl = card.querySelector("[data-content]");
    await typewrite(contentEl, data.content);
    setAgent("feynman", "done", n);
    log('完成「' + session.flow[n - 1].name + '」', "ll-done");

    /* 知识要点 chips */
    var kw = card.querySelector("[data-knowledge]");
    kw.style.display = "flex";
    kw.innerHTML = '<span class="k-label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>知识检索注入</span>' +
      data.knowledge.map(function (k) { return '<span class="tag tag-faint">' + k + '</span>'; }).join("");

    /* 第 5 步：费曼测试 */
    if (n === 5) {
      var testBox = card.querySelector("[data-test]");
      testBox.style.display = "block";
      testBox.innerHTML =
        '<label class="field"><span class="field-label">你的 30 秒讲解</span>' +
        '<textarea id="feynmanText" placeholder="用最简单的话，把刚才学到的讲给一个完全不懂的人听…"></textarea></label>' +
        '<div style="display:flex;gap:10px;margin-top:12px">' +
        '<button type="button" class="btn btn-primary" id="testSubmit">提交讲解</button>' +
        '<button type="button" class="btn btn-ghost" id="testSkip">跳过测试</button></div>';
      var resultBox = card.querySelector("[data-result]");

      await new Promise(function (resolve) {
        function submit() {
          var text = (document.getElementById("feynmanText") || {}).value || "";
          document.getElementById("testSubmit").disabled = true;
          setAgent("coach", "running");
          log('<span class="la">评测与路径</span> → 对费曼测试五维评分');
          api.submitFeynmanTest({ sessionId: session.id, text: text })
            .then(function (r) {
              feynmanScore = r.data.score;
              setAgent("coach", "done", 1);
              log('费曼测试得分 ' + feynmanScore, "ll-done");
              resultBox.style.display = "block";
              resultBox.innerHTML = '<b>' + feynmanScore + ' 分</b> ' + r.data.verdict +
                '<br><span class="faint">' + r.data.feedback.accuracy.comment + ' · ' + r.data.feedback.simplicity.comment + '</span>';
              finish();
            });
        }
        function skip() {
          setAgent("coach", "done", 1);
          feynmanScore = 80;
          resultBox.style.display = "block";
          resultBox.innerHTML = '<b>80 分</b> 已按默认成绩跳过测试';
          finish();
        }
        function finish() {
          testBox.style.display = "none";
          setStepState(5, "done");
          document.getElementById("learnActions").style.display = "flex";
          document.getElementById("reportBtn").disabled = false;
          resolve();
        }
        document.getElementById("testSubmit").addEventListener("click", submit);
        document.getElementById("testSkip").addEventListener("click", skip);
      });
    } else {
      setStepState(n, "done");
      await new Promise(function (r) { setTimeout(r, 520); });
    }
    running = false;
  }

  async function runAll() {
    for (var i = 1; i <= 5; i++) {
      await runStep(i);
    }
  }
  runAll();

  /* 生成报告 */
  document.getElementById("reportBtn").addEventListener("click", function () {
    var btn = this;
    btn.disabled = true;
    btn.innerHTML = '<svg class="spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.2-8.56"/></svg>评测与路径 Agent 汇总中…';
    api.generateReport({ sessionId: session.id, feynmanScore: feynmanScore })
      .then(function (res) {
        SessionStore.save({ mode: "report", report: res.data });
        location.href = "report.html";
      })
      .catch(function () {
        toast("生成失败，请重试");
        btn.disabled = false;
        btn.innerHTML = "生成学习报告";
      });
  });

  /* 再学一遍 */
  document.getElementById("restartBtn").addEventListener("click", function () {
    SessionStore.clear();
    location.href = "index.html";
  });
})();
</script>
</body>
</html>
