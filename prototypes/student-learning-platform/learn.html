<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LumiLearn · 学习过程</title>
<link rel="stylesheet" href="/static/ui/lumi.css">
<link rel="stylesheet" href="/static/ui/icons.css">
<style>
  .learn-head .topic-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:4px}
  .learn-head h1{font-size:22px;font-weight:700}
  .learn-head .hint{font-size:13px;color:var(--color-text-muted);margin-top:8px;max-width:78ch}
  .stepper{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0}
  .stepper .sp{display:flex;align-items:center;gap:8px;padding:7px 12px;border:1px solid var(--color-border);
    border-radius:99px;font-size:12px;color:var(--color-text-muted);background:var(--card)}
  .stepper .sp .num{width:18px;height:18px;border-radius:50%;background:var(--muted);display:grid;place-items:center;font-size:10px;font-weight:600}
  .stepper .sp.current{border-color:var(--primary);color:var(--color-text)}
  .stepper .sp.current .num{background:var(--primary);color:var(--color-primary-foreground)}
  .stepper .sp.done .num{background:var(--success);color:#fff}
  .learn-grid{display:grid;grid-template-columns:1.35fr .65fr;gap:16px;align-items:start}
  .step-card{border:1px solid var(--color-border);border-radius:var(--radius);background:var(--card);padding:18px;margin-bottom:14px}
  .step-card .sc-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .step-card .snum{width:24px;height:24px;border-radius:50%;background:var(--muted);display:grid;place-items:center;font-size:12px;font-weight:600;flex:none}
  .step-card.current{border-color:var(--border-strong);box-shadow:var(--shadow-sm)}
  .step-card.current .snum{background:var(--primary);color:var(--color-primary-foreground)}
  .step-card.done .snum{background:var(--success);color:#fff}
  .step-card .sc-head .purpose{margin-left:auto;font-size:12px;color:var(--color-text-muted)}
  .s-content{font-size:14px;line-height:1.8;white-space:pre-wrap;color:var(--color-text)}
  .s-content.typing::after{content:"▌";animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .answer-box{margin-top:14px}
  .answer-box textarea{width:100%;min-height:76px;padding:10px 12px;border:1px solid var(--color-border);
    border-radius:10px;font-size:14px;resize:vertical;background:var(--background)}
  .answer-box textarea:focus{outline:2px solid var(--ring);outline-offset:-1px}
  .agent-card{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--color-border)}
  .agent-card:last-child{border-bottom:none}
  .agent-ico{width:26px;height:26px;border-radius:8px;background:var(--muted);display:grid;place-items:center;flex:none}
  .agent-card .ag-body{flex:1;min-width:0}
  .agent-card .ag-body b{font-size:13px;display:block}
  .agent-card .ag-body span{font-size:11px;color:var(--color-text-muted)}
  .log-box{max-height:200px;overflow-y:auto;font-family:var(--font-mono);font-size:11.5px;line-height:1.9}
  .log-line{color:var(--color-text-secondary)}
  .log-line .lt{color:var(--color-text-muted)}
  .log-line.ll-done{color:var(--success-text)}
  .log-line.ll-user{color:var(--info-text)}
  .spin{animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (max-width:1000px){.learn-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="shell">
  <aside class="app-sidebar" id="appSidebar"></aside>
  <main class="app-main">
    <div class="learn-head">
      <div class="eyebrow">MULTI-AGENT ORCHESTRATION · FEYNMAN 5-STEP</div>
      <div class="topic-row">
        <h1 id="headTopic">—</h1>
        <span class="pill" id="headSubject">—</span>
        <span class="pill" id="headLevel">—</span>
        <span class="pill" id="headElapsed">00:00</span>
      </div>
      <p class="hint">苏格拉底式引导学习：老师逐步提问，你按自己的理解回答，老师根据你的回答调整接下来的引导。全程由你主导推导，右侧可实时观察每位 AI 教官的工作。</p>
    </div>

    <div class="stepper" id="progressStrip"></div>

    <div class="learn-grid">
      <div>
        <div id="stepList"></div>
        <div class="flex mt-2" id="learnActions" style="display:none;gap:10px">
          <button class="btn primary lg" id="reportBtn"><i class="icon icon-16 icon-file"></i> 生成学习报告</button>
          <button class="btn lg" id="restartBtn"><i class="icon icon-16 icon-chevron-left"></i> 再学一遍</button>
        </div>
      </div>

      <aside>
        <div class="card">
          <div class="between" style="margin-bottom:10px"><h3 style="font-size:14px;font-weight:600">Agent 协作面板</h3></div>
          <div id="agentList"></div>
        </div>
        <div class="card mt-2">
          <div class="between" style="margin-bottom:10px"><h3 style="font-size:14px;font-weight:600">调用日志</h3></div>
          <div class="log-box" id="logBox"><div class="log-line"><span class="lt">[system]</span> 等待编排调度…</div></div>
        </div>
        <div class="card mt-2" id="pathPanel" style="display:none">
          <div class="between" style="margin-bottom:10px"><h3 style="font-size:14px;font-weight:600">个性化路径</h3></div>
          <div id="pathList"></div>
          <div class="mt-2" style="margin-top:12px;font-size:13px;font-weight:600">课后复习素材</div>
          <div id="reviewMaterials" class="muted small"></div>
        </div>
      </aside>
    </div>
  </main>
</div>

<script src="mock.js"></script>
<script src="api.js"></script>
<script src="app.js"></script>
<script>
(function () {
  var esc = LL.esc;

  var draft = SessionStore.draft;
  if (!draft || draft.mode !== "learning" || !draft.session) {
    LL.toast("请先发起一次学习");
    setTimeout(function () { location.href = "start.html"; }, 900);
    return;
  }
  var session = draft.session;

  document.getElementById("headTopic").textContent = session.topic || "学习";
  document.getElementById("headSubject").textContent = session.subject || "综合";
  document.getElementById("headLevel").textContent = session.difficulty || "高中";

  LL.boot({ nav: "learn" }).then(function (user) {
    if (user) loadPathPanel(session);
  });

  var t0 = Date.now();
  setInterval(function () {
    var s = Math.floor((Date.now() - t0) / 1000);
    document.getElementById("headElapsed").textContent =
      String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
  }, 1000);

  var flow = session.flow || [];
  var strip = document.getElementById("progressStrip");
  strip.innerHTML = flow.map(function (st, i) {
    return '<div class="sp" data-pstep="' + (i + 1) + '"><span class="num">' + (i + 1) + '</span>' + esc(st.name) + '</div>';
  }).join("");

  var stepList = document.getElementById("stepList");
  stepList.innerHTML = flow.map(function (st, i) {
    return '<div class="step-card" data-step="' + (i + 1) + '">' +
      '<div class="sc-head"><span class="snum">' + (i + 1) + '</span><b>' + esc(st.name) + '</b>' +
      '<span class="purpose">' + esc(st.purpose || "") + '</span>' +
      '<span data-state class="pill">待开始</span></div>' +
      '<div class="s-content" data-content></div>' +
      '<div class="knowledge-row" data-knowledge style="display:none"></div>' +
      '<div class="answer-box" data-test style="display:none"></div>' +
      '<div class="mt-1" data-result style="display:none"></div></div>';
  }).join("");

  /* Agent 面板 */
  var agentDefs = (window.DB && DB.agentDefs) || [
    { id: "orchestrator", name: "编排调度", role: "任务分发 · 流程编排 · 结果聚合", color: "sky" },
    { id: "feynman", name: "费曼教学", role: "五步教学法生成教学内容", color: "amber" },
    { id: "knowledge", name: "知识检索", role: "检索知识点 · 注入上下文", color: "mint" },
    { id: "coach", name: "评测与路径", role: "输出评分 · 个性化学习路径", color: "violet" }
  ];
  var agentList = document.getElementById("agentList");
  agentList.innerHTML = agentDefs.map(function (a) {
    return '<div class="agent-card"><span class="agent-ico"><i class="icon icon-16 icon-settings"></i></span>' +
      '<span class="ag-body"><b>' + esc(a.name) + '</b><span>' + esc(a.role) + '</span></span>' +
      '<span class="pill" data-ag="' + a.id + '">空闲</span></div>';
  }).join("");
  function setAgent(id, status, calls) {
    var el = agentList.querySelector('[data-ag="' + id + '"]');
    if (!el) return;
    el.className = "pill" + (status === "running" ? " amber" : status === "done" ? " green" : "");
    el.textContent = status === "running" ? "运行中" : status === "done" ? ("完成 · " + (calls || 1) + " 次") : "空闲";
  }

  var logBox = document.getElementById("logBox");
  function log(text, cls) {
    var t = new Date();
    var line = document.createElement("div");
    line.className = "log-line" + (cls ? " " + cls : "");
    line.innerHTML = '<span class="lt">[' + String(t.getMinutes()).padStart(2, "0") + ":" + String(t.getSeconds()).padStart(2, "0") + ']</span> ' + text;
    logBox.appendChild(line);
    logBox.scrollTop = logBox.scrollHeight;
  }

  function typewrite(el, text) {
    return new Promise(function (resolve) {
      el.classList.add("typing");
      var i = 0;
      (function tick() {
        i = Math.min(i + 3, text.length);
        el.textContent = text.slice(0, i);
        if (i < text.length) setTimeout(tick, 8);
        else { el.classList.remove("typing"); resolve(); }
      })();
    });
  }

  function setStepState(n, state) {
    var card = stepList.querySelector('[data-step="' + n + '"]');
    if (!card) return;
    card.classList.remove("current", "done");
    if (state === "current") card.classList.add("current");
    if (state === "done") card.classList.add("done");
    var tag = card.querySelector("[data-state]");
    if (tag) tag.textContent = state === "current" ? "进行中" : state === "done" ? "已完成" : "待开始";
    var p = strip.querySelector('[data-pstep="' + n + '"]');
    if (p) { p.classList.remove("current", "done"); if (state) p.classList.add(state); }
  }

  var feynmanScore = 80, currentGuideStep = 1, guideBusy = false;

  function loadPathPanel(session) {
    Promise.all([
      api.getLearnStatus({ subject: session.subject }).catch(function () { return { code: 1 }; }),
      api.getResources({ subject: session.subject }).catch(function () { return { code: 1 }; })
    ]).then(function (r) {
      var st = (r[0] && r[0].data) || {};
      var res = r[1] || {};
      var path = st.path || [], weak = st.weak_points || [], ov = st.overview || {};
      document.getElementById("pathList").innerHTML =
        '<div class="muted small" style="margin-bottom:6px">整体进度 ' + (ov.overall_progress || 0) + '% · 待巩固 ' + weak.length + ' 项</div>' +
        (path.map(function (n, i) {
          var isWeak = weak.some(function (w) { return w.node_id === n.node_id || w.name === n.name; });
          return '<div class="flex" style="gap:8px;padding:4px 0"><span class="snum" style="width:20px;height:20px;border-radius:50%;background:var(--muted);display:grid;place-items:center;font-size:10px">' + (i + 1) + '</span>' +
            '<span style="font-size:13px">' + esc(n.name || n.node_id) + '</span>' +
            (isWeak ? '<span class="pill red" style="font-size:10px">待巩固</span>' : '') + '</div>';
        }).join("") || '<div class="muted small">暂无个性化路径（答题后生成）</div>');
      var mats = res.resources || res.data || [];
      document.getElementById("reviewMaterials").innerHTML = mats.length
        ? mats.slice(0, 5).map(function (m) { return "· " + esc(m.title || m.name || "素材"); }).join("<br>")
        : "暂无教师发布的复习素材";
      document.getElementById("pathPanel").style.display = "block";
    });
  }

  function renderGuide(d) {
    var n = d.step;
    for (var i = currentGuideStep; i < n; i++) setStepState(i, "done");
    currentGuideStep = n;
    setStepState(n, "current");
    var card = stepList.querySelector('[data-step="' + n + '"]');
    var contentEl = card.querySelector("[data-content]");
    contentEl.textContent = "";
    return typewrite(contentEl, d.content || "").then(function () {
      if (d.is_last || n === 5) showFinalTest(card); else showAnswerInput(n, card);
    });
  }

  function showAnswerInput(n, card) {
    var box = card.querySelector("[data-test]");
    box.style.display = "block";
    box.innerHTML =
      '<div class="muted small" style="margin-bottom:8px">按你的理解说出想法，不必担心对错——老师会根据你的回答调整引导。</div>' +
      '<textarea id="guideAnswer' + n + '" placeholder="大胆说出你的理解…"></textarea>' +
      '<div class="flex" style="gap:10px;margin-top:10px">' +
      '<button class="btn primary" id="guideSubmit' + n + '">提交回答</button>' +
      '<button class="btn" id="guideSkip' + n + '">答不上来，请提示</button></div>';
    document.getElementById("guideSubmit" + n).addEventListener("click", function () { submitAnswer(n, false); });
    document.getElementById("guideSkip" + n).addEventListener("click", function () { submitAnswer(n, true); });
    var ta = document.getElementById("guideAnswer" + n);
    if (ta) {
      ta.focus();
      ta.addEventListener("keydown", function (e) { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) submitAnswer(n, false); });
    }
  }

  function submitAnswer(n, skip) {
    var card = stepList.querySelector('[data-step="' + n + '"]');
    var box = card.querySelector("[data-test]");
    var ta = document.getElementById("guideAnswer" + n);
    var text = skip ? "（我暂时想不出来，请给我提示）" : ((ta && ta.value) || "").trim();
    if (!skip && !text) { LL.toast("先说出你的想法，老师才能帮你"); return; }
    Array.prototype.forEach.call(box.querySelectorAll("button"), function (b) { b.disabled = true; });
    setAgent("feynman", "running");
    log('<span class="lt">你</span> → ' + esc(text.slice(0, 40)), "ll-user");
    api.guideStep({ sessionId: session.id, answer: text, level: session.difficulty })
      .then(function (res) {
        if (!res || !res.data) throw new Error("empty");
        setAgent("feynman", "done", 1);
        var d = res.data;
        if (d.step > currentGuideStep) { for (var i = currentGuideStep; i < d.step; i++) setStepState(i, "done"); currentGuideStep = d.step; }
        log('费曼教学 → 第 ' + d.step + ' 步「' + esc(d.step_name || "") + '」', "ll-done");
        box.style.display = "none";
        return renderGuide(d);
      })
      .catch(function () {
        LL.toast("回答提交失败，请重试");
        Array.prototype.forEach.call(box.querySelectorAll("button"), function (b) { b.disabled = false; });
        setAgent("feynman", "done", 1);
      });
  }

  function showFinalTest(card) {
    var testBox = card.querySelector("[data-test]");
    testBox.style.display = "block";
    testBox.innerHTML =
      '<div style="font-size:13px;font-weight:600;margin-bottom:8px">你的 30 秒讲解（费曼测试）</div>' +
      '<textarea id="feynmanText" placeholder="用最简单的话，把刚才学到的讲给一个完全不懂的人听…"></textarea>' +
      '<div class="flex" style="gap:10px;margin-top:10px">' +
      '<button class="btn primary" id="testSubmit">提交讲解</button>' +
      '<button class="btn" id="testSkip">跳过测试</button></div>';
    var resultBox = card.querySelector("[data-result]");
    function finish() {
      testBox.style.display = "none";
      setStepState(5, "done");
      var acts = document.getElementById("learnActions");
      acts.style.display = "flex";
    }
    document.getElementById("testSubmit").addEventListener("click", function () {
      var text = (document.getElementById("feynmanText") || {}).value || "";
      this.disabled = true;
      setAgent("coach", "running");
      log('评测与路径 → 对费曼测试五维评分');
      api.submitFeynmanTest({ sessionId: session.id, text: text }).then(function (r) {
        var d = (r && r.data) || {};
        feynmanScore = d.score != null ? d.score : 80;
        setAgent("coach", "done", 1);
        log('费曼测试得分 ' + feynmanScore, "ll-done");
        resultBox.style.display = "block";
        var fb = d.feedback || {};
        resultBox.innerHTML = '<div class="card" style="padding:14px"><b style="font-size:18px">' + feynmanScore + ' 分</b> ' + esc(d.verdict || "") +
          '<div class="muted small" style="margin-top:6px">' +
          esc((fb.accuracy && fb.accuracy.comment) || "") + (fb.accuracy ? " · " : "") + esc((fb.simplicity && fb.simplicity.comment) || "") + '</div></div>';
        finish();
      }).catch(function () { this.disabled = false; LL.toast("评分失败，请重试"); });
    });
    document.getElementById("testSkip").addEventListener("click", function () {
      feynmanScore = 80;
      setAgent("coach", "done", 1);
      resultBox.style.display = "block";
      resultBox.innerHTML = '<div class="card" style="padding:14px"><b>80 分</b> 已按默认成绩跳过测试</div>';
      finish();
    });
  }

  /* 降级：引导服务不可用时自动播放五步 */
  function runLegacy() {
    var p = Promise.resolve();
    for (var i = 1; i <= 5; i++) {
      (function (i) {
        p = p.then(function () {
          return api.runStep({ sessionId: session.id, step: i }).then(function (res) {
            var card = stepList.querySelector('[data-step="' + i + '"]');
            setStepState(i, "current");
            if (res && res.data) {
              return typewrite(card.querySelector("[data-content]"), res.data.content || "").then(function () {
                if (i === 5) showFinalTest(card);
              });
            }
            setStepState(i, "done");
          });
        });
      })(i);
    }
  }

  function startGuide() {
    if (guideBusy) return;
    guideBusy = true;
    log('费曼教学 → 老师正在准备第一个引导问题…');
    setAgent("feynman", "running");
    api.guideStep({ sessionId: session.id, level: session.difficulty })
      .then(function (res) {
        if (!res || !res.data) throw new Error("empty");
        setAgent("feynman", "done", 1);
        log('第 1 步「' + esc(res.data.step_name || "现象引入") + '」引导提问', "ll-done");
        return renderGuide(res.data);
      })
      .catch(function () {
        log("引导服务暂不可用，切换为自动讲解", "ll-done");
        setAgent("feynman", "done", 1);
        runLegacy();
      })
      .then(function () { guideBusy = false; });
  }
  startGuide();

  document.getElementById("reportBtn").addEventListener("click", function () {
    var btn = this;
    btn.disabled = true;
    var orig = btn.innerHTML;
    btn.innerHTML = '<i class="icon icon-16 icon-clock spin"></i> 评测与路径 Agent 汇总中…';
    api.generateReport({ sessionId: session.id, feynmanScore: feynmanScore })
      .then(function (res) {
        SessionStore.save({ mode: "report", report: res.data });
        location.href = "report.html";
      })
      .catch(function () { LL.toast("生成失败，请重试"); btn.disabled = false; btn.innerHTML = orig; });
  });
  document.getElementById("restartBtn").addEventListener("click", function () {
    SessionStore.clear();
    location.href = "start.html";
  });
})();
</script>
</body>
</html>
