<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#08080d">
<meta name="format-detection" content="telephone=no, email=no, address=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="referrer" content="no-referrer-when-downgrade">
<title>LumiTerminal · v5</title>
<!-- PWA -->
<link rel="manifest" href="/static/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Poppins:wght@400;500;600&family=Lora:wght@400;500&display=swap" rel="stylesheet">
<!-- KaTeX 数学渲染 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<!-- 手写字体 -->
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&display=swap" rel="stylesheet">
<!-- highlight.js 代码高亮 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github.min.css">
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
<!-- Chart.js 图表绘制 -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
<style>
:root {
--bg-deep: #08080d;
--bg-surface: #141413;
--bg-elevated: #1c1c1a;
--text-primary: #faf9f5;
--text-secondary: #b0aea5;
--text-dim: #6b6b6b;
--accent-orange: #d97757;
--accent-blue: #6a9bcc;
--accent-green: #788c5d;
--border: #2a2a2a;
--glow-orange: rgba(217, 119, 87, 0.15);
--glow-blue: rgba(106, 155, 204, 0.1);
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { height: 100%; }
body {
font-family: 'Poppins', system-ui, -apple-system, sans-serif;
background: var(--bg-deep);
color: var(--text-primary);
height: 100vh;
height: 100dvh;
min-height: -webkit-fill-available;
width: 100%;
overflow: hidden;
display: flex;
flex-direction: column;
-webkit-font-smoothing: antialiased;
-webkit-text-size-adjust: 100%;
-webkit-overflow-scrolling: touch;
overscroll-behavior-y: contain;
user-select: none;
}
.msg-text, .msg-text *, #inputBox, textarea, .welcome, .welcome * { user-select: text; }

/* 键盘弹出时适配虚拟视口（iOS Safari） */
html, body { height: 100%; height: 100dvh; }
canvas#stars {
position: fixed;
top: 0; left: 0;
width: 100%; height: 100%;
z-index: 0;
pointer-events: none;
}

/* ── Header ── */
.header {
position: relative; z-index: 2;
display: flex;
align-items: center;
justify-content: space-between;
padding: 14px 28px;
padding-top: max(14px, env(safe-area-inset-top));
background: rgba(20, 20, 19, 0.85);
backdrop-filter: blur(16px);
-webkit-backdrop-filter: blur(16px);
border-bottom: 1px solid var(--border);
flex-shrink: 0;
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand-dot {
width: 10px; height: 10px;
border-radius: 50%;
background: var(--accent-orange);
box-shadow: 0 0 12px var(--accent-orange);
animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse {
0%, 100% { opacity: 1; transform: scale(1); }
50% { opacity: 0.6; transform: scale(1.3); }
}
.brand-dot.active { animation-duration: 0.6s; }
.brand h1 {
font-family: 'Lora', serif;
font-size: 18px;
font-weight: 500;
color: var(--text-primary);
letter-spacing: -0.3px;
}
.model-badge {
font-family: 'JetBrains Mono', monospace;
font-size: 12px;
color: var(--accent-orange);
background: rgba(217, 119, 87, 0.1);
padding: 4px 12px;
border-radius: 20px;
border: 1px solid rgba(217, 119, 87, 0.2);
}
.header-right { display: flex; align-items: center; gap: 16px; }
.header-right select {
font-family: 'JetBrains Mono', monospace;
font-size: 12px;
background: var(--bg-elevated);
color: var(--text-primary);
border: 1px solid var(--border);
border-radius: 6px;
padding: 6px 12px;
cursor: pointer;
outline: none;
}
.header-right select:focus { border-color: var(--accent-blue); }
.feynman-toggle {
display: flex;
align-items: center;
gap: 6px;
font-family: 'JetBrains Mono', monospace;
font-size: 11px;
color: var(--text-dim);
cursor: pointer;
user-select: none;
transition: color 0.2s;
}
.feynman-toggle:hover { color: var(--text-primary); }
.feynman-toggle.active { color: var(--accent-orange); }
.feynman-switch {
width: 32px; height: 18px;
background: var(--bg-elevated);
border: 1px solid var(--border);
border-radius: 9px;
position: relative;
cursor: pointer;
transition: all 0.25s;
flex-shrink: 0;
}
.feynman-switch::after {
content: '';
position: absolute;
width: 12px; height: 12px;
background: var(--text-dim);
border-radius: 50%;
top: 2px; left: 2px;
transition: all 0.25s;
}
.feynman-switch.on {
background: rgba(217, 119, 87, 0.15);
border-color: var(--accent-orange);
}
.feynman-switch.on::after {
background: var(--accent-orange);
left: 16px;
box-shadow: 0 0 6px var(--accent-orange);
}
.status-dot {
width: 8px; height: 8px; border-radius: 50%;
background: var(--accent-green);
box-shadow: 0 0 6px var(--accent-green);
}
.latency {
font-family: 'JetBrains Mono', monospace;
font-size: 11px;
color: var(--text-dim);
}

/* ── Chat Area ── */
.chat {
position: relative; z-index: 2;
flex: 1;
overflow-y: auto;
padding: 32px 28px;
display: flex;
flex-direction: column;
gap: 28px;
scroll-behavior: smooth;
-webkit-overflow-scrolling: touch;
overscroll-behavior-y: contain;
}
.chat::-webkit-scrollbar { width: 4px; }
.chat::-webkit-scrollbar-track { background: transparent; }
.chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.message { display: flex; gap: 14px; animation: msgIn 0.4s ease-out; }
@keyframes msgIn {
from { opacity: 0; transform: translateY(12px); }
to { opacity: 1; transform: translateY(0); }
}
.msg-avatar {
width: 32px; height: 32px;
border-radius: 6px;
display: flex;
align-items: center;
justify-content: center;
font-size: 13px;
font-weight: 600;
flex-shrink: 0;
}
.msg-avatar.user { background: var(--accent-blue); color: white; }
.msg-avatar.model { background: var(--accent-orange); color: white; }
.msg-content {
flex: 1;
min-width: 0;
}
.msg-label {
font-size: 11px;
font-weight: 600;
color: var(--text-dim);
text-transform: uppercase;
letter-spacing: 1px;
margin-bottom: 6px;
}
.msg-text {
font-family: 'Lora', Georgia, serif;
font-size: 15px;
line-height: 1.75;
color: var(--text-primary);
}
.msg-text h1, .msg-text h2, .msg-text h3 {
font-family: 'Poppins', system-ui, sans-serif;
color: var(--accent-orange);
margin: 16px 0 8px;
font-weight: 500;
}
.msg-text h3 { font-size: 16px; }
.msg-text p { margin-bottom: 10px; }
.msg-text code {
font-family: 'JetBrains Mono', monospace;
font-size: 13px;
background: var(--bg-elevated);
padding: 2px 6px;
border-radius: 4px;
color: var(--accent-blue);
}
.msg-text .math-inline {
font-family: 'JetBrains Mono', monospace;
font-size: 14px;
color: var(--accent-green);
background: rgba(120, 140, 93, 0.08);
padding: 2px 6px;
border-radius: 3px;
letter-spacing: 0.3px;
}
.msg-text pre {
background: var(--bg-surface);
border: 1px solid var(--border);
border-radius: 8px;
padding: 16px;
margin: 12px 0;
overflow-x: auto;
}
.msg-text pre code {
background: none;
padding: 0;
color: var(--accent-green);
}
.msg-text strong { color: var(--accent-orange); font-weight: 500; }
.msg-text em { color: var(--text-secondary); }
.msg-text ul, .msg-text ol { margin: 8px 0 8px 20px; }
.msg-text li { margin-bottom: 4px; }
.msg-text blockquote {
border-left: 2px solid var(--accent-orange);
padding-left: 14px;
color: var(--text-secondary);
margin: 10px 0;
font-style: italic;
}

.welcome {
text-align: center;
padding: 60px 20px;
opacity: 0.7;
}
.welcome h2 {
font-family: 'Lora', serif;
font-size: 24px;
color: var(--text-primary);
margin-bottom: 12px;
}
.welcome p {
color: var(--text-secondary);
font-size: 14px;
max-width: 480px;
margin: 0 auto;
line-height: 1.6;
}
.welcome .hint {
margin-top: 20px;
font-family: 'JetBrains Mono', monospace;
font-size: 12px;
color: var(--text-dim);
}

/* ── Input ── */
.input-bar {
position: relative; z-index: 2;
padding: 16px 28px;
padding-bottom: max(16px, env(safe-area-inset-bottom));
background: rgba(20, 20, 19, 0.9);
backdrop-filter: blur(16px);
-webkit-backdrop-filter: blur(16px);
border-top: 1px solid var(--border);
flex-shrink: 0;
}
.input-wrap {
display: flex;
gap: 12px;
align-items: flex-end;
}
.input-wrap textarea {
flex: 1;
font-family: 'JetBrains Mono', monospace;
font-size: 14px;
background: var(--bg-elevated);
color: var(--text-primary);
border: 1px solid var(--border);
border-radius: 8px;
padding: 12px 16px;
resize: none;
outline: none;
line-height: 1.5;
min-height: 44px;
max-height: 160px;
transition: border-color 0.2s;
-webkit-appearance: none;
appearance: none;
caret-color: var(--accent-orange);
}
.input-wrap textarea:focus { border-color: var(--accent-orange); }
.input-wrap textarea::placeholder { color: var(--text-dim); }
.btn-send {
flex-shrink: 0;
width: 44px; height: 44px;
background: var(--accent-orange);
color: white;
border: none;
border-radius: 8px;
font-size: 18px;
cursor: pointer;
transition: all 0.2s;
display: flex;
align-items: center;
justify-content: center;
}
.btn-send:hover { background: #c86641; transform: translateY(-1px); }
.btn-send:disabled {
background: var(--border);
cursor: not-allowed;
transform: none;
}
.btn-clear {
flex-shrink: 0;
font-family: 'JetBrains Mono', monospace;
font-size: 11px;
background: none;
color: var(--text-dim);
border: 1px solid var(--border);
border-radius: 8px;
padding: 12px 14px;
cursor: pointer;
transition: all 0.2s;
}
.btn-clear:hover { color: var(--text-primary); border-color: var(--text-dim); }
.cursor-blink {
display: inline-block;
width: 2px; height: 16px;
background: var(--accent-orange);
margin-left: 2px;
animation: blink 1s step-end infinite;
vertical-align: text-bottom;
}
@keyframes blink {
0%, 100% { opacity: 1; }
50% { opacity: 0; }
}

/* ── Mic Button ── */
.btn-mic {
flex-shrink: 0;
width: 44px; height: 44px;
background: var(--accent-blue);
color: white;
border: none;
border-radius: 8px;
font-size: 18px;
cursor: pointer;
transition: all 0.2s;
display: flex;
align-items: center;
justify-content: center;
}
.btn-mic:hover { background: #5a8ab5; transform: translateY(-1px); }
.btn-mic.recording {
background: #e53e3e;
animation: micPulse 1s ease-in-out infinite;
}
@keyframes micPulse {
0%, 100% { box-shadow: 0 0 4px #e53e3e; }
50% { box-shadow: 0 0 16px #e53e3e; }
}
.btn-mic:disabled {
background: var(--border);
cursor: not-allowed;
transform: none;
}

/* ── Message Label Row (消息标签 + 操作按钮) ── */
.msg-label-row {
display: flex;
align-items: center;
justify-content: space-between;
gap: 10px;
margin-bottom: 6px;
}
.msg-actions {
display: flex;
align-items: center;
gap: 4px;
}

/* ── Speak Button (消息朗读按钮) ── */
.btn-speak {
display: inline-flex;
align-items: center;
gap: 6px;
height: 26px;
padding: 0 8px;
border-radius: 6px;
border: 1px solid var(--border);
background: transparent;
color: var(--text-dim);
font-size: 11px;
font-family: inherit;
cursor: pointer;
transition: all 0.15s ease;
white-space: nowrap;
}
.btn-speak svg { width: 12px; height: 12px; flex-shrink: 0; }
.btn-speak:hover {
color: var(--accent-orange);
border-color: var(--accent-orange);
background: rgba(217, 119, 87, 0.08);
}
.btn-speak.speaking {
color: #fff;
background: var(--accent-orange);
border-color: var(--accent-orange);
animation: speakPulse 1.2s ease-in-out infinite;
}
.btn-speak.speaking:hover {
background: #c56847;
border-color: #c56847;
}
.btn-speak.loading {
color: var(--accent-blue);
border-color: var(--accent-blue);
opacity: 0.85;
}
.btn-speak.speak-error {
color: #e53e3e;
border-color: #e53e3e;
}
.btn-speak .speak-label { font-weight: 500; letter-spacing: 0.02em; }
@keyframes speakPulse {
0%, 100% { box-shadow: 0 0 0 0 rgba(217, 119, 87, 0.4); }
50% { box-shadow: 0 0 0 4px rgba(217, 119, 87, 0.12); }
}

/* ── OCR Button ── */
.btn-ocr {
flex-shrink: 0;
width: 44px; height: 44px;
background: var(--accent-green);
color: white;
border: none;
border-radius: 8px;
font-size: 18px;
cursor: pointer;
transition: all 0.2s;
display: flex;
align-items: center;
justify-content: center;
}
.btn-ocr:hover { background: #6b7a50; transform: translateY(-1px); }
.btn-ocr.loading {
background: #4a8c3f;
animation: ocrSpin 1s linear infinite;
}
@keyframes ocrSpin {
0% { transform: rotate(0deg); }
100% { transform: rotate(360deg); }
}
.btn-ocr:disabled {
background: var(--border);
cursor: not-allowed;
transform: none;
animation: none;
}
.ocr-preview {
margin-bottom: 10px;
padding: 8px;
background: var(--bg-elevated);
border: 1px solid var(--border);
border-radius: 8px;
}
.ocr-preview img {
max-width: 160px;
max-height: 120px;
border-radius: 4px;
display: block;
}

/* ── Icon System ── */
.btn-icon {
  width: 20px; height: 20px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.btn-spinner {
  width: 20px; height: 20px;
  animation: spin 0.8s linear infinite;
}
.btn-spinner circle {
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-dasharray: 40;
  stroke-dashoffset: 30;
}
@keyframes spin {
  to { transform: rotate(360deg); }
}

/* ── Review ── */
.btn-review {
flex-shrink: 0;
width: 44px; height: 44px;
background: var(--accent-orange);
color: white;
border: none;
border-radius: 8px;
font-size: 18px;
cursor: pointer;
transition: all 0.2s;
display: flex;
align-items: center;
justify-content: center;
}
.btn-review:hover { background: #c86641; transform: translateY(-1px); }
.btn-review:disabled {
background: var(--border);
cursor: not-allowed;
transform: none;
}
.review-panel {
position: relative;
background: var(--bg-elevated);
border: 1px solid var(--border);
border-radius: 12px;
padding: 24px;
margin: 0 0 20px 0;
animation: reviewSlideIn 0.4s ease-out;
max-width: 100%;
}
@keyframes reviewSlideIn {
from { opacity: 0; transform: translateY(16px) scale(0.96); }
to { opacity: 1; transform: translateY(0) scale(1); }
}
.review-header {
display: flex;
align-items: center;
justify-content: space-between;
margin-bottom: 20px;
}
.review-header h3 {
font-family: 'Poppins', system-ui, sans-serif;
font-size: 16px;
font-weight: 500;
color: var(--text-primary);
margin: 0;
}
.review-close {
background: none;
border: 1px solid var(--border);
color: var(--text-dim);
font-size: 16px;
cursor: pointer;
width: 28px; height: 28px;
border-radius: 6px;
display: flex;
align-items: center;
justify-content: center;
transition: all 0.2s;
}
.review-close:hover { color: var(--text-primary); border-color: var(--text-dim); }
.review-score-wrap {
display: flex;
align-items: center;
gap: 20px;
margin-bottom: 20px;
padding-bottom: 16px;
border-bottom: 1px solid var(--border);
}
.review-score {
font-family: 'JetBrains Mono', monospace;
font-size: 48px;
font-weight: 500;
line-height: 1;
}
.review-score.high { color: var(--accent-green); }
.review-score.medium { color: var(--accent-orange); }
.review-score.low { color: #f85149; }
.review-score-label {
font-family: 'JetBrains Mono', monospace;
font-size: 11px;
color: var(--text-dim);
text-transform: uppercase;
letter-spacing: 1px;
}
.review-dimension {
margin-bottom: 12px;
}
.review-dimension:last-of-type { margin-bottom: 20px; }
.review-dim-name {
font-size: 13px;
color: var(--text-secondary);
margin-bottom: 6px;
display: flex;
justify-content: space-between;
}
.review-dim-score {
font-family: 'JetBrains Mono', monospace;
font-size: 12px;
color: var(--text-primary);
}
.review-dim-bar {
height: 6px;
background: var(--bg-surface);
border-radius: 3px;
overflow: hidden;
}
.review-dim-fill {
height: 100%;
border-radius: 3px;
transition: width 0.6s ease-out;
}
.review-dim-fill.high { background: var(--accent-green); }
.review-dim-fill.medium { background: var(--accent-orange); }
.review-dim-fill.low { background: #f85149; }
.review-suggestions {
padding-top: 12px;
border-top: 1px solid var(--border);
}
.review-suggestions h4 {
font-family: 'Poppins', system-ui, sans-serif;
font-size: 13px;
font-weight: 500;
color: var(--text-primary);
margin-bottom: 10px;
}
.review-suggestion {
font-size: 13px;
color: var(--text-secondary);
padding: 6px 0;
padding-left: 16px;
position: relative;
line-height: 1.5;
}
.review-suggestion::before {
content: '▸';
position: absolute;
left: 0;
color: var(--accent-orange);
}
.review-summary {
font-size: 13px;
color: var(--text-secondary);
line-height: 1.6;
margin-bottom: 16px;
padding: 12px;
background: var(--bg-surface);
border-radius: 8px;
}

/* ── Resources Panel ── */
.btn-resources {
flex-shrink: 0;
width: 44px; height: 44px;
background: var(--accent-blue);
color: white;
border: none;
border-radius: 8px;
font-size: 18px;
cursor: pointer;
transition: all 0.2s;
display: flex;
align-items: center;
justify-content: center;
}
.btn-resources:hover { background: #5a8ab5; transform: translateY(-1px); }
.btn-resources:disabled {
background: var(--border);
cursor: not-allowed;
transform: none;
}
.resources-panel {
position: relative; z-index: 2;
background: rgba(20, 20, 19, 0.9);
backdrop-filter: blur(16px);
border-bottom: 1px solid var(--border);
flex-shrink: 0;
overflow: hidden;
max-height: 360px;
transition: max-height 0.35s ease, padding 0.35s ease;
}
.resources-panel.collapsed {
max-height: 42px;
}
.resources-toggle {
font-family: 'JetBrains Mono', monospace;
font-size: 12px;
color: var(--accent-blue);
padding: 12px 28px;
cursor: pointer;
user-select: none;
transition: color 0.2s;
border-bottom: 1px solid var(--border);
}
.resources-toggle:hover { color: var(--text-primary); }
.resources-list {
padding: 16px 28px;
display: flex;
flex-direction: column;
gap: 14px;
max-height: 280px;
overflow-y: auto;
}
.resources-list::-webkit-scrollbar { width: 4px; }
.resources-list::-webkit-scrollbar-track { background: transparent; }
.resources-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
.resource-item {
padding: 12px 16px;
background: var(--bg-elevated);
border: 1px solid var(--border);
border-radius: 8px;
transition: border-color 0.2s;
}
.resource-item:hover { border-color: var(--accent-blue); }
.resource-item a {
font-family: 'Poppins', system-ui, sans-serif;
font-size: 14px;
font-weight: 500;
color: var(--accent-blue);
text-decoration: none;
display: block;
margin-bottom: 4px;
transition: color 0.2s;
}
.resource-item a:hover { color: var(--text-primary); text-decoration: underline; }
.resource-item .resource-summary {
font-size: 13px;
color: var(--text-secondary);
line-height: 1.5;
}
.resource-source {
font-family: 'JetBrains Mono', monospace;
font-size: 10px;
color: var(--text-dim);
margin-top: 6px;
text-transform: uppercase;
letter-spacing: 0.5px;
}
.resource-rag-summary {
margin-top: 16px;
padding: 14px 16px;
background: rgba(106, 155, 204, 0.06);
border: 1px solid rgba(106, 155, 204, 0.15);
border-radius: 8px;
}
.resource-rag-summary h4 {
font-family: 'Poppins', system-ui, sans-serif;
font-size: 13px;
font-weight: 500;
color: var(--accent-blue);
margin-bottom: 8px;
}
.resource-rag-summary p {
font-size: 13px;
color: var(--text-secondary);
line-height: 1.6;
}

/* KaTeX 手写字体覆盖 */
.katex { font-family: 'Caveat', 'Comic Sans MS', 'Segoe Script', cursive !important; }
.katex .mathrm, .katex .mathbf { font-family: 'Caveat', 'Comic Sans MS', 'Segoe Script', cursive !important; }
.math-block { text-align: center; margin: 16px 0; padding: 8px; overflow-x: auto; }
@media (max-width: 768px) { .katex { font-size: 1.1em; } }

/* 代码块 Light 主题 */
.code-block-wrapper { position: relative; margin: 12px 0; border-radius: 6px; overflow: hidden; }
.code-block-light { background: #f8f9fa; color: #24292e; padding: 16px; margin: 0; overflow-x: auto; font-size: 13px; line-height: 1.5; border: 1px solid #e1e4e8; }
.code-block-light code { font-family: 'Consolas', 'Monaco', 'Courier New', monospace; }
.code-lang-label { position: absolute; top: 0; right: 0; background: #e1e4e8; color: #586069; padding: 2px 8px; font-size: 11px; border-radius: 0 0 0 6px; }
/* 行号 */
.code-block-light { counter-reset: line; }
.code-block-light .line { display: block; }
.code-block-light .line::before { counter-increment: line; content: counter(line); display: inline-block; width: 2em; margin-right: 1em; text-align: right; color: #999; font-size: 12px; user-select: none; }

/* 图表 */
.chart-container { background: #1e1e2e; border-radius: 8px; padding: 16px; margin: 12px 0; max-width: 100%; }
.chart-container canvas { max-height: 400px; width: 100% !important; }
.chart-title { color: #cdd6f4; font-size: 14px; text-align: center; margin-bottom: 8px; }
.chart-fallback { color: #a6adc8; font-size: 12px; text-align: center; padding: 20px; font-style: italic; }

/* ── 触摸反馈 & 移动端基础样式 ── */
button, .btn-send, .btn-mic, .btn-ocr, .btn-clear,
.btn-resources, .btn-review, .btn-speak, .btn-copy, select,
.feynman-toggle, .feynman-switch {
  min-height: 44px;
  min-width: 44px;
  touch-action: manipulation;
  -webkit-touch-callout: none;
  user-select: none;
}
button:active, .btn-send:active, .btn-mic:active, .btn-ocr:active,
.btn-clear:active, .btn-resources:active, .btn-review:active,
.btn-speak:active {
  transform: scale(0.96);
  filter: brightness(0.9);
  transition: transform 0.05s ease, filter 0.1s ease;
}

/* 消息文字选择反馈 */
.msg-text { -webkit-user-select: text; user-select: text; }

/* ── 平板 / 桌面 (≥768px，默认) ── */
/* — 继承默认样式 — */

/* ── 平板 / 移动: ≤768px ── */
@media (max-width: 768px) {
  .header { padding: 8px 12px; padding-top: max(8px, env(safe-area-inset-top)); }
  .brand { gap: 6px; }
  .brand h1 { font-size: 16px; }
  .model-badge { font-size: 11px; padding: 3px 10px; }
  .header-right { gap: 10px; }
  .header-right select { font-size: 12px; padding: 4px 8px; }
  .feynman-toggle { font-size: 10px; gap: 4px; }
  .feynman-switch { width: 28px; height: 16px; border-radius: 8px; }
  .feynman-switch::after { width: 10px; height: 10px; top: 2px; left: 2px; }
  .feynman-switch.on::after { left: 14px; }
  .latency { display: none; }

  .chat { padding: 16px 12px; gap: 20px; }
  .message { gap: 10px; max-width: 100%; }
  .msg-avatar { width: 28px; height: 28px; font-size: 12px; }
  .msg-label { font-size: 10px; }
  .msg-text { font-size: 14px; line-height: 1.7; }
  .welcome { padding: 32px 12px; }
  .welcome h2 { font-size: 20px; }
  .welcome p { font-size: 13px; }

  .input-bar { padding: 10px 12px; padding-bottom: max(10px, env(safe-area-inset-bottom)); }
  .input-wrap { gap: 8px; }
  .input-wrap textarea { font-size: 14px; padding: 10px 12px; min-height: 40px; max-height: 120px; }
  .btn-send, .btn-mic, .btn-ocr, .btn-resources, .btn-review { width: 40px; height: 40px; }
  .btn-clear { padding: 10px 12px; font-size: 10px; }
  .katex { font-size: 1.05em; }
  .code-block-light, .chart-container { overflow-x: auto; -webkit-overflow-scrolling: touch; }
}

/* ── 手机 (≤560px) 竖屏模式 ── */
@media (max-width: 560px) {
  .header { padding: 6px 10px; padding-top: max(6px, env(safe-area-inset-top)); }
  .brand h1 { font-size: 14px; }
  .model-badge { font-size: 10px; padding: 2px 8px; }
  .header-right { gap: 8px; }
  .header-right select { font-size: 10px; padding: 4px 6px; max-width: 130px; }
  .feynman-toggle span { display: none; }
  .status-dot { width: 8px; height: 8px; }

  .chat { padding: 12px 8px; gap: 16px; }
  .message { gap: 8px; font-size: 13px; max-width: 100%; }
  .msg-avatar { width: 26px; height: 26px; font-size: 11px; border-radius: 5px; }
  .msg-label-row { flex-wrap: wrap; }
  .msg-text { font-size: 13px; line-height: 1.65; }
  .msg-text h1 { font-size: 16px; }
  .msg-text h2 { font-size: 15px; }
  .msg-text h3 { font-size: 14px; }
  .msg-text pre { padding: 10px; font-size: 11px; }
  .msg-text code { font-size: 11px; }
  .welcome { padding: 24px 10px; }
  .welcome h2 { font-size: 17px; margin-bottom: 8px; }
  .welcome p { font-size: 12px; }
  .welcome .hint { font-size: 11px; }

  .input-bar { padding: 8px; padding-bottom: max(8px, env(safe-area-inset-bottom)); }
  .input-wrap { gap: 6px; flex-wrap: nowrap; }
  .input-wrap textarea { font-size: 14px; padding: 8px 12px; min-height: 40px; max-height: 100px; border-radius: 10px; }
  .btn-send, .btn-mic, .btn-ocr, .btn-resources, .btn-review { width: 40px; height: 40px; font-size: 16px; }
  .btn-clear { display: none; }
  .katex { font-size: 1em; }
  .btn-speak { height: 24px; padding: 0 6px; font-size: 10px; }
  .btn-speak .speak-label { display: none; }
  .btn-speak svg { width: 12px; height: 12px; }
}

/* ── 超小屏 (≤380px) ── */
@media (max-width: 380px) {
  .brand h1 { font-size: 12px; }
  .header-right select { max-width: 100px; font-size: 9px; }
  .chat { padding: 10px 6px; gap: 14px; }
  .msg-text { font-size: 12px; line-height: 1.6; }
  .input-wrap textarea { font-size: 13px; }
  .btn-send, .btn-mic, .btn-ocr, .btn-resources, .btn-review { width: 38px; height: 38px; }
}

/* ── 横屏模式 (landscape) ── */
@media (orientation: landscape) and (max-height: 560px) {
  .header { padding: 6px 16px; padding-top: max(6px, env(safe-area-inset-top)); }
  .brand h1 { font-size: 14px; }
  .feynman-toggle span { display: none; }
  .header-right select { font-size: 11px; }

  .chat { padding: 10px 20px; gap: 14px; }
  .message { gap: 10px; }
  .msg-text { font-size: 13px; line-height: 1.6; }

  .input-bar { padding: 8px 16px; padding-bottom: max(8px, env(safe-area-inset-bottom)); }
  .input-wrap textarea { font-size: 13px; padding: 8px 12px; min-height: 38px; max-height: 80px; }
  .btn-send, .btn-mic, .btn-ocr, .btn-resources, .btn-review { width: 38px; height: 38px; }
}

/* ── 平板横屏 (landscape, medium height) ── */
@media (orientation: landscape) and (min-width: 768px) and (max-width: 1024px) {
  .header { padding: 10px 20px; padding-top: max(10px, env(safe-area-inset-top)); }
  .chat { padding: 18px 24px; gap: 22px; }
}

/* ── 焦点样式（键盘导航无障碍） ── */
button:focus-visible, select:focus-visible, textarea:focus-visible,
input:focus-visible {
  outline: 2px solid var(--accent-orange);
  outline-offset: 2px;
}

/* ── 减少动画（系统设置：减少运动） ── */
@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
}

/* ── 浅色主题回退（兼容不支持深色系统） ── */
@media (prefers-color-scheme: light) {
  :root { --bg-deep: #1a1a20; --bg-surface: #252530; --bg-elevated: #2e2e38; }
}

/* ── 虚拟键盘弹出时调整输入区 ── */
body.keyboard-open .input-bar {
  padding-top: 6px;
}
body.keyboard-open .chat {
  padding-bottom: 0;
}

/* ── 长按菜单（移动端） ── */
.long-press-menu {
  position: fixed;
  z-index: 9999;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: 10px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  padding: 4px;
  display: none;
  min-width: 140px;
}
.long-press-menu.visible { display: block; }
.long-press-menu button {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  background: transparent;
  color: var(--text-primary);
  border: none;
  padding: 10px 12px;
  border-radius: 6px;
  font-size: 13px;
  font-family: inherit;
  text-align: left;
  cursor: pointer;
  min-height: 38px;
}
.long-press-menu button:hover, .long-press-menu button:active {
  background: var(--border);
}
</style>
</head>
<body>

<canvas id="stars"></canvas>

<div class="header">
<div class="brand">
<div class="brand-dot" id="brandDot"></div>
<h1>LumiTerminal</h1>
<span class="model-badge" id="modelBadge">v5</span>
</div>
<div class="header-right">
<select id="modelSelect" onchange="switchModel()">
<option value="lumilearn-v5:real">lumilearn-v5:real</option>
<option value="qwen2.5:7b">qwen2.5:7b</option>
<option value="deepseek-r1:1.5b">deepseek-r1:1.5b</option>
</select>
<div class="feynman-toggle" id="feynmanToggle" onclick="toggleFeynman()" title="费曼引导模式：不直接给答案，用提问引导学生思考">
<div class="feynman-switch" id="feynmanSwitch"></div>
<span>费曼引导</span>
</div>
<button id="settings-btn" title="设置" style="background:none;border:none;color:#a6adc8;cursor:pointer;font-size:18px;padding:4px 8px;" onclick="openSettings()">⚙</button>
<div class="status-dot" id="statusDot"></div>
<span class="latency" id="latencyDisplay">--</span>
</div>
</div>

<div class="resources-panel collapsed" id="resourcesPanel">
<div class="resources-toggle" onclick="toggleResources()"> 相关资源 ▼</div>
<div class="resources-list" id="resourcesList"></div>
</div>

<!-- 设置面板 Modal -->
<div id="settings-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:1000;align-items:center;justify-content:center;">
<div style="background:#1e1e2e;border-radius:12px;width:90%;max-width:500px;max-height:80vh;overflow-y:auto;padding:24px;color:#cdd6f4;border:1px solid #313244;">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
<h3 style="margin:0;font-size:18px;">设置</h3>
<button onclick="closeSettings()" style="background:none;border:none;color:#a6adc8;cursor:pointer;font-size:20px;">✕</button>
</div>
<div style="display:flex;gap:8px;margin-bottom:16px;border-bottom:1px solid #313244;">
<button class="settings-tab active" onclick="switchSettingsTab('providers')" style="background:none;border:none;color:#cdd6f4;padding:8px 16px;cursor:pointer;border-bottom:2px solid #89b4fa;">API Key 管理</button>
</div>

<div id="provider-list" style="margin-bottom:12px;"></div>
<div style="display:flex;gap:8px;">
<select id="provider-select" style="flex:1;background:#313244;color:#cdd6f4;border:1px solid #45475a;padding:8px;border-radius:6px;"></select>
<input id="api-key-input" type="password" placeholder="sk-xxx..." style="flex:2;background:#313244;color:#cdd6f4;border:1px solid #45475a;padding:8px;border-radius:6px;">
<button onclick="addProviderKey()" style="background:#89b4fa;color:#1e1e2e;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-weight:bold;">保存</button>

</div>
</div>
</div>

<div class="chat" id="chatArea">
<div class="welcome">
<h2>LumiLearn V5 Observatory</h2>
<p>AI 生成的教育内容如星座般在深邃的数字空间中渐次点亮。输入你的问题开始探索。</p>
<div class="hint">Enter 发送 · Shift+Enter 换行 · Ctrl+L 清屏 · Ctrl+M 语音输入 · Ctrl+Shift+S 朗读最新消息 · Esc 停止</div>
</div>
</div>

<div class="input-bar">
<input type="file" id="ocrFileInput" accept="image/*" style="display:none" onchange="handleOCRFile(event)">
<div class="ocr-preview" id="ocrPreview" style="display:none"></div>
<div class="input-wrap">
<button class="btn-mic" id="btnMic" onclick="toggleRecording()" title="语音输入">
  <svg class="btn-icon" viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
</button>
<button class="btn-ocr" id="btnOcr" onclick="triggerOCR()" title="图片识别">
  <svg class="btn-icon" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5-5 5"/></svg>
</button>
<textarea id="inputBox" rows="1" placeholder="> 输入你的问题..." onkeydown="handleKey(event)"></textarea>

  <svg class="btn-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
</button>

  <svg class="btn-icon" viewBox="0 0 24 24"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/><polyline points="9 14 11 16 15 12"/></svg>
</button>
<button class="btn-send" id="btnSend" onclick="sendMessage()">↑</button>
<button class="btn-clear" onclick="clearChat()">Ctrl+L</button>
</div>
</div>

<script>
/* ═══════════════════════════════════════
STAR FIELD · Algorithmic Art Background
═══════════════════════════════════════ */
const canvas = document.getElementById('stars');
const ctx = canvas.getContext('2d');
let stars = [];
let generating = false;

function resizeCanvas() {
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

function initStars(count = 180) {
stars = [];
for (let i = 0; i < count; i++) {
stars.push({
x: Math.random() * canvas.width,
y: Math.random() * canvas.height,
r: Math.random() * 1.6 + 0.4,
baseR: Math.random() * 1.6 + 0.4,
vx: (Math.random() - 0.5) * 0.15,
vy: (Math.random() - 0.5) * 0.15,
twinkle: Math.random() * Math.PI * 2,
twinkleSpeed: Math.random() * 0.02 + 0.005,
brightness: Math.random() * 0.5 + 0.5,
hue: Math.random() < 0.08 ? 30 : Math.random() < 0.15 ? 210 : 0
});
}
}
initStars();

function drawStars() {
ctx.clearRect(0, 0, canvas.width, canvas.height);

for (let s of stars) {
s.x += s.vx * (generating ? 2.5 : 1);
s.y += s.vy * (generating ? 2.5 : 1);
if (s.x < 0) s.x = canvas.width;
if (s.x > canvas.width) s.x = 0;
if (s.y < 0) s.y = canvas.height;
if (s.y > canvas.height) s.y = 0;

s.twinkle += s.twinkleSpeed;
let alpha = s.brightness + Math.sin(s.twinkle) * 0.25;
if (generating) alpha = Math.min(1, alpha + 0.2);
s.r = s.baseR + Math.sin(s.twinkle) * 0.3;

ctx.beginPath();
ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);

if (s.hue === 30) {
ctx.fillStyle = `rgba(217,119,87,${alpha})`;
if (generating) {
ctx.shadowBlur = 6;
ctx.shadowColor = '#d97757';
}
} else if (s.hue === 210) {
ctx.fillStyle = `rgba(106,155,204,${alpha})`;
} else {
ctx.fillStyle = `rgba(250,249,245,${alpha})`;
}
ctx.fill();
ctx.shadowBlur = 0;
}
requestAnimationFrame(drawStars);
}
drawStars();

/* ═══════════════════════════════════════
CHAT · Terminal Logic
═══════════════════════════════════════ */
let currentModel = 'lumilearn-v5:real';
let explainMode = 'direct'; // 'direct' | 'feynman'
const chatArea = document.getElementById('chatArea');
const inputBox = document.getElementById('inputBox');
const btnSend = document.getElementById('btnSend');
const brandDot = document.getElementById('brandDot');
const statusDot = document.getElementById('statusDot');
const latencyDisplay = document.getElementById('latencyDisplay');
const modelBadge = document.getElementById('modelBadge');
const modelSelect = document.getElementById('modelSelect');

function handleKey(e) {
if (e.key === 'Enter' && !e.shiftKey) {
e.preventDefault();
sendMessage();
}
if (e.key === 'l' && e.ctrlKey) {
e.preventDefault();
clearChat();
}
if (e.key === 'm' && e.ctrlKey) {
e.preventDefault();
toggleRecording();
}
if (e.key === 'o' && e.ctrlKey) {
e.preventDefault();
triggerOCR();
}
if (e.key === 'r' && e.ctrlKey) {
e.preventDefault();
reviewLastContent();
}
if (e.key === 'f' && e.ctrlKey) {
e.preventDefault();
fetchResources();
}
if (e.key === 't' && e.ctrlKey) {
e.preventDefault();
toggleFeynman();
}
}

async function switchModel() {
var newModel = modelSelect.value;
var previousModel = currentModel;

currentModel = newModel;
var short = currentModel.includes('v5') ? 'v5' :
currentModel.includes('qwen') ? 'qwen' :
currentModel.includes('deepseek') ? 'r1' : '--';
modelBadge.textContent = short;
if (short === 'v5') modelBadge.style.color = '#d97757';
else if (short === 'qwen') modelBadge.style.color = '#6a9bcc';
else modelBadge.style.color = '#788c5d';

if (previousModel !== newModel && previousModel) {
try {
var resp = await fetch('/api/models/switch', {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({ model: newModel })
});
var data = await resp.json();
if (data.success) {
console.log('模型已切换: ' + data.previous_model + ' → ' + data.current_model);
}
} catch(e) {
console.warn('模型切换API调用失败（框架兼容模式）: ' + e.message);
}
}
}

function toggleFeynman() {
var sw = document.getElementById('feynmanSwitch');
var toggle = document.getElementById('feynmanToggle');
if (explainMode === 'direct') {
explainMode = 'feynman';
sw.classList.add('on');
toggle.classList.add('active');
inputBox.placeholder = '> 费曼引导中...输入你的问题';
} else {
explainMode = 'direct';
sw.classList.remove('on');
toggle.classList.remove('active');
inputBox.placeholder = '> 输入你的问题...';
}
fetch('/api/status').catch(function() {});
}

function clearChat() {
chatArea.innerHTML = `
<div class="welcome">
<h2>LumiLearn V5 Observatory</h2>
<p>AI 生成的教育内容如星座般在深邃的数字空间中渐次点亮。输入你的问题开始探索。</p>
<div class="hint">Enter 发送 · Shift+Enter 换行 · Ctrl+L 清屏 · Ctrl+M 录音 · Ctrl+O 识别 · Ctrl+F 搜索资源 · Ctrl+R 审查 · Ctrl+T 费曼模式</div>
</div>`;
var panel = document.getElementById('resourcesPanel');
if (panel && !panel.classList.contains('collapsed')) {
panel.classList.add('collapsed');
}
var rList = document.getElementById('resourcesList');
if (rList) rList.innerHTML = '';
}

function addMessage(role, text, extras) {
let welcome = chatArea.querySelector('.welcome');
if (welcome) welcome.remove();

let rawText = (extras && extras.rawText) ? extras.rawText : text;
let msgId = 'msg_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
let isAI = role !== 'user';

let div = document.createElement('div');
div.className = 'message';
div.id = msgId;
div.dataset.role = role;
if (isAI) div.dataset.text = rawText.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

div.innerHTML = `
<div class="msg-avatar ${role}">${isAI ? 'AI' : 'U'}</div>
<div class="msg-content">
<div class="msg-label-row">
<div class="msg-label">${isAI ? currentModel : 'You'}</div>
${isAI ? `
<div class="msg-actions">
<button class="btn-speak" onclick="toggleSpeak('${msgId}')" title="朗读 (Ctrl+Shift+S)">

function simpleMarkdown(text) {
// 提取图表标记
var chartBlocks = [];
text = text.replace(/\[chart:(\w+)\]\s*([\s\S]*?)\s*\[endchart\]/g, function(match, chartType, chartData) {
var idx = chartBlocks.length;
try {
chartBlocks.push({ type: chartType, data: JSON.parse(chartData) });
} catch(e) {
chartBlocks.push({ type: chartType, data: null, raw: chartData });
}
return '%%CHARTBLOCK_' + idx + '%%';
});

// 提取围栏代码块
var codeBlocks = [];
text = text.replace(/```(\w*)\n([\s\S]*?)```/g, function(match, lang, code) {
var idx = codeBlocks.length;
codeBlocks.push({ lang: lang || 'plaintext', code: code.trimEnd() });
return '%%CODEBLOCK_' + idx + '%%';
});

// HTML 转义（保护占位符）
text = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

// 恢复占位符（它们包含的数字和字母不受转义影响）
// 不处理 LaTeX 公式 —— 交给 KaTeX auto-render 处理

// Markdown 处理
text = text
.replace(/^### (.+)$/gm, '<h3>$1</h3>')
.replace(/^## (.+)$/gm, '<h2>$1</h2>')
.replace(/^# (.+)$/gm, '<h1>$1</h1>')
.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
.replace(/\*(.+?)\*/g, '<em>$1</em>')
.replace(/`([^`]+)`/g, '<code>$1</code>')
.replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>')
.replace(/^- (.+)$/gm, '<li>$1</li>')
.replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>')
.replace(/\n/g, '<br>');

// 替换代码块占位符
text = text.replace(/%%CODEBLOCK_(\d+)%%/g, function(match, idx) {
var cb = codeBlocks[parseInt(idx)];
var escaped = cb.code.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
var highlighted = '';
if (typeof hljs !== 'undefined') {
try {
var result = hljs.highlight(cb.code, { language: cb.lang, ignoreIllegals: true });
highlighted = result.value;
} catch(e) {
highlighted = escaped;
}
} else {
highlighted = escaped;
}
var lines = highlighted.split('\n');
var numbered = '';
for (var i = 0; i < lines.length; i++) {
numbered += '<span class="line">' + lines[i] + '</span>\n';
}
return '<div class="code-block-wrapper"><div class="code-lang-label">' + cb.lang + '</div><pre class="code-block-light"><code>' + numbered + '</code></pre></div>';
});

// 替换图表占位符
text = text.replace(/%%CHARTBLOCK_(\d+)%%/g, function(match, idx) {
var cb = chartBlocks[parseInt(idx)];
return '<div class="chart-container" data-chart-type="' + cb.type + '" data-chart-config="' + encodeURIComponent(JSON.stringify(cb.data)) + '"><div class="chart-title">' + (cb.data && cb.data.title ? cb.data.title : '图表') + '</div></div>';
});

return text;
}

async function sendMessage() {
let text = inputBox.value.trim();
if (!text) return;

inputBox.value = '';
inputBox.style.height = '44px';
btnSend.disabled = true;

addMessage('user', simpleMarkdown(text));

// 移除上一轮残留的旧 streaming 消息（防止 id 冲突和 DOM 残留）
let oldStream = document.getElementById('streamingMsg');
if (oldStream) oldStream.remove();

let streamingMsgDiv = addStreamingMessage();
let streamingText = streamingMsgDiv.querySelector('.msg-text');

generating = true;
brandDot.classList.add('active');
statusDot.style.background = '#d97757';
statusDot.style.boxShadow = '0 0 8px #d97757';

let fullText = '';
let cursorSpan = '<span class="cursor-blink"></span>';

let controller = new AbortController();
let timeoutId = setTimeout(function() { controller.abort(); }, 120000);

try {
let t0 = performance.now();
let resp = await fetch('/api/chat', {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({
model: currentModel,
messages: [{ role: 'user', content: text }],
stream: true,
mode: explainMode
}),
signal: controller.signal
});

if (!resp.ok) {
let errData = await resp.json().catch(function() { return {}; });
throw new Error(errData.error || 'HTTP ' + resp.status);
}

let reader = resp.body.getReader();
let decoder = new TextDecoder();
let buffer = '';

while (true) {
let { done, value } = await reader.read();
if (done) break;

buffer += decoder.decode(value, { stream: true });
let lines = buffer.split('\n');
buffer = lines.pop() || '';

for (let line of lines) {
if (!line.trim()) continue;
try {
let chunk = JSON.parse(line);

if (chunk.mode === 'feynman' && chunk.step) {
var stepLabel = chunk.step_name || ('Step ' + chunk.step);
var stepContent = chunk.content || '';
var separator = fullText ? '\n\n' : '';
fullText += separator + '【' + stepLabel + '】\n' + stepContent;
streamingText.innerHTML = simpleMarkdown(fullText) + cursorSpan;
chatArea.scrollTop = chatArea.scrollHeight;
continue;
}

let content = chunk?.message?.content || '';
fullText += content;
streamingText.innerHTML = simpleMarkdown(fullText) + cursorSpan;
chatArea.scrollTop = chatArea.scrollHeight;
} catch(e) {}
}
}

clearTimeout(timeoutId);
let latency = Math.round(performance.now() - t0);
latencyDisplay.textContent = latency + 'ms';
streamingText.innerHTML = simpleMarkdown(fullText || '(模型返回为空，请检查 Modelfile 配置)');
// KaTeX 渲染
if (typeof renderMathInElement !== 'undefined') {
try { renderMathInElement(streamingText, { throwOnError: false }); } catch(e) {}
}
// 图表渲染
renderChartsInElement(streamingText.parentElement);

} catch(e) {
clearTimeout(timeoutId);
let errMsg = e.name === 'AbortError' ? '请求超时（120秒）' : '连接失败: ' + e.message;
if (streamingText) streamingText.innerHTML = simpleMarkdown(errMsg);
statusDot.style.background = '#f85149';
statusDot.style.boxShadow = '0 0 8px #f85149';
}

// 同时清除 streamingMsg 和 streamingText 两个 id，避免下一轮发送时冲突
if (streamingMsgDiv) {
  streamingMsgDiv.removeAttribute('id');
  if (streamingText) streamingText.removeAttribute('id');
  // 保存纯文本供朗读使用（去除 markdown/HTML 标记，只朗读有意义的内容）
  if (fullText) {
    let speakText = fullText
      .replace(/```[\s\S]*?```/g, '（代码块）')
      .replace(/`([^`]+)`/g, '$1')
      .replace(/\*\*([^*]+)\*\*/g, '$1')
      .replace(/\*([^*]+)\*/g, '$1')
      .replace(/^### (.+)$/gm, '$1')
      .replace(/^## (.+)$/gm, '$1')
      .replace(/^# (.+)$/gm, '$1')
      .replace(/^> (.+)$/gm, '$1')
      .replace(/^- (.+)$/gm, '· $1')
      .replace(/\[chart[^\]]*\][\s\S]*?\[endchart\]/g, '（图表）')
      .replace(/<[^>]+>/g, '')
      .replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>');
    streamingMsgDiv.dataset.text = speakText;
  }
}

generating = false;
brandDot.classList.remove('active');
statusDot.style.background = '#788c5d';
statusDot.style.boxShadow = '0 0 6px #788c5d';
btnSend.disabled = false;
inputBox.focus();
}

inputBox.style.height = '44px';

});

/* ═══════════════════════════════════════
VOICE INPUT · Universal Speech-to-Text  (双栈：SpeechRecognition + MediaRecorder ASR + 文件上传 fallback)
═══════════════════════════════════════ */
let _voice = {
  // 状态机
  mode: null,              // 'realtime' | 'record' | null
  recognition: null,       // SpeechRecognition 实例
  mediaRecorder: null,     // MediaRecorder 实例
  audioChunks: [],
  micStream: null,
  activeTextarea: null,    // 当前绑定的输入框

  // 能力探测（启动时 + 变更时更新）
  caps: {
    speechRecognition: false,   // 浏览器原生实时识别
    mediaRecorder: false,       // 录音上传 ASR
    getUserMedia: false,        // 麦克风权限
  },
};

function _voiceDetectCaps() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  _voice.caps.speechRecognition = typeof SR !== 'undefined';
  _voice.caps.mediaRecorder = typeof window.MediaRecorder !== 'undefined';
  _voice.caps.getUserMedia = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
  console.log('[voice] caps:', _voice.caps);
}
_voiceDetectCaps();

// 工具：写入 input 文本
function _voiceAppendToInput(text) {
  if (!inputBox) return;
  const cur = inputBox.value || '';
  const sep = cur && !/\s$/.test(cur) ? ' ' : '';
  inputBox.value = cur + sep + text;
  inputBox.dispatchEvent(new Event('input'));
  inputBox.focus();
}

function _voiceSetMicUI(recording, modeLabel) {
  const btn = document.getElementById('btnMic');
  if (!btn) return;
  if (recording) {
    btn.classList.add('recording');
    btn.innerHTML = '<svg class="btn-icon" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>';
    inputBox.placeholder = modeLabel || ' 正在录音... (再点一次结束)';
  } else {
    btn.classList.remove('recording');
    btn.innerHTML = '<svg class="btn-icon" viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><line x1="12" y1="19" x2="12" y2="22"/></svg>';
    inputBox.placeholder = '> 输入你的问题...';
  }
}

/* -------- 入口：切换录音（统一按钮） -------- */
function toggleRecording() {
  if (_voice.mode) {
    stopVoiceInput();
    return;
  }
  // 优先：SpeechRecognition 实时识别（零延迟，无需上传）
  if (_voice.caps.speechRecognition) {
    startRealtimeRecognition();
    return;
  }
  // 降级：MediaRecorder 录音 -> 上传 Whisper ASR
  if (_voice.caps.mediaRecorder && _voice.caps.getUserMedia) {
    startRecordUpload();
    return;
  }
  // 最终 fallback：文件上传（老浏览器 / HTTPS 外场景）
  voicePickAudioFile();
}

/* -------- 方案 A：Web Speech API 实时识别 -------- */
function startRealtimeRecognition() {
  try {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    const rec = new SR();
    rec.lang = navigator.language && navigator.language.toLowerCase().startsWith('zh')
      ? 'zh-CN' : (navigator.language || 'en-US');
    rec.continuous = true;
    rec.interimResults = true;
    rec.maxAlternatives = 1;

    rec.onstart = function () {
      _voice.mode = 'realtime';
      _voice.recognition = rec;
      _voiceSetMicUI(true, ' 实时识别中... 再点一次停止');
    };

    rec.onresult = function (event) {
      let finalText = '';
      let interimText = '';
      for (let i = event.resultIndex; i < event.results.length; i++) {
        const r = event.results[i];
        if (r.isFinal) finalText += r[0].transcript;
        else interimText += r[0].transcript;
      }
      if (finalText) _voiceAppendToInput(finalText);
      // 临时结果只做 placeholder 提示，不入框
      if (interimText && inputBox) {
        inputBox.placeholder = '... ' + interimText.slice(0, 40);
      }
    };

    rec.onerror = function (event) {
      console.warn('[voice] recognition error:', event.error);
      if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
        alert('麦克风权限被拒绝，请在浏览器设置中允许麦克风访问。');
      } else if (event.error === 'no-speech') {
        // 没说话 — 静默处理
      } else {
        // 实时识别失败，降级为录音上传
        stopVoiceInput(true);
        if (_voice.caps.mediaRecorder && _voice.caps.getUserMedia) {
          setTimeout(startRecordUpload, 100);
        } else {
          voicePickAudioFile();
        }
      }
    };

    rec.onend = function () {
      // 若是用户主动停止（mode 已清空）则不再重启
      if (_voice.mode === 'realtime') {
        try { rec.start(); } catch (e) { stopVoiceInput(); }
      }
    };

    rec.start();
  } catch (err) {
    console.warn('[voice] realtime failed, fallback to record:', err);
    if (_voice.caps.mediaRecorder && _voice.caps.getUserMedia) {
      startRecordUpload();
    } else {
      voicePickAudioFile();
    }
  }
}

/* -------- 方案 B：MediaRecorder 录音 → 上传 Whisper -------- */
async function startRecordUpload() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    _voice.micStream = stream;
    _voice.audioChunks = [];

    let mimeType = '';
    if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) mimeType = 'audio/webm;codecs=opus';
    else if (MediaRecorder.isTypeSupported('audio/webm')) mimeType = 'audio/webm';

    const mr = new MediaRecorder(stream, mimeType ? { mimeType: mimeType } : {});
    _voice.mediaRecorder = mr;
    _voice.mode = 'record';

    mr.ondataavailable = function (e) {
      if (e.data && e.data.size > 0) _voice.audioChunks.push(e.data);
    };
    mr.onstop = function () {
      const blob = new Blob(_voice.audioChunks, { type: mr.mimeType || 'audio/webm' });
      stream.getTracks().forEach(function (t) { t.stop(); });
      uploadAudioForASR(blob);
    };

    mr.start();
    _voiceSetMicUI(true, ' 录音中... 再点一次结束并识别');
  } catch (err) {
    if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
      alert('麦克风权限被拒绝，请在浏览器设置中允许麦克风访问。');
    } else {
      console.warn('[voice] record failed, fallback to file picker:', err);
      voicePickAudioFile();
    }
  }
}

/* -------- 方案 C：老浏览器 fallback — 文件上传 -------- */
function voicePickAudioFile() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'audio/*';
  input.onchange = function (ev) {
    const file = ev.target.files && ev.target.files[0];
    if (file) uploadAudioForASR(file);
  };
  input.click();
}

function stopVoiceInput(silent) {
  if (_voice.mode === 'realtime' && _voice.recognition) {
    try { _voice.recognition.stop(); } catch (e) {}
  }
  if (_voice.mode === 'record' && _voice.mediaRecorder && _voice.mediaRecorder.state === 'recording') {
    _voice.mediaRecorder.stop();
  }
  if (_voice.micStream) {
    try { _voice.micStream.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {}
    _voice.micStream = null;
  }
  _voice.mode = null;
  _voice.recognition = null;
  _voice.mediaRecorder = null;
  if (!silent) _voiceSetMicUI(false);
}

function uploadAudioForASR(blobOrFile) {
  inputBox.placeholder = ' 识别中...';
  const fd = new FormData();
  const name = (blobOrFile instanceof File) ? blobOrFile.name : 'recording.webm';
  fd.append('audio', blobOrFile, name);

  fetch('/api/speech', { method: 'POST', body: fd })
    .then(function (resp) {
      if (!resp.ok) return resp.json().then(function (d) { throw new Error(d.error || 'HTTP ' + resp.status); });
      return resp.json();
    })
    .then(function (data) {
      const text = (data && data.text) || '';
      if (!text) {
        inputBox.placeholder = ' 未识别到内容，请再试一次';
        setTimeout(function () { inputBox.placeholder = '> 输入你的问题...'; }, 2500);
        return;
      }
      _voiceAppendToInput(text);
      inputBox.placeholder = '> 输入你的问题...';
    })
    .catch(function (err) {
      inputBox.placeholder = '[X] 识别失败: ' + err.message;
      setTimeout(function () { inputBox.placeholder = '> 输入你的问题...'; }, 3500);
    });
}

/* ═══════════════════════════════════════
AI VOICE · Text-to-Speech  (双栈：speechSynthesis + 后端 TTS)
═══════════════════════════════════════ */
let _tts = {
  engine: null,           // 'browser' | 'voicebox'
  utter: null,            // SpeechSynthesisUtterance
  audio: null,            // HTMLAudioElement（voicebox 时用）
  speaking: false,
  currentMsgId: null,
  voice: null,            // 浏览器 voices 缓存的中文语音
};

function _ttsPickBrowserVoice() {
  if (!('speechSynthesis' in window)) return null;
  const voices = window.speechSynthesis.getVoices() || [];
  // 优先：中文
  let v = voices.find(function (x) { return /zh|cmn|Mandarin/i.test(x.lang); });
  if (v) return v;
  // 其次：本地
  v = voices.find(function (x) { return x.localService === true; });
  if (v) return v;
  return voices[0] || null;
}

if ('speechSynthesis' in window) {
  window.speechSynthesis.onvoiceschanged = function () {
    _tts.voice = _ttsPickBrowserVoice();
  };
  // 首次尝试
  setTimeout(function () { _tts.voice = _ttsPickBrowserVoice(); }, 800);
}

// 简易 HTML→plain text（主要用于朗读前清理 —— 上面已在流式完成时做了较完整清洗）
function _cleanForSpeak(htmlOrText) {
  return String(htmlOrText || '')
    .replace(/<[^>]+>/g, '')
    .replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>')
    .replace(/&quot;/g, '"').replace(/&#39;/g, "'")
    .replace(/\u200B/g, '').trim();
}

function _ttsUiState(msgId, state, labelText) {
  const msg = document.getElementById(msgId);
  if (!msg) return;
  const btn = msg.querySelector('.btn-speak');
  if (!btn) return;
  btn.classList.remove('speaking', 'loading');
  btn.classList.remove('speak-error');
  const label = btn.querySelector('.speak-label');
  if (state === 'speaking') {
    btn.classList.add('speaking');
    if (label) label.textContent = '停止';
  } else if (state === 'loading') {
    btn.classList.add('loading');
    if (label) label.textContent = '加载中...';
  } else if (state === 'error') {
    btn.classList.add('speak-error');
    if (label) label.textContent = '朗读失败';
    setTimeout(function () { if (label) label.textContent = '朗读'; }, 2500);
  } else {
    if (label) label.textContent = labelText || '朗读';
  }
}

/* -------- 统一入口：切换某条消息的朗读状态 -------- */
function toggleSpeak(msgId) {
  // 已经在朗读这条 → 停止
  if (_tts.speaking && _tts.currentMsgId === msgId) {
    stopSpeaking();
    return;
  }
  // 朗读另一条 → 先停止旧的
  if (_tts.speaking) stopSpeaking();

  const msg = document.getElementById(msgId);
  if (!msg) return;
  let text = (msg.dataset && msg.dataset.text) ? msg.dataset.text : '';
  if (!text) {
    const textNode = msg.querySelector('.msg-text');
    text = textNode ? textNode.textContent : '';
  }
  text = _cleanForSpeak(text);
  if (!text) return;

  // 优先：浏览器内置
  if ('speechSynthesis' in window) {
    speakByBrowser(text, msgId);
    return;
  }
  // 降级：后端 TTS
  speakByVoicebox(text, msgId);
}

/* -------- 方案 A：浏览器内置 speechSynthesis（零网络 · 即时响应） -------- */
function speakByBrowser(text, msgId) {
  try {
    const u = new SpeechSynthesisUtterance(text);
    const v = _ttsPickBrowserVoice();
    if (v) u.voice = v;
    u.lang = (v && v.lang) || 'zh-CN';
    u.rate = 1.0;
    u.pitch = 1.0;
    u.volume = 1.0;
    u.onstart = function () {
      _tts.speaking = true;
      _tts.currentMsgId = msgId;
      _ttsUiState(msgId, 'speaking');
    };
    u.onend = function () {
      _tts.speaking = false;
      _ttsUiState(msgId, 'idle');
      _tts.currentMsgId = null;
    };
    u.onerror = function () {
      _tts.speaking = false;
      _ttsUiState(msgId, 'error');
      _tts.currentMsgId = null;
      // 浏览器 TTS 失败，尝试后端
      speakByVoicebox(text, msgId);
    };
    _tts.utter = u;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  } catch (err) {
    console.warn('[tts] browser failed:', err);
    speakByVoicebox(text, msgId);
  }
}

/* -------- 方案 B：后端 Voicebox TTS（音频流） -------- */
function speakByVoicebox(text, msgId) {
  _ttsUiState(msgId, 'loading');
  const payload = JSON.stringify({ text: text, profile_id: 'ai_assistant', language: 'zh' });
  fetch('/api/voicebox/generate', { method: 'POST', body: payload, headers: { 'Content-Type': 'application/json' } })
    .then(function (resp) {
      if (!resp.ok) {
        return resp.blob().then(function () { throw new Error('TTS 服务不可用'); });
      }
      const ctype = resp.headers.get('content-type') || '';
      if (!/audio|octet-stream|wave|mpeg/i.test(ctype)) {
        return resp.json().then(function (d) { throw new Error((d && d.error) || 'TTS 返回了非音频内容'); });
      }
      return resp.blob();
    })
    .then(function (blob) {
      if (!blob || blob.size < 100) throw new Error('返回的音频为空');
      const url = URL.createObjectURL(blob);
      const audio = new Audio(url);
      _tts.audio = audio;
      audio.onplay = function () {
        _tts.speaking = true;
        _tts.currentMsgId = msgId;
        _ttsUiState(msgId, 'speaking');
      };
      audio.onended = function () {
        _tts.speaking = false;
        _ttsUiState(msgId, 'idle');
        _tts.currentMsgId = null;
        try { URL.revokeObjectURL(url); } catch (e) {}
      };
      audio.onerror = function () {
        _tts.speaking = false;
        _ttsUiState(msgId, 'error');
        _tts.currentMsgId = null;
      };
      audio.play().catch(function () {
        _ttsUiState(msgId, 'error');
      });
    })
    .catch(function (err) {
      console.warn('[tts] voicebox failed:', err);
      _ttsUiState(msgId, 'error');
    });
}

function stopSpeaking() {
  try {
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
  } catch (e) {}
  if (_tts.audio) {
    try { _tts.audio.pause(); _tts.audio.currentTime = 0; } catch (e) {}
  }
  const currentId = _tts.currentMsgId;
  _tts.speaking = false;
  _tts.currentMsgId = null;
  if (currentId) _ttsUiState(currentId, 'idle');
}

/* -------- 键盘快捷键绑定（扩展已有键盘处理） -------- */
document.addEventListener('keydown', function (e) {
  // Ctrl+Shift+S：朗读最新一条 AI 消息
  if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'S' || e.key === 's')) {
    const msgs = document.querySelectorAll('.message[data-role="model"], .message[data-role="ai"]');
    if (!msgs.length) return;
    const last = msgs[msgs.length - 1];
    if (last && last.id) toggleSpeak(last.id);
    e.preventDefault();
  }
  // Ctrl+M：快捷语音输入（与按钮同功能）
  if ((e.ctrlKey || e.metaKey) && (e.key === 'M' || e.key === 'm') && !e.shiftKey && !e.altKey) {
    // 只有在聊天输入框聚焦时才拦截；其他场景（如编辑器）放行
    if (document.activeElement === inputBox) {
      toggleRecording();
      e.preventDefault();
    }
  }
  // Esc：停止朗读/录音
  if (e.key === 'Escape') {
    if (_voice.mode) stopVoiceInput();
    if (_tts.speaking) stopSpeaking();
  }
});

function showReviewResult(data, latency) {

'<div class="review-header">' +

'</div>' +
summaryHTML +
'<div class="review-score-wrap">' +
'<div class="review-score ' + scoreClass + '">' + totalScore.toFixed(1) + '</div>' +
'<div>' +
'<div class="review-score-label">综合评分</div>' +
'<div style="font-family:\'JetBrains Mono\',monospace;font-size:11px;color:var(--text-dim);">耗时 ' + (latency || '--') + 'ms</div>' +
'</div>' +

CHARTS · Chart.js 图表渲染
═══════════════════════════════════════ */
function renderChart(container, data) {
if (typeof Chart === 'undefined') {
container.innerHTML = '<div class="chart-fallback">[图表需要联网加载 Chart.js]</div>';
return;
}
var canvas = document.createElement('canvas');
container.appendChild(canvas);
new Chart(canvas, {
type: data.type === 'coordinate' ? 'scatter' : data.type,
data: { labels: data.labels, datasets: data.datasets },
options: {
responsive: true,
maintainAspectRatio: false,
plugins: {
title: { display: !!data.title, text: data.title, color: '#cdd6f4' },
legend: { labels: { color: '#a6adc8' } },
zoom: { zoom: { wheel: { enabled: true }, pinch: { enabled: true } } }
},
scales: data.type !== 'pie' ? {
x: { ticks: { color: '#a6adc8' }, grid: { color: '#313244' } },
y: { ticks: { color: '#a6adc8' }, grid: { color: '#313244' } }
} : {}
}
});
}

function renderChartsInElement(el) {
var containers = el.querySelectorAll('.chart-container[data-chart-config]');
for (var i = 0; i < containers.length; i++) {
var c = containers[i];
try {
var config = JSON.parse(decodeURIComponent(c.getAttribute('data-chart-config')));
if (config) {
renderChart(c, config);
}
} catch(e) {
c.innerHTML = '<div class="chart-fallback">[图表数据解析失败]</div>';
}
}
}

/* ═══════════════════════════════════════
   跨浏览器移动终端自适应 (Mobile Device Adaptation)
   ═══════════════════════════════════════ */

// ── 设备类型检测（现代 API + UA 回退） ──
function isTouchDevice() {
  try {
    return (
      'ontouchstart' in window ||
      (navigator.maxTouchPoints && navigator.maxTouchPoints > 0) ||
      (window.matchMedia && window.matchMedia('(pointer: coarse)').matches)
    );
  } catch (e) { return false; }
}
function isMobileUA() {
  try {
    return /Android|iPhone|iPad|iPod|webOS|BlackBerry|IEMobile|Opera Mini|HarmonyOS/i.test(navigator.userAgent || navigator.vendor || '');
  } catch (e) { return false; }
}
function isMobile() {
  return (isTouchDevice() && window.matchMedia &&
    window.matchMedia('(max-width: 768px), (orientation: landscape) and (max-height: 560px)').matches) ||
    isMobileUA();
}
function isTablet() {
  try { return /iPad|Android(?!.*Mobile)/i.test(navigator.userAgent || ''); }
  catch (e) { return false; }
}
function isPortrait() {
  try { return window.matchMedia('(orientation: portrait)').matches; }
  catch (e) { return window.innerHeight > window.innerWidth; }
}
function isLandscape() { return !isPortrait(); }

// ── 设置设备 class（CSS 可根据这些类进行精细调整） ──
(function applyDeviceClasses() {
  var body = document.body;
  if (isTouchDevice()) body.classList.add('device-touch');
  if (isMobile()) body.classList.add('device-mobile');
  if (isTablet()) body.classList.add('device-tablet');
  body.classList.toggle('orientation-portrait', isPortrait());
  body.classList.toggle('orientation-landscape', isLandscape());
})();

// ── 虚拟键盘适配（iOS Safari 的 visualViewport + Android 兼容） ──
var vv = typeof window.visualViewport !== 'undefined' ? window.visualViewport : null;
function handleKeyboardResize() {
  if (!vv) return;
  var delta = window.innerHeight - vv.height;
  if (delta > 150) {
    document.body.classList.add('keyboard-open');
  } else {
    document.body.classList.remove('keyboard-open');
  }
  var ta = document.getElementById('inputBox');
  if (ta && document.activeElement === ta) {
    setTimeout(function() {
      try { ta.scrollIntoView({ block: 'nearest', behavior: 'instant' }); }
      catch (e) { ta.scrollIntoView(false); }
    }, 100);
  }
}
if (vv) { vv.addEventListener('resize', handleKeyboardResize); vv.addEventListener('scroll', handleKeyboardResize); }

// ── 聚焦输入框时，确保输入框可见（兼容 Android） ──
document.addEventListener('focusin', function(e) {
  if (e.target && (e.target.id === 'inputBox' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT')) {
    setTimeout(function() {
      try { e.target.scrollIntoView({ block: 'nearest', behavior: 'instant' }); }
      catch (err) { e.target.scrollIntoView(false); }
    }, 200);
  }
});

// ── 窗口尺寸 / 方向变化时重新评估设备类 ──
var resizeTimer;
window.addEventListener('resize', function() {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(function() {
    var body = document.body;
    body.classList.toggle('orientation-portrait', isPortrait());
    body.classList.toggle('orientation-landscape', isLandscape());
    body.classList.toggle('device-mobile', isMobile());
  }, 200);
});

// ── orientationchange 事件（旧版 Safari/Android） ──
window.addEventListener('orientationchange', function() {
  setTimeout(function() {
    var body = document.body;
    body.classList.toggle('orientation-portrait', isPortrait());
    body.classList.toggle('orientation-landscape', isLandscape());
  }, 300);
});

// ── 阻止 iOS Safari 双击缩放（按钮上） ──
(function preventDoubleTapZoom() {
  var lastTouchEnd = 0;
  document.addEventListener('touchend', function(e) {
    var now = Date.now();
    if (now - lastTouchEnd <= 300) {
      var t = e.target;
      if (t && (t.tagName === 'BUTTON' || t.tagName === 'SELECT' || t.classList && (
        t.classList.contains('btn-send') ||
        t.classList.contains('btn-mic') ||
        t.classList.contains('btn-ocr') ||
        t.classList.contains('btn-clear') ||
        t.classList.contains('btn-resources') ||
        t.classList.contains('btn-review') ||
        t.classList.contains('btn-speak') ||
        t.classList.contains('feynman-toggle') ||
        t.classList.contains('feynman-switch')
      ))) { e.preventDefault(); }
    }
    lastTouchEnd = now;
  }, { passive: false });
})();

// ── 长按消息：弹出复制/朗读操作菜单（移动端） ──
(function longPressMenu() {
  var menu = document.createElement('div');
  menu.className = 'long-press-menu';
  menu.innerHTML =
    '<button data-action="copy">复制文字</button>' +
    '<button data-action="speak">朗读</button>' +
    '<button data-action="copy-full">复制全文</button>';
  document.body.appendChild(menu);

  var pressTimer = null;
  var pressTarget = null;
  var touchStartX = 0, touchStartY = 0;
  var LONG_PRESS_MS = 500;

  function hideMenu() { menu.classList.remove('visible'); pressTarget = null; }
  function showMenu(x, y, messageEl) {
    var mw = 160, mh = 140;
    var maxX = window.innerWidth - mw - 8;
    var maxY = window.innerHeight - mh - 8;
    menu.style.left = Math.min(Math.max(8, x), maxX) + 'px';
    menu.style.top = Math.min(Math.max(8, y), maxY) + 'px';
    menu.classList.add('visible');
    pressTarget = messageEl;
  }
  function findMessageEl(el) {
    while (el && el !== document.body) {
      if (el.classList && (el.classList.contains('message') || el.classList.contains('msg-text'))) return el;
      el = el.parentNode;
    }
    return null;
  }
  function getMessageText(el) {
    if (!el) return '';
    var t = el.querySelector ? el.querySelector('.msg-text') : null;
    if (t) return t.innerText || t.textContent || '';
    return el.innerText || el.textContent || '';
  }
  function safeCopy(text) {
    if (!text) return;
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).catch(function() { fallbackCopy(text); });
      } else { fallbackCopy(text); }
    } catch (e) { fallbackCopy(text); }
  }
  function fallbackCopy(text) {
    try {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch (err) {}
      document.body.removeChild(ta);
    } catch (e) {}
  }

  // 触摸设备：touchstart / touchend
  document.addEventListener('touchstart', function(e) {
    var el = findMessageEl(e.target);
    if (!el) return;
    clearTimeout(pressTimer);
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    pressTimer = setTimeout(function() {
      var selection = window.getSelection();
      if (!selection || selection.toString().length === 0) {
        if (navigator.vibrate) try { navigator.vibrate(15); } catch (err) {}
        showMenu(touchStartX, touchStartY, el);
      }
    }, LONG_PRESS_MS);
  }, { passive: true });
  document.addEventListener('touchmove', function(e) {
    if (pressTimer) {
      var dx = e.touches[0].clientX - touchStartX;
      var dy = e.touches[0].clientY - touchStartY;
      if (Math.abs(dx) > 10 || Math.abs(dy) > 10) {
        clearTimeout(pressTimer); pressTimer = null;
      }
    }
  }, { passive: true });
  document.addEventListener('touchend', function() {
    clearTimeout(pressTimer); pressTimer = null;
  }, { passive: true });

  // 桌面端：右键
  document.addEventListener('contextmenu', function(e) {
    var el = findMessageEl(e.target);
    if (!el) return;
    e.preventDefault();
    showMenu(e.clientX, e.clientY, el);
  });

  // 点击其他区域关闭菜单
  document.addEventListener('click', function(e) {
    if (menu.classList.contains('visible') && !menu.contains(e.target)) hideMenu();
  }, true);

  // 菜单按钮动作
  menu.addEventListener('click', function(e) {
    var btn = e.target.closest('button');
    if (!btn || !pressTarget) return;
    var action = btn.getAttribute('data-action');
    var text = getMessageText(pressTarget);
    if (action === 'copy' || action === 'copy-full') safeCopy(text);
    if (action === 'speak' && typeof speakText === 'function') speakText(text);
    hideMenu();
  });

  document.addEventListener('keydown', function(e) { if (e.key === 'Escape') hideMenu(); });
})();

// ── 移动端软键盘：Enter 发送（Shift+Enter 换行） ──
(function mobileEnterToSend() {
  var ta = document.getElementById('inputBox');
  if (!ta) return;
  ta.addEventListener('keydown', function(e) {
    if (!isTouchDevice()) return;
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      if (typeof sendChat === 'function') sendChat();
    }
  });
})();

// ── 动态视口高度（解决 iOS Safari 15+ 地址栏） ──
(function dynamicViewportHeight() {
  function setVh() {
    var vh = window.innerHeight * 0.01;
    document.documentElement.style.setProperty('--vh', vh + 'px');
  }
  setVh();
  window.addEventListener('resize', setVh);
  window.addEventListener('orientationchange', function() { setTimeout(setVh, 200); });
})();
</script>
