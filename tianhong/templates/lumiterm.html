<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LumiTerminal · v5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Poppins:wght@400;500;600&family=Lora:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg-deep: #08080d;
  --bg-surface: #141413;
  --bg-elevated: #1c1c1a;
  --text-primary: #faf9f5;
  --text-secondary: #b0aea5;
  --text-dim: #6b6b6b;
  --accent-orange: #d97757;
  --accent-blue: #6a9bcc;
  --accent-green: #788c5d;
  --border: #2a2a2a;
  --glow-orange: rgba(217, 119, 87, 0.15);
  --glow-blue: rgba(106, 155, 204, 0.1);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Poppins', system-ui, sans-serif;
  background: var(--bg-deep);
  color: var(--text-primary);
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
canvas#stars {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 0;
  pointer-events: none;
}

/* ── Header ── */
.header {
  position: relative; z-index: 2;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 28px;
  background: rgba(20, 20, 19, 0.85);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  background: var(--accent-orange);
  box-shadow: 0 0 12px var(--accent-orange);
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.6; transform: scale(1.3); }
}
.brand-dot.active { animation-duration: 0.6s; }
.brand h1 {
  font-family: 'Lora', serif;
  font-size: 18px;
  font-weight: 500;
  color: var(--text-primary);
  letter-spacing: -0.3px;
}
.model-badge {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--accent-orange);
  background: rgba(217, 119, 87, 0.1);
  padding: 4px 12px;
  border-radius: 20px;
  border: 1px solid rgba(217, 119, 87, 0.2);
}
.header-right { display: flex; align-items: center; gap: 16px; }
.header-right select {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  background: var(--bg-elevated);
  color: var(--text-primary);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 6px 12px;
  cursor: pointer;
  outline: none;
}
.header-right select:focus { border-color: var(--accent-blue); }
.status-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--accent-green);
  box-shadow: 0 0 6px var(--accent-green);
}
.latency {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--text-dim);
}

/* ── Chat Area ── */
.chat {
  position: relative; z-index: 2;
  flex: 1;
  overflow-y: auto;
  padding: 32px 28px;
  display: flex;
  flex-direction: column;
  gap: 28px;
  scroll-behavior: smooth;
}
.chat::-webkit-scrollbar { width: 4px; }
.chat::-webkit-scrollbar-track { background: transparent; }
.chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.message { display: flex; gap: 14px; animation: msgIn 0.4s ease-out; }
@keyframes msgIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}
.msg-avatar {
  width: 32px; height: 32px;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 600;
  flex-shrink: 0;
}
.msg-avatar.user { background: var(--accent-blue); color: white; }
.msg-avatar.model { background: var(--accent-orange); color: white; }
.msg-content {
  flex: 1;
  min-width: 0;
}
.msg-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 6px;
}
.msg-text {
  font-family: 'Lora', Georgia, serif;
  font-size: 15px;
  line-height: 1.75;
  color: var(--text-primary);
}
.msg-text h1, .msg-text h2, .msg-text h3 {
  font-family: 'Poppins', system-ui, sans-serif;
  color: var(--accent-orange);
  margin: 16px 0 8px;
  font-weight: 500;
}
.msg-text h3 { font-size: 16px; }
.msg-text p { margin-bottom: 10px; }
.msg-text code {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  background: var(--bg-elevated);
  padding: 2px 6px;
  border-radius: 4px;
  color: var(--accent-blue);
}
.msg-text .math-inline {
  font-family: 'JetBrains Mono', monospace;
  font-size: 14px;
  color: var(--accent-green);
  background: rgba(120, 140, 93, 0.08);
  padding: 2px 6px;
  border-radius: 3px;
  letter-spacing: 0.3px;
}
.msg-text pre {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px;
  margin: 12px 0;
  overflow-x: auto;
}
.msg-text pre code {
  background: none;
  padding: 0;
  color: var(--accent-green);
}
.msg-text strong { color: var(--accent-orange); font-weight: 500; }
.msg-text em { color: var(--text-secondary); }
.msg-text ul, .msg-text ol { margin: 8px 0 8px 20px; }
.msg-text li { margin-bottom: 4px; }
.msg-text blockquote {
  border-left: 2px solid var(--accent-orange);
  padding-left: 14px;
  color: var(--text-secondary);
  margin: 10px 0;
  font-style: italic;
}

.welcome {
  text-align: center;
  padding: 60px 20px;
  opacity: 0.7;
}
.welcome h2 {
  font-family: 'Lora', serif;
  font-size: 24px;
  color: var(--text-primary);
  margin-bottom: 12px;
}
.welcome p {
  color: var(--text-secondary);
  font-size: 14px;
  max-width: 480px;
  margin: 0 auto;
  line-height: 1.6;
}
.welcome .hint {
  margin-top: 20px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--text-dim);
}

/* ── Input ── */
.input-bar {
  position: relative; z-index: 2;
  padding: 16px 28px;
  background: rgba(20, 20, 19, 0.9);
  backdrop-filter: blur(16px);
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}
.input-wrap {
  display: flex;
  gap: 12px;
  align-items: flex-end;
}
.input-wrap textarea {
  flex: 1;
  font-family: 'JetBrains Mono', monospace;
  font-size: 14px;
  background: var(--bg-elevated);
  color: var(--text-primary);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px 16px;
  resize: none;
  outline: none;
  line-height: 1.5;
  min-height: 44px;
  max-height: 160px;
  transition: border-color 0.2s;
}
.input-wrap textarea:focus { border-color: var(--accent-orange); }
.input-wrap textarea::placeholder { color: var(--text-dim); }
.btn-send {
  flex-shrink: 0;
  width: 44px; height: 44px;
  background: var(--accent-orange);
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 18px;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
}
.btn-send:hover { background: #c86641; transform: translateY(-1px); }
.btn-send:disabled {
  background: var(--border);
  cursor: not-allowed;
  transform: none;
}
.btn-clear {
  flex-shrink: 0;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  background: none;
  color: var(--text-dim);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px 14px;
  cursor: pointer;
  transition: all 0.2s;
}
.btn-clear:hover { color: var(--text-primary); border-color: var(--text-dim); }
.cursor-blink {
  display: inline-block;
  width: 2px; height: 16px;
  background: var(--accent-orange);
  margin-left: 2px;
  animation: blink 1s step-end infinite;
  vertical-align: text-bottom;
}
@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0; }
}
</style>
</head>
<body>

<canvas id="stars"></canvas>

<div class="header">
  <div class="brand">
    <div class="brand-dot" id="brandDot"></div>
    <h1>LumiTerminal</h1>
    <span class="model-badge" id="modelBadge">v5</span>
  </div>
  <div class="header-right">
    <select id="modelSelect" onchange="switchModel()">
      <option value="lumilearn-v5:latest">lumilearn-v5</option>
      <option value="qwen2.5:7b">qwen2.5:7b</option>
      <option value="deepseek-r1:1.5b">deepseek-r1:1.5b</option>
    </select>
    <div class="status-dot" id="statusDot"></div>
    <span class="latency" id="latencyDisplay">--</span>
  </div>
</div>

<div class="chat" id="chatArea">
  <div class="welcome">
    <h2>LumiLearn V5 Observatory</h2>
    <p>AI 生成的教育内容如星座般在深邃的数字空间中渐次点亮。输入你的问题开始探索。</p>
    <div class="hint">Enter 发送 · Shift+Enter 换行 · Ctrl+L 清屏</div>
  </div>
</div>

<div class="input-bar">
  <div class="input-wrap">
    <textarea id="inputBox" rows="1" placeholder="> 输入你的问题..." onkeydown="handleKey(event)"></textarea>
    <button class="btn-send" id="btnSend" onclick="sendMessage()">↑</button>
    <button class="btn-clear" onclick="clearChat()">Ctrl+L</button>
  </div>
</div>

<script>
/* ═══════════════════════════════════════
   STAR FIELD · Algorithmic Art Background
   ═══════════════════════════════════════ */
const canvas = document.getElementById('stars');
const ctx = canvas.getContext('2d');
let stars = [];
let generating = false;

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

function initStars(count = 180) {
  stars = [];
  for (let i = 0; i < count; i++) {
    stars.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 1.6 + 0.4,
      baseR: Math.random() * 1.6 + 0.4,
      vx: (Math.random() - 0.5) * 0.15,
      vy: (Math.random() - 0.5) * 0.15,
      twinkle: Math.random() * Math.PI * 2,
      twinkleSpeed: Math.random() * 0.02 + 0.005,
      brightness: Math.random() * 0.5 + 0.5,
      hue: Math.random() < 0.08 ? 30 : Math.random() < 0.15 ? 210 : 0
    });
  }
}
initStars();

function drawStars() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  for (let s of stars) {
    s.x += s.vx * (generating ? 2.5 : 1);
    s.y += s.vy * (generating ? 2.5 : 1);
    if (s.x < 0) s.x = canvas.width;
    if (s.x > canvas.width) s.x = 0;
    if (s.y < 0) s.y = canvas.height;
    if (s.y > canvas.height) s.y = 0;

    s.twinkle += s.twinkleSpeed;
    let alpha = s.brightness + Math.sin(s.twinkle) * 0.25;
    if (generating) alpha = Math.min(1, alpha + 0.2);
    s.r = s.baseR + Math.sin(s.twinkle) * 0.3;

    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);

    if (s.hue === 30) {
      ctx.fillStyle = `rgba(217,119,87,${alpha})`;
      if (generating) {
        ctx.shadowBlur = 6;
        ctx.shadowColor = '#d97757';
      }
    } else if (s.hue === 210) {
      ctx.fillStyle = `rgba(106,155,204,${alpha})`;
    } else {
      ctx.fillStyle = `rgba(250,249,245,${alpha})`;
    }
    ctx.fill();
    ctx.shadowBlur = 0;
  }
  requestAnimationFrame(drawStars);
}
drawStars();

/* ═══════════════════════════════════════
   CHAT · Terminal Logic
   ═══════════════════════════════════════ */
let currentModel = 'lumilearn-v5:latest';
const chatArea = document.getElementById('chatArea');
const inputBox = document.getElementById('inputBox');
const btnSend = document.getElementById('btnSend');
const brandDot = document.getElementById('brandDot');
const statusDot = document.getElementById('statusDot');
const latencyDisplay = document.getElementById('latencyDisplay');
const modelBadge = document.getElementById('modelBadge');
const modelSelect = document.getElementById('modelSelect');

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
  if (e.key === 'l' && e.ctrlKey) {
    e.preventDefault();
    clearChat();
  }
}

function switchModel() {
  currentModel = modelSelect.value;
  let short = currentModel.includes('v5') ? 'v5' :
              currentModel.includes('qwen') ? 'qwen' :
              currentModel.includes('deepseek') ? 'r1' : '--';
  modelBadge.textContent = short;
  if (short === 'v5') modelBadge.style.color = '#d97757';
  else if (short === 'qwen') modelBadge.style.color = '#6a9bcc';
  else modelBadge.style.color = '#788c5d';
}

function clearChat() {
  chatArea.innerHTML = `
    <div class="welcome">
      <h2>LumiLearn V5 Observatory</h2>
      <p>AI 生成的教育内容如星座般在深邃的数字空间中渐次点亮。输入你的问题开始探索。</p>
      <div class="hint">Enter 发送 · Shift+Enter 换行 · Ctrl+L 清屏</div>
    </div>`;
}

function addMessage(role, text) {
  let welcome = chatArea.querySelector('.welcome');
  if (welcome) welcome.remove();

  let div = document.createElement('div');
  div.className = 'message';
  div.innerHTML = `
    <div class="msg-avatar ${role}">${role === 'user' ? 'U' : 'AI'}</div>
    <div class="msg-content">
      <div class="msg-label">${role === 'user' ? 'You' : currentModel}</div>
      <div class="msg-text">${text}</div>
    </div>`;
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
  return div;
}

function addStreamingMessage() {
  let welcome = chatArea.querySelector('.welcome');
  if (welcome) welcome.remove();

  let div = document.createElement('div');
  div.className = 'message';
  div.id = 'streamingMsg';
  div.innerHTML = `
    <div class="msg-avatar model">AI</div>
    <div class="msg-content">
      <div class="msg-label">${currentModel}</div>
      <div class="msg-text" id="streamingText"><span class="cursor-blink"></span></div>
    </div>`;
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
  return div;
}

function convertLatex(formula) {
  return formula
    .replace(/\\cdot\s*/g, '')
    .replace(/\\times\s*/g, '×')
    .replace(/\\div\s*/g, '÷')
    .replace(/\\pm\s*/g, '±')
    .replace(/\\le\s*/g, '≤')
    .replace(/\\ge\s*/g, '≥')
    .replace(/\\ne\s*/g, '≠')
    .replace(/\\approx\s*/g, '≈')
    .replace(/\\infty/g, '∞')
    .replace(/\\sqrt\{([^}]+)\}/g, '√($1)')
    .replace(/\\frac\{([^}]+)\}\{([^}]+)\}/g, '($1)/($2)')
    .replace(/\\sum/g, '∑')
    .replace(/\\int/g, '∫')
    .replace(/\\alpha/g, 'α')
    .replace(/\\beta/g, 'β')
    .replace(/\\pi/g, 'π')
    .replace(/\\theta/g, 'θ')
    .replace(/\\Delta/g, 'Δ')
    .replace(/\^\{([^}]+)\}/g, '^$1')
    .replace(/_\{([^}]+)\}/g, '_$1')
    .replace(/\\/g, '');
}

function simpleMarkdown(text) {
  text = text
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

  text = text.replace(/\\\(\s*(.+?)\s*\\\)/g, function(match, formula) {
    return '<span class="math-inline">' + convertLatex(formula) + '</span>';
  });

  text = text.replace(/\\\[\s*(.+?)\s*\\\]/g, function(match, formula) {
    return '<br><span class="math-inline">' + convertLatex(formula) + '</span><br>';
  });

  return text
    .replace(/^### (.+)$/gm, '<h3>$1</h3>')
    .replace(/^## (.+)$/gm, '<h2>$1</h2>')
    .replace(/^# (.+)$/gm, '<h1>$1</h1>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>')
    .replace(/^- (.+)$/gm, '<li>$1</li>')
    .replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>')
    .replace(/\n/g, '<br>');
}

async function sendMessage() {
  let text = inputBox.value.trim();
  if (!text) return;

  inputBox.value = '';
  inputBox.style.height = '44px';
  btnSend.disabled = true;

  addMessage('user', simpleMarkdown(text));
  addStreamingMessage();

  generating = true;
  brandDot.classList.add('active');
  statusDot.style.background = '#d97757';
  statusDot.style.boxShadow = '0 0 8px #d97757';

  let streamingText = document.getElementById('streamingText');
  let fullText = '';
  let cursorSpan = '<span class="cursor-blink"></span>';

  let controller = new AbortController();
  let timeoutId = setTimeout(function() { controller.abort(); }, 120000);

  try {
    let t0 = performance.now();
    let resp = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: currentModel,
        messages: [{ role: 'user', content: text }],
        stream: true
      }),
      signal: controller.signal
    });

    if (!resp.ok) {
      let errData = await resp.json().catch(function() { return {}; });
      throw new Error(errData.error || 'HTTP ' + resp.status);
    }

    let reader = resp.body.getReader();
    let decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      let { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      let lines = buffer.split('\n');
      buffer = lines.pop() || '';

      for (let line of lines) {
        if (!line.trim()) continue;
        try {
          let chunk = JSON.parse(line);

          let content = chunk?.message?.content || '';
          fullText += content;
          streamingText.innerHTML = simpleMarkdown(fullText) + cursorSpan;
          chatArea.scrollTop = chatArea.scrollHeight;
        } catch(e) {}
      }
    }

    clearTimeout(timeoutId);
    let latency = Math.round(performance.now() - t0);
    latencyDisplay.textContent = latency + 'ms';
    streamingText.innerHTML = simpleMarkdown(fullText || '(模型返回为空，请检查 Modelfile 配置)');

  } catch(e) {
    clearTimeout(timeoutId);
    let errMsg = e.name === 'AbortError' ? '请求超时（120秒）' : '连接失败: ' + e.message;
    streamingText.innerHTML = simpleMarkdown(errMsg);
    statusDot.style.background = '#f85149';
    statusDot.style.boxShadow = '0 0 8px #f85149';
  }

  document.getElementById('streamingMsg').removeAttribute('id');

  generating = false;
  brandDot.classList.remove('active');
  statusDot.style.background = '#788c5d';
  statusDot.style.boxShadow = '0 0 6px #788c5d';
  btnSend.disabled = false;
  inputBox.focus();
}

// Auto-resize textarea
inputBox.addEventListener('input', () => {
  inputBox.style.height = '44px';
  inputBox.style.height = Math.min(inputBox.scrollHeight, 160) + 'px';
});

// Check connection
async function checkStatus() {
  try {
    let t0 = performance.now();
    let resp = await fetch('/api/status');
    let data = await resp.json();
    let lt = Math.round(performance.now() - t0);
    if (data.gateway === 'online') {
      statusDot.style.background = '#788c5d';
      statusDot.style.boxShadow = '0 0 6px #788c5d';
      latencyDisplay.textContent = lt + 'ms';
    }
  } catch(e) {}
}
checkStatus();
setInterval(checkStatus, 30000);
</script>
</body>
</html>
